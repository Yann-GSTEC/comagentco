let clientImportParsedRows = null;
function openClientImportModal(){
  clientImportParsedRows = null;
  openModal(`
    <div class="modal-head"><h3>Importer des clients (Excel ou CSV)</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="helper" style="margin-bottom:12px;">Si plusieurs clients de votre fichier ont exactement le même Nom (et la même Société), ils seront fusionnés en un seul par défaut — décochez l'option ci-dessous si vous préférez que chaque ligne crée un client distinct.</div>
      <div class="helper" style="margin-bottom:12px;">Seule <strong>une</strong> des deux colonnes Nom ou Société doit être renseignée pour qu'une ligne soit importée (utile pour les fichiers B2B qui n'ont qu'une société, sans nom de personne).</div>
      <div class="field"><label><input type="checkbox" id="cimp_merge" checked style="width:auto;display:inline-block;margin-right:6px;">Mettre à jour le client existant en cas de Nom + Société identiques (sinon : toujours créer un nouveau client)</label></div>
      <label>Fichier</label>
      <div class="upload-zone" onclick="document.getElementById('cimp_file').click()">
        <input type="file" id="cimp_file" accept=".csv,.xlsx,.xls" onchange="handleClientImportFile(event)">
        <div id="cimp_zoneText">📄 Cliquez pour choisir un fichier .xlsx, .xls ou .csv</div>
      </div>
      <div id="cimp_mapping"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="cimp_confirmBtn" style="display:none;" onclick="confirmClientImport()">Importer</button>
    </div>
  `, {lg:true});
}
function handleClientImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  document.getElementById('cimp_zoneText').innerHTML = `✔ ${escapeHtml(file.name)}`;
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    Papa.parse(file, {
      header:false, skipEmptyLines:true,
      complete: (res)=>{ clientImportParsedRows = res.data; renderClientImportMapping(); },
      error: ()=> showToast('Impossible de lire ce fichier CSV.')
    });
  } else if(ext==='xlsx' || ext==='xls'){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, {header:1, raw:false, defval:''});
        clientImportParsedRows = rows.filter(r=>r.some(cell=>String(cell).trim()!==''));
        renderClientImportMapping();
      }catch(err){
        showToast('Impossible de lire ce fichier Excel.');
      }
    };
    reader.onerror = ()=> showToast('Impossible de lire ce fichier.');
    reader.readAsArrayBuffer(file);
  } else {
    showToast('Format non pris en charge. Utilisez .xlsx, .xls ou .csv');
  }
}
function renderClientImportMapping(){
  if(!clientImportParsedRows || clientImportParsedRows.length===0){ showToast('Fichier vide ou illisible.'); return; }
  const first = clientImportParsedRows[0];
  const nCols = first.length;
  const opts = (guessIdx)=> `<option value="-1">— Non utilisé —</option>` + Array.from({length:nCols}).map((_,i)=>`<option value="${i}" ${i===guessIdx?'selected':''}>Colonne ${i+1}: "${escapeHtml(String(first[i]||'').slice(0,24))}"</option>`).join('');
  const guess = (label)=>{
    const norm = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    const target = norm(label.replace('*','').trim());
    const idx = first.findIndex(cell=>norm(cell)===target);
    return idx;
  };
  document.getElementById('cimp_mapping').innerHTML = `
    <div class="divider"></div>
    <div class="field"><label><input type="checkbox" id="cimp_hasHeader" checked style="width:auto;display:inline-block;margin-right:6px;">La première ligne est un en-tête</label></div>
    <div class="section-title">Correspondance des colonnes</div>
    ${CLIENT_IMPORT_FIELDS.map(f=>`
      <div class="field-row">
        <div class="field" style="max-width:220px;margin-bottom:8px;"><label style="margin-bottom:2px;">${escapeHtml(f.label)}</label></div>
        <div class="field" style="margin-bottom:8px;"><select id="cimp_col_${f.key}">${opts(guess(f.label))}</select></div>
      </div>
    `).join('')}
    <div class="helper">${clientImportParsedRows.length} ligne(s) détectée(s) dans le fichier.</div>
  `;
  document.getElementById('cimp_confirmBtn').style.display='inline-flex';
}
function confirmClientImport(){
  const hasHeader = document.getElementById('cimp_hasHeader').checked;
  const mergeEnabled = document.getElementById('cimp_merge').checked;
  const colMap = {};
  CLIENT_IMPORT_FIELDS.forEach(f=>{
    const v = parseInt(document.getElementById('cimp_col_'+f.key).value);
    colMap[f.key] = v;
  });
  if((colMap.name===-1 || isNaN(colMap.name)) && (colMap.company===-1 || isNaN(colMap.company))){
    showToast('Associez au moins la colonne Nom ou la colonne Société.');
    return;
  }
  let rows = clientImportParsedRows.slice(hasHeader?1:0);
  const firstRowNum = hasHeader?2:1; // pour retrouver le n° de ligne réel du fichier
  let added=0, updated=0;
  const skippedRows = [];
  const mergedRows = [];
  rows.forEach((row, idx)=>{
    const rowNum = firstRowNum+idx;
    const get = (key)=>{
      const i = colMap[key];
      return (i!==undefined && i>=0 && i!==-1) ? String(row[i]||'').trim() : '';
    };
    const rawName = get('name');
    const company = get('company');
    if(!rawName && !company){ skippedRows.push({rowNum, reason:'Nom et Société vides'}); return; }
    const name = rawName || company;
    const contactCivilite = get('civilite');
    const contactPrenom = get('prenom');
    const contactFonction = get('fonction');
    const contactTelephone = get('telephone');
    const contactPortable = get('portable');
    const contactEmail = get('email');
    const hasContactInfo = !!(contactCivilite || contactPrenom || contactFonction || contactTelephone || contactPortable || contactEmail);
    const data = {
      name,
      company,
      adresse1: get('adresse1'),
      adresse2: get('adresse2'),
      codePostal: get('codePostal'),
      ville: get('ville'),
      pays: get('pays'),
      siteInternet: get('siteInternet'),
      famille: get('famille'),
      sousFamille: get('sousFamille'),
      segment: get('segment'),
      typeClient: get('typeClient'),
      canalDistribution: get('canalDistribution'),
      notes: get('notes'),
    };
    const existing = mergeEnabled ? state.clients.find(c=>
      c.name.toLowerCase()===name.toLowerCase() && (c.company||'').toLowerCase()===(data.company||'').toLowerCase()
    ) : null;
    if(existing){
      mergedRows.push({rowNum, name, company:data.company});
      Object.assign(existing, data);
      if(hasContactInfo){
        existing.contacts = existing.contacts || [];
        const key = contactEmail.toLowerCase();
        const already = key && existing.contacts.some(p=>(p.email||'').toLowerCase()===key);
        if(!already){
          existing.contacts.push({id:uid(), civilite:contactCivilite, nom:rawName||name, prenom:contactPrenom, fonction:contactFonction, telephone:contactTelephone, portable:contactPortable, email:contactEmail, commentaire:''});
        }
      }
      updated++;
    } else {
      const contacts = [];
      if(hasContactInfo){
        contacts.push({id:uid(), civilite:contactCivilite, nom:rawName||name, prenom:contactPrenom, fonction:contactFonction, telephone:contactTelephone, portable:contactPortable, email:contactEmail, commentaire:''});
      }
      state.clients.push({id:uid(), history:[], actif:true, contacts, ...data});
      added++;
    }
  });
  persist('clients');
  closeModal();
  render();
  showClientImportReport(rows.length, added, updated, skippedRows, mergedRows);
}
function showClientImportReport(totalRows, added, updated, skippedRows, mergedRows){
  const skippedList = skippedRows.length ? `
    <div class="section-title" style="margin-top:14px;">Lignes ignorées — Nom et Société vides (${skippedRows.length})</div>
    <div class="helper">${skippedRows.map(r=>'Ligne '+r.rowNum).join(', ')}</div>
  ` : '';
  const mergedList = mergedRows.length ? `
    <div class="section-title" style="margin-top:14px;">Lignes fusionnées avec un client existant (${mergedRows.length})</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Ligne</th><th>Nom</th><th>Société</th></tr></thead>
      <tbody>${mergedRows.map(r=>`<tr><td>${r.rowNum}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.company||'—')}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="helper">Ces lignes n'ont pas créé de nouveau client car un client avec le même Nom + Société existait déjà (soit dans un import précédent, soit ailleurs dans ce même fichier).</div>
  ` : '';
  openModal(`
    <div class="modal-head"><h3>Résultat de l'import</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="helper" style="font-size:14px;color:var(--ink);margin-bottom:4px;"><strong>${totalRows}</strong> ligne(s) lues dans le fichier</div>
      <div class="helper" style="font-size:14px;color:var(--success);margin-bottom:4px;"><strong>${added}</strong> client(s) créé(s)</div>
      <div class="helper" style="font-size:14px;margin-bottom:4px;"><strong>${updated}</strong> client(s) mis à jour (fusionnés)</div>
      <div class="helper" style="font-size:14px;margin-bottom:4px;"><strong>${skippedRows.length}</strong> ligne(s) ignorée(s)</div>
      ${mergedList}
      ${skippedList}
      ${(skippedRows.length===0 && mergedRows.length===0)?'<div class="helper" style="margin-top:14px;">Toutes les lignes du fichier ont été importées comme nouveaux clients.</div>':''}
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">Fermer</button></div>
  `, {lg:true});
}
function exportClientsExcel(){
  if(state.clients.length===0){ showToast('Aucun client à exporter.'); return; }
  const headers = CLIENT_IMPORT_FIELDS.map(f=>f.label.replace(' *',''));
  const rows = state.clients.map(c=> CLIENT_IMPORT_FIELDS.map(f=> f.key==='notes' ? stripHtml(c.notes||'') : (c[f.key]!==undefined ? c[f.key] : '')));
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Clients');
  XLSX.writeFile(wb, `clients_${todayStr()}.xlsx`);
  showToast('Export réalisé.');
}

function handleHistoryImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  document.getElementById('himp_zoneText').innerHTML = `✔ ${escapeHtml(file.name)}`;
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    Papa.parse(file, {
      header:false, skipEmptyLines:true,
      complete: (res)=>{ historyImportParsedRows = res.data; renderHistoryImportMapping(); },
      error: ()=> showToast('Impossible de lire ce fichier CSV.')
    });
  } else if(ext==='xlsx' || ext==='xls'){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, {header:1, raw:false, defval:'', dateNF:'yyyy-mm-dd'});
        historyImportParsedRows = rows.filter(r=>r.some(cell=>String(cell).trim()!==''));
        renderHistoryImportMapping();
      }catch(err){
        showToast('Impossible de lire ce fichier Excel.');
      }
    };
    reader.onerror = ()=> showToast('Impossible de lire ce fichier.');
    reader.readAsArrayBuffer(file);
  } else {
    showToast('Format non pris en charge. Utilisez .xlsx, .xls ou .csv');
  }
}
function renderHistoryImportMapping(){
  if(!historyImportParsedRows || historyImportParsedRows.length===0){ showToast('Fichier vide ou illisible.'); return; }
  const first = historyImportParsedRows[0];
  const nCols = first.length;
  const opts = (guessIdx)=> `<option value="-1">— Non utilisé —</option>` + Array.from({length:nCols}).map((_,i)=>`<option value="${i}" ${i===guessIdx?'selected':''}>Colonne ${i+1}: "${escapeHtml(String(first[i]||'').slice(0,24))}"</option>`).join('');
  const guessWithAliases = (field)=>{
    const norm = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    let idx = first.findIndex(cell=>norm(cell)===norm(field.label));
    if(idx>=0) return idx;
    const aliasMap = {
      client: ['societe','client','nom du client','raison sociale'],
      codePostal: ['code postal','cp'],
      ville: ['ville'],
      date: ['date du suivi','date du rdv','date rdv','date de la visite','date visite','date'],
      action: ['action prochaine','prochaine action','action a venir','suite a donner'],
      resume: ['resume','compte rendu','compte-rendu','compte rendu du rendez-vous','synthese'],
    };
    const candidates = aliasMap[field.key]||[];
    idx = first.findIndex(cell=>candidates.includes(norm(cell)));
    return idx;
  };
  document.getElementById('himp_mapping').innerHTML = `
    <div class="divider"></div>
    <div class="field"><label><input type="checkbox" id="himp_hasHeader" checked style="width:auto;display:inline-block;margin-right:6px;">La première ligne est un en-tête</label></div>
    <div class="section-title">Correspondance des colonnes</div>
    ${HISTORY_IMPORT_FIELDS.map(f=>`
      <div class="field-row">
        <div class="field" style="max-width:220px;margin-bottom:8px;"><label style="margin-bottom:2px;">${escapeHtml(f.label)}</label></div>
        <div class="field" style="margin-bottom:8px;"><select id="himp_col_${f.key}">${opts(guessWithAliases(f))}</select></div>
      </div>
    `).join('')}
    <div class="helper">${historyImportParsedRows.length} ligne(s) détectée(s) dans le fichier.</div>
  `;
  document.getElementById('himp_confirmBtn').style.display='inline-flex';
}
function confirmHistoryImport(){
  const hasHeader = document.getElementById('himp_hasHeader').checked;
  const colMap = {};
  HISTORY_IMPORT_FIELDS.forEach(f=>{
    colMap[f.key] = parseInt(document.getElementById('himp_col_'+f.key).value);
  });
  if(colMap.client===-1 || isNaN(colMap.client)){
    showToast('Associez au moins la colonne Client.');
    return;
  }
  let rows = historyImportParsedRows.slice(hasHeader?1:0);
  const firstRowNum = hasHeader?2:1;
  let added=0;
  const notFound = [];
  const ambiguous = [];
  const skippedRows = [];

  rows.forEach((row, idx)=>{
    const rowNum = firstRowNum+idx;
    const get = (key)=>{
      const i = colMap[key];
      return (i!==undefined && i>=0) ? String(row[i]||'').trim() : '';
    };
    const clientName = get('client');
    const codePostal = get('codePostal');
    const ville = get('ville');
    const dateRaw = get('date');
    const action = get('action');
    const resume = get('resume');
    if(!clientName){ skippedRows.push({rowNum, reason:'Client vide'}); return; }
    if(!resume && !action){ skippedRows.push({rowNum, reason:'Résumé et Action prochaine vides'}); return; }

    const norm = s=>String(s||'').trim().toLowerCase();
    let candidates = state.clients.filter(c=> norm(c.company||c.name)===norm(clientName));
    if(candidates.length>1 && (codePostal||ville)){
      const refined = candidates.filter(c=>
        (!codePostal || norm(c.codePostal)===norm(codePostal)) &&
        (!ville || norm(c.ville)===norm(ville))
      );
      if(refined.length>0) candidates = refined;
    }
    if(candidates.length===0){
      notFound.push({rowNum, client:clientName, codePostal, ville});
      return;
    }
    if(candidates.length>1){
      ambiguous.push({rowNum, client:clientName, codePostal, ville, count:candidates.length});
      return;
    }
    const target = candidates[0];
    const date = parseHistoryDateLoose(dateRaw) || todayStr();
    const text = [resume, action?`➜ Action à venir : ${action}`:''].filter(Boolean).join('\n');
    target.history = target.history || [];
    target.history.push({id:uid(), date, text, brandIds:[], typeVisite:''});
    added++;
  });

  persist('clients');
  closeModal();
  render();
  showHistoryImportReport(rows.length, added, notFound, ambiguous, skippedRows);
}
function parseHistoryDateLoose(raw){
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){
    let a=parseInt(m[1],10), b=parseInt(m[2],10), y=m[3];
    let month=a, day=b;
    if(a>12 && b<=12){ month=b; day=a; } // heuristique : bascule si le format est manifestement J/M/AAAA
    return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  const num = parseFloat(s);
  if(!isNaN(num) && num>20000 && num<80000){
    const epoch = new Date(Date.UTC(1899,11,30));
    const d = new Date(epoch.getTime() + num*86400000);
    return d.toISOString().slice(0,10);
  }
  return null;
}

/* ============================= REGROUPEMENT DES CONTACTS PAR SOCIÉTÉ ============================= */
// Quand un import a créé une fiche client distincte par contact (au lieu d'une fiche société avec
// plusieurs personnes à contacter), cet outil regroupe automatiquement toutes les fiches partageant
// la même Société en une seule fiche, les autres devenant des entrées dans "Personnes à contacter".
function computeSimilarClientGroups(){
  const clients = state.clients.slice();
  const used = new Set();
  const groups = [];
  clients.forEach(c=>{
    if(used.has(c.id)) return;
    const norm = normalizeCompanyForDup(c.company||c.name);
    if(!norm || norm.length<3) return;
    const group = clients.filter(o=>{
      if(used.has(o.id)) return false;
      const on = normalizeCompanyForDup(o.company||o.name);
      if(!on || on.length<3) return false;
      return on===norm || on.includes(norm) || norm.includes(on);
    });
    if(group.length>1){
      group.forEach(g=>used.add(g.id));
      groups.push(group);
    }
  });
  return groups;
}
function computeDuplicateContactsWithin(c){
  const contacts = c.contacts||[];
  const seen = new Map(); // clé -> premier index rencontré
  const dupPairs = [];
  contacts.forEach((p,i)=>{
    const emailKey = (p.email||'').trim().toLowerCase();
    const nameKey = [(p.prenom||'').trim().toLowerCase(),(p.nom||'').trim().toLowerCase()].filter(Boolean).join(' ');
    const key = emailKey || nameKey;
    if(!key) return;
    if(seen.has(key)) dupPairs.push([seen.get(key), i]);
    else seen.set(key, i);
  });
  return dupPairs;
}
function openDuplicatesFinderModal(){
  const groups = computeSimilarClientGroups();
  const contactDupClients = state.clients.filter(c=>computeDuplicateContactsWithin(c).length>0);
  if(groups.length===0 && contactDupClients.length===0){
    showToast('Aucun doublon probable trouvé — sociétés à noms proches et contacts en double compris.');
    return;
  }
  openModal(`
    <div class="modal-head"><h3>Doublons probables</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">

      ${groups.map((g,gi)=>`

          ${g.map(c=>`
            <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;">

            </label>
          `).join('')}
          <div class="helper" style="margin:6px 0 8px;">La fiche cochée est conservée ; les autres deviennent des contacts et leurs devis lui sont rattachés.</div>

        </div>
      `).join('')}
      `}
      ${contactDupClients.length===0?'':`
      <div class="section-title" style="margin-top:${groups.length?'20px':'0'};">Contacts en double au sein d'une même fiche (${contactDupClients.length})</div>
      <div class="helper" style="margin-bottom:10px;">Même email, ou même prénom + nom, saisis deux fois sur la même fiche société.</div>
      ${contactDupClients.map(c=>{
        const pairs = computeDuplicateContactsWithin(c);
        return pairs.map(([i,j])=>{
          const p1 = c.contacts[i], p2 = c.contacts[j];
          return `
          <div class="card card-pad" style="margin-bottom:12px;">
            <div style="margin-bottom:6px;"><strong>${escapeHtml(clientDisplayName(c))}</strong></div>
            <div class="helper">1. ${escapeHtml([p1.prenom,p1.nom].filter(Boolean).join(' '))} — ${escapeHtml(p1.email||p1.telephone||p1.portable||'—')}</div>
            <div class="helper" style="margin-bottom:8px;">2. ${escapeHtml([p2.prenom,p2.nom].filter(Boolean).join(' '))} — ${escapeHtml(p2.email||p2.telephone||p2.portable||'—')}</div>
            <button class="btn btn-sm btn-primary" onclick="confirmMergeDuplicateContact('${c.id}', ${i}, ${j})">Fusionner ces deux contacts</button>
          </div>`;
        }).join('');
      }).join('')}
      `}
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Fermer</button></div>
  `, {lg:true});
}
function confirmMergeClientGroup(groupIds, gi){
  const keepInput = document.querySelector(`input[name="dupGroupKeep_${gi}"]:checked`);
  const keepId = keepInput ? keepInput.value : groupIds[0];
  if(!confirm('Fusionner ces fiches ? Une sauvegarde sera téléchargée avant, par précaution.')) return;
  downloadBackupNow();
  const keep = state.clients.find(c=>c.id===keepId);
  if(!keep) return;
  keep.contacts = keep.contacts || [];
  keep.remisesTarif = keep.remisesTarif || [];
  const existingEmails = new Set(keep.contacts.map(p=>(p.email||'').toLowerCase()).filter(Boolean));
  groupIds.filter(id=>id!==keepId).forEach(id=>{
    const other = state.clients.find(c=>c.id===id);
    if(!other) return;
    (other.contacts||[]).forEach(p=>{
      const k=(p.email||'').toLowerCase();
      if(k && existingEmails.has(k)) return;
      keep.contacts.push(p);
      if(k) existingEmails.add(k);
    });
    keep.remisesTarif = keep.remisesTarif.concat(other.remisesTarif||[]);
    keep.history = (keep.history||[]).concat(other.history||[]);
    state.devis.forEach(d=>{ if(d.clientId===id) d.clientId=keepId; });
  });
  const removeIds = new Set(groupIds.filter(id=>id!==keepId));
  state.clients = state.clients.filter(c=>!removeIds.has(c.id));
  persist('clients'); persist('devis');
  render();
  showToast('Fusion effectuée.');
  openDuplicatesFinderModal();
}
function confirmMergeDuplicateContact(clientId, i, j){
  const c = state.clients.find(x=>x.id===clientId);
  if(!c || !c.contacts) return;
  const p1 = c.contacts[i], p2 = c.contacts[j];
  if(!p1 || !p2) return;
  // Combine les deux fiches en gardant, pour chaque champ, la première valeur non vide.
  const merged = {};
  ['civilite','nom','prenom','fonction','telephone','portable','email','commentaire'].forEach(k=>{
    merged[k] = p1[k] || p2[k] || '';
  });
  merged.id = p1.id;
  merged.actif = (p1.actif!==false || p2.actif!==false) ? true : false;
  c.contacts[i] = merged;
  c.contacts.splice(j,1);
  persist('clients');
  showToast('Contacts fusionnés.');
  openDuplicatesFinderModal();
}
function computeContactMergeGroups(){
  const groups = {};
  state.clients.forEach(c=>{
    const key = (c.company||'').trim().toLowerCase();
    if(!key) return; // pas de société renseignée : on ne regroupe pas
    groups[key] = groups[key] || [];
    groups[key].push(c);
  });
  return Object.values(groups)
    .filter(g=>g.length>1)
    .map(g=>({company:g[0].company, clients:g}))
    .sort((a,b)=>b.clients.length-a.clients.length);
}
function openMergeContactsModal(){
  const groups = computeContactMergeGroups();
  if(groups.length===0){ showToast('Aucune société avec plusieurs fiches clients trouvée — rien à regrouper.'); return; }
  const totalExtra = groups.reduce((s,g)=>s+g.clients.length-1,0);
  openModal(`
    <div class="modal-head"><h3>Regrouper les contacts par société</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="font-size:14px;color:var(--ink);margin-bottom:10px;line-height:1.6;">
        <strong>${groups.length}</strong> société(s) ont plusieurs fiches clients distinctes (souvent une fiche par contact après import).<br>
        <strong>${totalExtra}</strong> fiche(s) seront transformées en « Personnes à contacter » et regroupées dans une fiche société unique par groupe.
      </div>
      <div class="helper" style="margin-bottom:14px;">Une sauvegarde .json sera téléchargée automatiquement avant de continuer, par précaution (restaurable ensuite depuis Paramètres si besoin).</div>
      <div class="table-wrap" style="max-height:320px;overflow-y:auto;"><table>
        <thead><tr><th>Société</th><th>Fiches regroupées</th></tr></thead>
        <tbody>${groups.slice(0,80).map(g=>`<tr><td>${escapeHtml(g.company)}</td><td>${g.clients.length}</td></tr>`).join('')}</tbody>
      </table></div>
      ${groups.length>80?`<div class="helper" style="margin-top:6px;">… et ${groups.length-80} autre(s) société(s).</div>`:''}
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmMergeContacts()">Regrouper (${totalExtra} fiche${totalExtra>1?'s':''})</button>
    </div>
  `, {lg:true});
}
function confirmMergeContacts(){
  downloadBackupNow();
  const groups = computeContactMergeGroups();
  let mergedCount = 0;
  const idsToRemove = new Set();
  groups.forEach(g=>{
    const group = g.clients;
    // La fiche "primaire" retenue est celle qui a le plus d'informations société renseignées
    const scoreOf = c => [c.adresse1,c.codePostal,c.ville,c.telephone,c.siteInternet].filter(Boolean).length;
    const primary = group.slice().sort((a,b)=>scoreOf(b)-scoreOf(a))[0];
    primary.contacts = primary.contacts || [];
    const existingEmails = new Set(primary.contacts.map(p=>(p.email||'').toLowerCase()).filter(Boolean));
    group.forEach(c=>{
      if(c.id===primary.id) return;
      // Reprend les contacts déjà saisis sur cette fiche doublon
      (c.contacts||[]).forEach(p=>{
        const k = (p.email||'').toLowerCase();
        if(k && existingEmails.has(k)) return;
        primary.contacts.push(p);
        if(k) existingEmails.add(k);
      });
      // Transforme la fiche doublon elle-même en contact (son "Nom" est celui de la personne)
      const personName = (c.name && c.name.trim().toLowerCase()!==(c.company||'').trim().toLowerCase()) ? c.name : '';
      const emailKey = (c.email||'').toLowerCase();
      if((personName || c.email || c.telephone || c.portable) && (!emailKey || !existingEmails.has(emailKey))){
        primary.contacts.push({
          id: uid(), civilite: c.civilite||'', nom: personName, prenom: c.prenom||'',
          fonction:'', telephone: c.telephone||'', portable: c.portable||'', email: c.email||'',
          commentaire: stripHtml(c.notes||''),
        });
        if(emailKey) existingEmails.add(emailKey);
      }
      idsToRemove.add(c.id);
      mergedCount++;
    });
  });
  state.clients = state.clients.filter(c=>!idsToRemove.has(c.id));
  persist('clients');
  closeModal();
  render();
  showToast(`${groups.length} société(s) regroupée(s) — ${mergedCount} fiche(s) transformée(s) en « Personnes à contacter ».`, 6000);
}

/* ============================= COLONNES PERSONNALISABLES (largeur + ordre) ============================= */
/* Système générique réutilisable pour rendre les tableaux redimensionnables (glisser le bord d'un
   en-tête) et réordonnables (glisser-déposer un en-tête). Les préférences sont mémorisées par tableau
   (state.settings.columnPrefs[tableId]) et persistées comme le reste des paramètres. */
function getColumnOrder(tableId, defaultCols){
  const stored = state.settings.columnPrefs && state.settings.columnPrefs[tableId];
  const byKey = {}; defaultCols.forEach(c=>byKey[c.key]=c);
  if(!stored || !stored.length) return defaultCols.map(c=>({key:c.key, width:c.defaultWidth}));
  const merged = stored.filter(s=>byKey[s.key]).map(s=>({key:s.key, width:s.width||byKey[s.key].defaultWidth}));
  defaultCols.forEach(c=>{ if(!merged.some(m=>m.key===c.key)) merged.push({key:c.key, width:c.defaultWidth}); });
  return merged;
}
function resetColumnPrefs(tableId){
  if(state.settings.columnPrefs) delete state.settings.columnPrefs[tableId];
  persist('settings');
  render();
}
function renderCustomizableTable(tableId, defaultCols, rows, opts){
  opts = opts || {};
  const visibleDefaultCols = defaultCols.filter(c=> !c.showIf || c.showIf());
  const order = getColumnOrder(tableId, visibleDefaultCols);
  const byKey = {}; visibleDefaultCols.forEach(c=>byKey[c.key]=c);
  const cols = order.filter(o=>byKey[o.key]).map(o=>({...byKey[o.key], width:o.width||byKey[o.key].defaultWidth}));
  visibleDefaultCols.forEach(c=>{ if(!cols.some(x=>x.key===c.key)) cols.push({...c, width:c.defaultWidth}); });
  const leading = opts.leadingCols || [];

  const colgroup = `<colgroup>${leading.map(lc=>`<col style="width:${lc.width||36}px;">`).join('')}${cols.map(c=>`<col style="width:${c.width}px;">`).join('')}${opts.actionsCol?`<col style="width:${opts.actionsWidth||150}px;">`:''}</colgroup>`;
  const leadingTh = leading.map(lc=>`<th${lc.headClass?` class="${lc.headClass}"`:''}>${lc.head||''}</th>`).join('');
  const thead = `<thead><tr>${leadingTh}${cols.map(c=>`
    <th class="col-th" draggable="true" data-table="${tableId}" data-key="${c.key}"
        ondragstart="colDragStart(event)" ondragover="colDragOver(event)" ondragleave="colDragLeave(event)" ondrop="colDrop(event)" ondragend="colDragEnd(event)"
        title="Glisser pour réordonner">
      <span class="col-th-label">${escapeHtml(c.label)}</span>
      <span class="col-resize-handle" draggable="false" onmousedown="startColResize(event,'${tableId}')" title="Glisser pour redimensionner"></span>
    </th>`).join('')}${opts.actionsCol?'<th></th>':''}</tr></thead>`;

  const tbody = `<tbody>${rows.map(row=>{
    const leadingTd = leading.map(lc=>`<td${lc.onClick?` onclick="${lc.onClick}"`:''}>${lc.cell(row)}</td>`).join('');
    const dataCells = cols.map(c=>{
      const cls = (typeof c.cellClass==='function' ? c.cellClass(row) : c.cellClass) || '';
      const style = (typeof c.cellStyle==='function' ? c.cellStyle(row) : c.cellStyle) || '';
      const tdClick = (typeof c.tdOnClick==='function' ? c.tdOnClick(row) : c.tdOnClick) || '';
      return `<td${cls?` class="${cls}"`:''}${style?` style="${style}"`:''}${tdClick?` onclick="${tdClick}"`:''}>${c.cell(row)}</td>`;
    }).join('');
    const actionsTd = opts.actionsCol ? `<td class="table-actions"${opts.actionsOnClick?` onclick="${opts.actionsOnClick}"`:''}>${opts.actionsCol(row)}</td>` : '';
    const afterRowHtml = (typeof opts.afterRow==='function') ? (opts.afterRow(row)||'') : '';
    return `<tr${opts.rowAttrs?` ${opts.rowAttrs(row)}`:''}>${leadingTd}${dataCells}${actionsTd}</tr>${afterRowHtml}`;
  }).join('')}</tbody>`;

  return `<div class="table-wrap"><table class="col-custom-table">${colgroup}${thead}${tbody}</table></div>
  <button class="btn btn-sm btn-ghost" style="margin-top:8px;" onclick="resetColumnPrefs('${tableId}')">↺ Réinitialiser les colonnes de ce tableau</button>`;
}

/* ---- Redimensionnement (glisser le bord droit d'un en-tête) ---- */
let colResizeState = null;
function startColResize(evt, tableId){
  evt.stopPropagation(); evt.preventDefault();
  const th = evt.target.closest('th');
  const table = th.closest('table');
  const idx = Array.from(th.parentElement.children).indexOf(th);
  const col = table.querySelectorAll('colgroup col')[idx];
  if(!col) return;
  colResizeState = { tableId, key: th.dataset.key, startX: evt.clientX, startWidth: col.offsetWidth, col };
  document.addEventListener('mousemove', onColResizeMove);
  document.addEventListener('mouseup', onColResizeEnd);
}
function onColResizeMove(evt){
  if(!colResizeState) return;
  const delta = evt.clientX - colResizeState.startX;
  const newWidth = Math.max(60, colResizeState.startWidth + delta);
  colResizeState.col.style.width = newWidth+'px';
  colResizeState.newWidth = newWidth;
}
function onColResizeEnd(){
  if(!colResizeState) return;
  document.removeEventListener('mousemove', onColResizeMove);
  document.removeEventListener('mouseup', onColResizeEnd);
  const { tableId, key, newWidth } = colResizeState;
  if(newWidth){
    state.settings.columnPrefs = state.settings.columnPrefs || {};
    const order = state.settings.columnPrefs[tableId] || [];
    const existing = order.find(o=>o.key===key);
    if(existing) existing.width = newWidth; else order.push({key, width:newWidth});
    state.settings.columnPrefs[tableId] = order;
    persist('settings');
  }
  colResizeState = null;
}

/* ---- Réordonnancement (glisser-déposer un en-tête entier) ---- */
let colDragKey = null;
function colDragStart(evt){
  colDragKey = evt.currentTarget.dataset.key;
  evt.dataTransfer.effectAllowed = 'move';
  try{ evt.dataTransfer.setData('text/plain', colDragKey); }catch(e){}
}
function colDragOver(evt){
  evt.preventDefault();
  evt.dataTransfer.dropEffect = 'move';
  evt.currentTarget.classList.add('col-th-dragover');
}
function colDragLeave(evt){
  evt.currentTarget.classList.remove('col-th-dragover');
}
function colDrop(evt){
  evt.preventDefault();
  evt.currentTarget.classList.remove('col-th-dragover');
  const tableId = evt.currentTarget.dataset.table;
  const targetKey = evt.currentTarget.dataset.key;
  if(!colDragKey || colDragKey===targetKey){ colDragKey=null; return; }
  const table = evt.currentTarget.closest('table');
  const ths = Array.from(table.querySelectorAll('th[data-key]'));
  const existingPrefs = (state.settings.columnPrefs && state.settings.columnPrefs[tableId]) || [];
  const order = ths.map(th=>{
    const k = th.dataset.key;
    const found = existingPrefs.find(o=>o.key===k);
    return { key:k, width: found ? found.width : th.offsetWidth };
  });
  const fromIdx = order.findIndex(o=>o.key===colDragKey);
  const toIdx = order.findIndex(o=>o.key===targetKey);
  if(fromIdx>=0 && toIdx>=0){
    const [moved] = order.splice(fromIdx,1);
    order.splice(toIdx,0,moved);
    state.settings.columnPrefs = state.settings.columnPrefs || {};
    state.settings.columnPrefs[tableId] = order;
    persist('settings');
  }
  colDragKey = null;
  render();
}
function colDragEnd(evt){
  colDragKey = null;
  document.querySelectorAll('.col-th-dragover').forEach(el=>el.classList.remove('col-th-dragover'));
}

function renderTarifsTableInner(){

  const showBrandCol = ui.tarifsBrandFilter==='all';
  if(list.length===0) return emptyState('▤','Aucune référence','Ajoutez une référence ou importez un fichier Excel/CSV.');

  // dizaines de milliers de références — la recherche ci-dessus reste le moyen d'accéder directement

  if(ui.tarifsPage < 0) ui.tarifsPage = 0;
  const start = ui.tarifsPage*pageSize;
  const pageItems = list.slice(start, start+pageSize);

/* Liste totalement indépendante de l'onglet Tarifs : sa propre base de données,
   son propre formulaire, son propre import. Aucun lien entre les deux. */
function margeNetInfo(t){
  const distrib = t.prixAchatDistributeur||0;
  const net = t.prixNet||0;
  const amount = net - distrib;
  const pct = distrib>0 ? (amount/distrib*100) : 0;
  return { amount, pct, has: !!(distrib||net) };
}
function listesForBrand(brandId){
  return state.prixNetListes.filter(l=>l.brandId===brandId);
}
function pnAssignedClientsForListe(listeId){
  return dedupeByCompany(state.clients.filter(c=>(c.netPriceListeIds||[]).includes(listeId)));
}
function pnAssignedClientsForBrand(brandId){
  const listeIds = listesForBrand(brandId).map(l=>l.id);
  return dedupeByCompany(state.clients.filter(c=>(c.netPriceListeIds||[]).some(id=>listeIds.includes(id))));
}
function filteredListesPrixNets(){
  let list = getSortedListesPrixNets(); // déjà trié une seule fois (comparateur rapide, mis en cache)

  const q = ui.pnSearch.trim().toLowerCase();

  return list;
}

function createPrixNetListe(brandId){
  const nom = prompt('Nom de la nouvelle liste de prix nets :', 'Nouvelle liste');
  if(!nom || !nom.trim()) return;
  const liste = {id:uid(), brandId, nom:nom.trim(), isDefault:false};
  state.prixNetListes.push(liste);
  persist('prixNetListes');
  ui.pnView='detail'; ui.pnBrandFilter=brandId; ui.pnListeFilter=liste.id; ui.pnSearch='';
  render();
  showToast('Liste créée.');
}
function renamePrixNetListe(listeId){
  const l = state.prixNetListes.find(x=>x.id===listeId);
  if(!l) return;
  const nom = prompt('Nouveau nom de la liste :', l.nom);
  if(!nom || !nom.trim()) return;
  l.nom = nom.trim();
  persist('prixNetListes');
  render();
}
function deletePrixNetListe(listeId){
  const l = state.prixNetListes.find(x=>x.id===listeId);
  if(!l) return false;
  const items = state.listesPrixNets.filter(t=>t.listeId===listeId);
  if(!confirm(`Supprimer la liste "${l.nom}" ? ${items.length} référence(s) associée(s) seront aussi déplacées avec elle. Les clients rattachés perdront ce tarif préférentiel. Retrouvable dans la Corbeille.`)) return false;
  moveToTrash('prixNetListe', l.nom||'(sans nom)', {liste:l, items});
  state.prixNetListes = state.prixNetListes.filter(x=>x.id!==listeId);
  state.listesPrixNets = state.listesPrixNets.filter(t=>t.listeId!==listeId);
  state.clients.forEach(c=>{ if(c.netPriceListeIds) c.netPriceListeIds = c.netPriceListeIds.filter(id=>id!==listeId); });
  persist('prixNetListes'); persist('listesPrixNets'); persist('clients');
  showToast('Liste déplacée dans la Corbeille.');
  return true;
}
function deletePrixNetListeFromDetail(listeId){
  const brandId = ui.pnBrandFilter;
  if(!deletePrixNetListe(listeId)) return;
  const remaining = listesForBrand(brandId);
  if(remaining.length>0){ ui.pnListeFilter = remaining[0].id; }
  else { ui.pnView='brands'; ui.pnBrandFilter='all'; ui.pnListeFilter=null; }
  render();
}
function clearListePrixNets(listeId){
  const l = state.prixNetListes.find(x=>x.id===listeId);

  if(items.length===0){ showToast('Cette liste est déjà vide.'); return; }
  if(!confirm(`Vider la liste "${l?l.nom:''}" ? ${items.length} référence(s) retrouvable(s) dans la Corbeille (en un seul bloc).`)) return;
  moveToTrash('prixNetBulk', `${items.length} référence(s) — ${l?l.nom:''}`, items);
  state.listesPrixNets = state.listesPrixNets.filter(t=>t.listeId!==listeId);
  persist('listesPrixNets');
  render();
  showToast('Liste de prix nets déplacée dans la Corbeille.');
}
let pnClientAssignSearch = '';
let pnCurrentGroups = [];
function companyKeyOf(c){
  return (c.company && c.company.trim()) ? ('co:'+c.company.trim().toLowerCase()) : ('solo:'+c.id);
}
function dedupeByCompany(list){
  const seen = new Set();
  const out = [];
  list.forEach(c=>{
    const key = companyKeyOf(c);
    if(!seen.has(key)){ seen.add(key); out.push(c); }
  });
  return out;
}
function pnCompanyGroups(){
  const map = new Map();
  state.clients.forEach(c=>{
    const key = companyKeyOf(c);
    const label = (c.company && c.company.trim()) ? c.company.trim() : c.name;
    if(!map.has(key)) map.set(key, {key, label, clients:[]});
    map.get(key).clients.push(c);
  });
  return Array.from(map.values()).sort((a,b)=>a.label.localeCompare(b.label));
}
let pnClientAssignFamille = 'all';
let pnClientAssignSousFamille = 'all';

      <button class="btn btn-primary" onclick="closeModal(); render();">Fermer</button>

  `, {lg:true});

function renderPnClientAssignListItems(listeId){
  const q = pnClientAssignSearch.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const familleTarget = (pnClientAssignFamille && pnClientAssignFamille!=='all') ? pnClientAssignFamille.trim().toLowerCase() : null;
  const sousFamilleTarget = (pnClientAssignSousFamille && pnClientAssignSousFamille!=='all') ? pnClientAssignSousFamille.trim().toLowerCase() : null;
  const groups = pnCompanyGroups().filter(g=>{
    if(words.length>0){
      const hay = (g.label+' '+g.clients.map(c=>c.name+' '+(c.famille||'')+' '+(c.sousFamille||'')).join(' ')).toLowerCase();
      if(!words.every(w=>hay.includes(w))) return false;
    }
    if(familleTarget && !g.clients.some(c=>(c.famille||'').trim().toLowerCase()===familleTarget)) return false;
    if(sousFamilleTarget && !g.clients.some(c=>(c.sousFamille||'').trim().toLowerCase()===sousFamilleTarget)) return false;
    return true;
  });
  pnCurrentGroups = groups;
  if(state.clients.length===0) return '<div class="helper">Aucun client enregistré.</div>';
  if(groups.length===0) return '<div class="helper">Aucune société ne correspond à cette recherche.</div>';
  const allChecked = groups.every(g=>g.clients.every(c=>(c.netPriceListeIds||[]).includes(listeId)));
  const selectAllRow = `
    <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:13px;cursor:pointer;background:var(--surface-2);">
      <input type="checkbox" style="width:auto;" ${allChecked?'checked':''} onchange="pnBulkSetAssignment('${listeId}', this.checked)">
      <span><strong>${allChecked?'Tout désélectionner':'Tout sélectionner'}</strong> — ${groups.length} société(s)${(words.length||familleTarget||sousFamilleTarget)?' pour ce filtre':''}</span>
    </label>`;
  return selectAllRow + groups.map((g,i)=>{
    const checked = g.clients.every(c=>(c.netPriceListeIds||[]).includes(listeId));
    return `
    <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;cursor:pointer;">
      <input type="checkbox" style="width:auto;" ${checked?'checked':''} onchange="pnToggleCompanyGroupIndex(${i}, '${listeId}', this.checked)">
      <span>${escapeHtml(g.label)}${g.clients.length>1?` <span class="helper">(${g.clients.length} contacts)</span>`:''}</span>
    </label>`;
  }).join('');
}
function pnApplyListeToClients(clients, listeId, checked){
  const liste = state.prixNetListes.find(x=>x.id===listeId);
  if(!liste) return;
  const otherListesSameBrand = state.prixNetListes.filter(l=>l.brandId===liste.brandId && l.id!==listeId).map(l=>l.id);
  clients.forEach(c=>{
    c.netPriceListeIds = c.netPriceListeIds || [];
    if(checked){
      c.netPriceListeIds = c.netPriceListeIds.filter(id=>!otherListesSameBrand.includes(id));
      if(!c.netPriceListeIds.includes(listeId)) c.netPriceListeIds.push(listeId);
    } else {
      c.netPriceListeIds = c.netPriceListeIds.filter(id=>id!==listeId);
    }
  });
}
function pnToggleCompanyGroupIndex(i, listeId, checked){
  const g = pnCurrentGroups[i];
  if(!g) return;
  pnApplyListeToClients(g.clients, listeId, checked);
  persist('clients');
  refreshPnClientAssignList(listeId);
}
function pnBulkSetAssignment(listeId, checked){
  let count = 0;
  pnCurrentGroups.forEach(g=>{ pnApplyListeToClients(g.clients, listeId, checked); count++; });
  persist('clients');
  refreshPnClientAssignList(listeId);
  showToast(checked ? `${count} société(s) associée(s).` : `${count} société(s) dissociée(s).`);
}
function refreshPnClientAssignList(listeId){
  const wrap = document.getElementById('pnAssignList');
  if(wrap) wrap.innerHTML = renderPnClientAssignListItems(listeId);
}

  const showBrandCol = ui.pnBrandFilter==='all';

  if(list.length===0) return emptyState('▥','Aucune référence','Ajoutez une référence ou importez un fichier Excel/CSV.');
  return `
    <div class="table-wrap"><table>
      <thead><tr>
        ${showBrandCol?'<th>Marque</th>':''}

        <th>Achat distrib.</th><th>Marge nette</th><th></th>

        ${capped.map(t=>{
          const m = margeNetInfo(t);

function handleImportFilePN(evt){
  const file = evt.target.files[0];
  if(!file) return;
  document.getElementById('impPN_zoneText').innerHTML = `✔ ${escapeHtml(file.name)}`;
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    Papa.parse(file, {
      header:false, skipEmptyLines:true,
      complete: (res)=>{ importParsedRowsPN = res.data; renderImportMappingPN(); },
      error: ()=> showToast('Impossible de lire ce fichier CSV.')
    });
  } else if(ext==='xlsx' || ext==='xls'){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, {header:1, raw:false, defval:''});
        importParsedRowsPN = rows.filter(r=>r.some(cell=>String(cell).trim()!==''));
        renderImportMappingPN();
      }catch(err){
        showToast('Impossible de lire ce fichier Excel.');
      }
    };
    reader.onerror = ()=> showToast('Impossible de lire ce fichier.');
    reader.readAsArrayBuffer(file);
  } else {
    showToast('Format non pris en charge. Utilisez .xlsx, .xls ou .csv');
  }
}
function renderImportMappingPN(){
  if(!importParsedRowsPN || importParsedRowsPN.length===0){ showToast('Fichier vide ou illisible.'); return; }
  const first = importParsedRowsPN[0];
  const nCols = first.length;
  const opts = (sel)=> Array.from({length:nCols}).map((_,i)=>`<option value="${i}" ${i===sel?'selected':''}>Colonne ${i+1}: "${escapeHtml(String(first[i]||'').slice(0,24))}"</option>`).join('');
  const guessRef = guessColIndex(first, /r[ée]f/i);
  const guessDesig = guessColIndex(first, /d[ée]sign|libell[ée]|article|produit/i);
  const guessPrix = guessColIndex(first, /prix|tarif|montant|p\.?u\.?|net/i);
  const defRef = guessRef>=0 ? guessRef : 0;
  const defDesig = guessDesig>=0 && guessDesig!==defRef ? guessDesig : (nCols>1?1:0);
  const defPrix = guessPrix>=0 && guessPrix!==defRef ? guessPrix : (nCols>2?2:0);
  document.getElementById('impPN_mapping').innerHTML = `
    <div class="divider"></div>

      <div class="field"><label>Colonne désignation</label><select id="impPN_colDesig">${opts(defDesig)}</select></div>
      <div class="field"><label>Colonne prix net *</label><select id="impPN_colPrix">${opts(defPrix)}</select></div>
    </div>
    <div class="helper">${importParsedRowsPN.length} ligne(s) détectée(s) dans le fichier.</div>
  `;
  document.getElementById('impPN_confirmBtn').style.display='inline-flex';
}
function importSaveMessage(res, added, updated){
  if(res.viaFolder){
    if(!res.localOk) return `⚠️ ÉCHEC DE L'ENREGISTREMENT : ${added} référence(s) ajoutée(s) à l'écran, mais l'écriture dans le dossier de sauvegarde a échoué. Vérifiez que le dossier est toujours accessible (Paramètres), puis réessayez.`;
    return `Import terminé et enregistré dans le dossier de sauvegarde : ${added} ajoutée(s), ${updated} mise(s) à jour.`;
  }
  if(!res.localOk && res.cloudOk!==true){
    return `⚠️ ÉCHEC DE L'ENREGISTREMENT : ${added} référence(s) ajoutée(s) à l'écran, mais la sauvegarde a échoué (fichier trop volumineux pour cet espace de stockage). Vos données seront perdues au rechargement — connectez un dossier de sauvegarde dans Paramètres pour les gros catalogues, ou réessayez avec un fichier plus petit.`;
  }
  let msg = `Import terminé et enregistré : ${added} ajoutée(s), ${updated} mise(s) à jour.`;
  if(!res.localOk) msg += ' (sauvegarde locale du navigateur pleine, mais la sauvegarde cloud a réussi)';
  return msg;
}
function confirmImportPN(){
  const brandId = document.getElementById('impPN_brand').value;
  const listeId = document.getElementById('impPN_liste').value;
  if(!listeId){ showToast('Choisissez ou créez une liste de prix nets.'); return; }
  const hasHeader = document.getElementById('impPN_hasHeader').checked;
  const colRef = parseInt(document.getElementById('impPN_colRef').value);
  const colDesig = parseInt(document.getElementById('impPN_colDesig').value);
  const colPrix = parseInt(document.getElementById('impPN_colPrix').value);
  const rows = importParsedRowsPN.slice(hasHeader?1:0);
  const btn = document.getElementById('impPN_confirmBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Import en cours…'; }
  showToast(`Import de ${rows.length} ligne(s) en cours…`, 60000);
  setTimeout(async ()=>{
    // Index O(1) des références déjà existantes dans cette liste (au lieu d'un .find() par ligne).
    const index = new Map();
    state.listesPrixNets.forEach(t=>{
      if(t.listeId===listeId) index.set(t.reference.toLowerCase(), t);
    });
    let added=0, updated=0, zeroPrice=0, skipped=0;
    rows.forEach(row=>{
      const reference = (row[colRef]||'').toString().trim();
      if(!reference){ skipped++; return; }
      if(isHeaderLikeValue(reference)){ skipped++; return; } // garde-fou : ligne d'en-tête importée par erreur
      const prix = parseMoneyLoose(row[colPrix]);
      if(prix===0) zeroPrice++;
      const designation = colDesig!==undefined ? (row[colDesig]||'').toString().trim() : '';
      const key = reference.toLowerCase();
      const existing = index.get(key);
      if(existing){
        existing.prixNet = prix;
        if(designation){ existing.designation = designation; existing._sk = null; existing._skn = null; }
        updated++;
      } else {
        const newEntry = {id:uid(), brandId, listeId, reference, designation, prixNet:prix, prixAchatDistributeur:0};
        state.listesPrixNets.push(newEntry);
        index.set(key, newEntry); // évite les doublons si la même référence apparaît plusieurs fois dans le fichier
        added++;
      }
    });
    invalidatePnSortCache();
    if(btn) btn.textContent = 'Enregistrement en cours…';
    showToast(`Enregistrement de ${state.listesPrixNets.length} référence(s)…`, 60000);
    const res = await persistNow('listesPrixNets');
    closeModal();
    render();
    let msg = importSaveMessage(res, added, updated);
    if(!(res.viaFolder && !res.localOk) && !(!res.localOk && res.cloudOk!==true)){
      if(zeroPrice>0) msg += ` ⚠ ${zeroPrice} ligne(s) importée(s) avec un prix à 0 € (aucune ligne n'est exclue pour un prix manquant — vérifiez la colonne « Prix » si ce n'est pas voulu).`;
      if(skipped>0) msg += ` (${skipped} ligne(s) ignorée(s) : référence vide ou ligne d'en-tête.)`;
    }
    showToast(msg, 8000);
  }, 30);
}

function tarifRecalcFromMarge(){
  const distrib = parseFloat(document.getElementById('f_prixAchatDistrib').value)||0;
  const margeRaw = document.getElementById('f_marge').value;
  if(margeRaw==='' || distrib<=0) return;
  const marge = parseFloat(margeRaw);
  if(isNaN(marge)) return;
  const conseille = distrib * (1 + marge/100);
  document.getElementById('f_prixAchatConseille').value = conseille.toFixed(2);
}
function tarifRecalcMargeFromConseille(){
  const distrib = parseFloat(document.getElementById('f_prixAchatDistrib').value)||0;
  const conseille = parseFloat(document.getElementById('f_prixAchatConseille').value)||0;
  if(distrib<=0) return;
  const marge = (conseille - distrib) / distrib * 100;

function handleImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  document.getElementById('imp_zoneText').innerHTML = `✔ ${escapeHtml(file.name)}`;
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    Papa.parse(file, {
      header:false, skipEmptyLines:true,
      complete: (res)=>{ importParsedRows = res.data; renderImportMapping(); },
      error: ()=> showToast('Impossible de lire ce fichier CSV.')
    });
  } else if(ext==='xlsx' || ext==='xls'){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, {header:1, raw:false, defval:''});
        importParsedRows = rows.filter(r=>r.some(cell=>String(cell).trim()!==''));
        renderImportMapping();
      }catch(err){
        showToast('Impossible de lire ce fichier Excel.');
      }
    };
    reader.onerror = ()=> showToast('Impossible de lire ce fichier.');
    reader.readAsArrayBuffer(file);
  } else {
    showToast('Format non pris en charge. Utilisez .xlsx, .xls ou .csv');
  }
}

  `;
  document.getElementById('imp_confirmBtn').style.display='inline-flex';

function confirmImport(){
  const brandId = document.getElementById('imp_brand').value;
  const targetField = document.getElementById('imp_target').value;
  const hasHeader = document.getElementById('imp_hasHeader').checked;
  const colRef = parseInt(document.getElementById('imp_colRef').value);
  const colDesig = parseInt(document.getElementById('imp_colDesig').value);
  const colPrix = parseInt(document.getElementById('imp_colPrix').value);
  const colFamille = parseInt(document.getElementById('imp_colFamille').value);
  const colSousFamille = parseInt(document.getElementById('imp_colSousFamille').value);
  const colComplement = parseInt(document.getElementById('imp_colComplement').value);
  const colEcopart = parseInt(document.getElementById('imp_colEcopart').value);
  const colFicheTech = parseInt(document.getElementById('imp_colFicheTech').value);
  const colNotice = parseInt(document.getElementById('imp_colNotice').value);
  const colPhoto = parseInt(document.getElementById('imp_colPhoto').value);
  const rows = importParsedRows.slice(hasHeader?1:0);
  const btn = document.getElementById('imp_confirmBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Import en cours…'; }
  showToast(`Import de ${rows.length} ligne(s) en cours…`, 60000);
  // Le traitement est différé d'un tick pour laisser le navigateur afficher le message ci-dessus
  // avant de lancer la boucle (fichiers volumineux : plusieurs dizaines de milliers de lignes).
  setTimeout(async ()=>{
    // Index O(1) des références déjà existantes pour cette marque (au lieu d'un .find() par ligne,
    // dont le coût explose avec de gros fichiers — plusieurs dizaines de milliers de lignes).
    const index = new Map();
    state.tarifs.forEach(t=>{
      if(t.brandId===brandId) index.set(t.reference.toLowerCase(), t);
    });
    let added=0, updated=0, zeroPrice=0, skipped=0, withFicheTech=0, withNotice=0, withPhoto=0;
    rows.forEach(row=>{
      const reference = (row[colRef]||'').toString().trim();
      if(!reference){ skipped++; return; }
      if(isHeaderLikeValue(reference)){ skipped++; return; } // garde-fou : ligne d'en-tête importée par erreur
      const prix = parseMoneyLoose(row[colPrix]);
      if(prix===0) zeroPrice++;
      const designation = colDesig!==undefined ? (row[colDesig]||'').toString().trim() : '';
      const codeFamilleArticle = (colFamille>=0) ? (row[colFamille]||'').toString().trim() : '';
      const codeSousFamilleArticle = (colSousFamille>=0) ? (row[colSousFamille]||'').toString().trim() : '';
      const complementInfo = (colComplement>=0) ? (row[colComplement]||'').toString().trim() : '';
      const ecopart = (colEcopart>=0) ? parseMoneyLoose(row[colEcopart]) : 0;
      const ficheTechniqueUrl = (colFicheTech>=0) ? (row[colFicheTech]||'').toString().trim() : '';
      const noticeUrl = (colNotice>=0) ? (row[colNotice]||'').toString().trim() : '';
      const photoUrl = (colPhoto>=0) ? (row[colPhoto]||'').toString().trim() : '';
      if(ficheTechniqueUrl) withFicheTech++;
      if(noticeUrl) withNotice++;
      if(photoUrl) withPhoto++;
      const key = reference.toLowerCase();
      const existing = index.get(key);
      if(existing){
        existing[targetField] = prix;
        if(designation){ existing.designation = designation; existing._sk = null; existing._skn = null; }
        if(codeFamilleArticle) existing.codeFamilleArticle = codeFamilleArticle;
        if(codeSousFamilleArticle) existing.codeSousFamilleArticle = codeSousFamilleArticle;
        if(complementInfo) existing.complementInfo = complementInfo;
        if(ecopart) existing.ecopart = ecopart;
        if(ficheTechniqueUrl) existing.ficheTechniqueUrl = ficheTechniqueUrl;
        if(noticeUrl) existing.noticeUrl = noticeUrl;
        if(photoUrl) existing.photoUrl = photoUrl;
        updated++;
      } else {
        const newTarif = {id:uid(), brandId, reference, designation, codeFamilleArticle, codeSousFamilleArticle, complementInfo, ecopart, ficheTechniqueUrl, noticeUrl, photoUrl, prixHT:0, prixCatalogue:0, prixAchatDistributeur:0, prixAchatConseilleInstallateur:0};
        newTarif[targetField] = prix;
        state.tarifs.push(newTarif);
        index.set(key, newTarif); // évite les doublons si la même référence apparaît plusieurs fois dans le fichier
        added++;
      }
    });
    invalidateTarifsSortCache();
    if(btn) btn.textContent = 'Enregistrement en cours…';
    showToast(`Enregistrement de ${state.tarifs.length} référence(s)…`, 60000);
    const res = await persistNow('tarifs');
    closeModal();
    render();
    let msg = importSaveMessage(res, added, updated);
    if(!(res.viaFolder && !res.localOk) && !(!res.localOk && res.cloudOk!==true)){
      if(zeroPrice>0) msg += ` ⚠ ${zeroPrice} ligne(s) importée(s) avec un prix à 0 € (aucune ligne n'est exclue pour un prix manquant — vérifiez la colonne « Prix » si ce n'est pas voulu).`;
      if(skipped>0) msg += ` (${skipped} ligne(s) ignorée(s) : référence vide ou ligne d'en-tête.)`;
    }
    showToast(msg, 8000);
  }, 30);
}

function renderParamListPanel(){
  const def = PARAM_LIST_DEFS.find(d=>d.key===ui.paramListSelected) || PARAM_LIST_DEFS[0];
  const hasBrand = def.key==='famillesArticles';
  const hasFamille = def.key==='sousFamillesClients';
  const hasOutcome = def.key==='etatAffaires';
  const items = (state.paramLists[def.key]||[]).slice().sort((a,b)=>(a.libelle||'').localeCompare(b.libelle||''));
  const familleLabel = (fid)=>{
    if(!fid) return '<span class="helper">Aucune famille</span>';
    const f = (state.paramLists.famillesClients||[]).find(x=>x.id===fid);
    return f ? escapeHtml(f.libelle) : '<span class="helper">Famille supprimée</span>';
  };
  const outcomeLabel = (o)=>({encours:'En cours', gagnee:'Affaire gagnée', perdue:'Affaire perdue'}[o]||'En cours');
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-weight:700;font-size:13px;">${escapeHtml(def.label)} <span class="helper" style="display:inline;">(${items.length})</span></div>
      <button class="btn btn-sm btn-primary" onclick="openParamItemForm('${def.key}')">+ Ajouter</button>
    </div>
    ${items.length===0?`<div class="helper" style="padding:14px 0;">Aucun élément pour l'instant.</div>`:`
    <div class="table-wrap"><table>
      <thead><tr><th>Code</th><th>Libellé</th>${hasBrand?'<th>Marque</th>':''}${hasFamille?'<th>Famille</th>':''}${hasOutcome?'<th>Catégorie</th>':''}<th></th></tr></thead>
      <tbody>
        ${items.map(it=>{
          const oc = hasOutcome ? etatAffaireColor(it.outcome||'encours') : null;
          return `
          <tr>
            <td style="font-weight:600;font-family:'Space Grotesk';">${escapeHtml(it.code||'—')}</td>
            <td>${escapeHtml(it.libelle||'')}</td>
            ${hasBrand?`<td>${it.brandId?`<span class="chip" style="background:${brandColor(it.brandId)};"><span class="sq"></span>${escapeHtml(brandName(it.brandId))}</span>`:'<span class="helper">Toutes marques</span>'}</td>`:''}
            ${hasFamille?`<td>${familleLabel(it.familleId)}</td>`:''}
            ${hasOutcome?`<td><span class="status-pill" style="background:${oc.bg};color:${oc.fg};">${outcomeLabel(it.outcome||'encours')}</span></td>`:''}
            <td class="table-actions">
              <button class="btn btn-sm btn-ghost" onclick="openParamItemForm('${def.key}','${it.id}')">Modifier</button>
              <button class="btn btn-sm btn-ghost btn-danger" onclick="deleteParamItem('${def.key}','${it.id}')">Suppr.</button>
            </td>
          </tr>
        `;}).join('')}
      </tbody>
    </table></div>`}
  `;
}
function updateParamListOnly(){
  const wrap = document.getElementById('paramListWrap');
  if(wrap) wrap.innerHTML = renderParamListPanel();
}
function openParamItemForm(listKey, id){
  const def = PARAM_LIST_DEFS.find(d=>d.key===listKey);
  const hasBrand = listKey==='famillesArticles';
  const hasFamille = listKey==='sousFamillesClients';
  const hasOutcome = listKey==='etatAffaires';
  const it = id ? (state.paramLists[listKey]||[]).find(x=>x.id===id) : null;
  openModal(`
    <div class="modal-head"><h3>${it?'Modifier':'Ajouter'} — ${escapeHtml(def.label)}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Code</label><input type="text" id="pi_code" value="${it?escapeHtml(it.code||''):''}" placeholder="Ex. K10"></div>
      <div class="field"><label>Libellé *</label><input type="text" id="pi_libelle" value="${it?escapeHtml(it.libelle||''):''}" placeholder="Ex. Kaufel 10"></div>
      ${hasBrand?`<div class="field"><label>Marque de rattachement</label>
        <select id="pi_brand">
          <option value="">Toutes les marques</option>
          ${state.brands.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b=>`<option value="${b.id}" ${it&&it.brandId===b.id?'selected':''}>${escapeHtml(b.name)}</option>`).join('')}
        </select>
      </div>`:''}
      ${hasFamille?`<div class="field"><label>Famille de rattachement</label>
        <select id="pi_famille">
          <option value="">Aucune famille</option>
          ${(state.paramLists.famillesClients||[]).slice().sort((a,b)=>(a.libelle||'').localeCompare(b.libelle||'')).map(f=>`<option value="${f.id}" ${it&&it.familleId===f.id?'selected':''}>${escapeHtml(f.libelle)}</option>`).join('')}
        </select>
        <div class="helper" style="margin-top:4px;">Permet de filtrer les sous-familles proposées selon la famille sélectionnée sur la fiche client.</div>
      </div>`:''}
      ${hasOutcome?`<div class="field"><label>Catégorie</label>
        <select id="pi_outcome">
          <option value="encours" ${(!it||it.outcome==='encours'||!it.outcome)?'selected':''}>En cours (n'affecte pas le CA)</option>
          <option value="gagnee" ${it&&it.outcome==='gagnee'?'selected':''}>Affaire gagnée (compte dans le CA / devis gagnés)</option>
          <option value="perdue" ${it&&it.outcome==='perdue'?'selected':''}>Affaire perdue (compte dans les devis perdus)</option>
        </select>
        <div class="helper" style="margin-top:4px;">Détermine comment cet état est pris en compte dans le CA, le Rapport et le Tableau de bord — le libellé lui-même reste entièrement personnalisable.</div>
      </div>`:''}
    </div>
    <div class="modal-foot">
      ${it?`<button class="btn btn-danger" onclick="deleteParamItem('${listKey}','${it.id}')" style="margin-right:auto;">Supprimer</button>`:''}
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveParamItem('${listKey}',${it?`'${it.id}'`:'null'})">Enregistrer</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('pi_libelle').focus(),50);
}
function saveParamItem(listKey, id){
  const libelle = document.getElementById('pi_libelle').value.trim();
  if(!libelle){ showToast('Le libellé est requis.'); return; }
  const code = document.getElementById('pi_code').value.trim();
  const brandEl = document.getElementById('pi_brand');
  const brandId = brandEl ? brandEl.value : undefined;
  const familleEl = document.getElementById('pi_famille');
  const familleId = familleEl ? (familleEl.value || null) : undefined;
  const outcomeEl = document.getElementById('pi_outcome');
  const outcome = outcomeEl ? outcomeEl.value : undefined;
  state.paramLists[listKey] = state.paramLists[listKey] || [];
  if(id){
    Object.assign(state.paramLists[listKey].find(x=>x.id===id), {code, libelle, ...(brandEl?{brandId}:{}), ...(familleEl?{familleId}:{}), ...(outcomeEl?{outcome}:{})});
  } else {
    state.paramLists[listKey].push({id:uid(), code, libelle, ...(brandEl?{brandId}:{}), ...(familleEl?{familleId}:{}), ...(outcomeEl?{outcome}:{})});
  }
  persist('paramLists');
  closeModal();
  updateParamListOnly();
  showToast('Élément enregistré.');
}
function deleteParamItem(listKey, id){
  if(!confirm('Supprimer cet élément de la liste ? Retrouvable dans la Corbeille.')) return;
  const item = (state.paramLists[listKey]||[]).find(x=>x.id===id);
  const def = PARAM_LIST_DEFS.find(d=>d.key===listKey);
  if(item) moveToTrash('paramItem', `${def?def.label:listKey} — ${item.libelle||''}`, {listKey, item});
  state.paramLists[listKey] = (state.paramLists[listKey]||[]).filter(x=>x.id!==id);
  persist('paramLists');
  closeModal();
  updateParamListOnly();
  showToast('Élément déplacé dans la Corbeille.');
}
const DEFAULT_EMAIL_TEMPLATE = `{greeting}

Veuillez trouver ci-joint notre {type} n° {numero}{objet}.

N'hésitez pas à revenir vers nous pour toute question.`;
const DEFAULT_EMAIL_TEMPLATE_TU = `{greeting}

Tu trouveras ci-joint notre {type} n° {numero}{objet}.

N'hésite pas à revenir vers nous pour toute question.`;
function buildDevisEmailBody(d, useTu){
  const template = useTu
    ? (state.settings.emailMessageTemplateTu || DEFAULT_EMAIL_TEMPLATE_TU)
    : (state.settings.emailMessageTemplate || DEFAULT_EMAIL_TEMPLATE);
  const greeting = 'Bonjour' + (d.attentionA ? ' '+d.attentionA : '') + ',';
  const objetPart = d.objet ? ' concernant : '+d.objet : '';
  return template
    .replace(/\{greeting\}/g, greeting)
    .replace(/\{type\}/g, (d.type||'devis').toLowerCase())
    .replace(/\{numero\}/g, d.number)
    .replace(/\{objet\}/g, objetPart);
}
function refreshSendDevisMailBody(devisId){
  const d = state.devis.find(x=>x.id===devisId) || (draft&&draft.id===devisId?draft:null);
  const box = document.getElementById('sendmail_body');
  if(!d || !box) return;
  const involvedBrandIds = [...new Set((d.lines||[]).map(l=>l.brandId))].filter(Boolean);
  const soleBrand = involvedBrandIds.length===1 ? state.brands.find(b=>b.id===involvedBrandIds[0]) : null;
  const hasCustomSignature = soleBrand && (soleBrand.emailSignatureHtml||'').trim();
  const signaturePlain = hasCustomSignature ? (soleBrand.emailSignature||'').trim() : '';
  const useTu = ui.sendDevisMailTu||false;
  box.value = hasCustomSignature ? `${buildDevisEmailBody(d, useTu)}\n\n${signaturePlain}` : buildDevisEmailBody(d, useTu);
}
function saveEmailTemplate(){
  const val = document.getElementById('s_emailTemplate').value;
  state.settings.emailMessageTemplate = val;
  const valTu = document.getElementById('s_emailTemplateTu');
  if(valTu) state.settings.emailMessageTemplateTu = valTu.value;
  persist('settings');
  showToast('Modèle de message enregistré.');
}
function saveSettings(){
  Object.assign(state.settings, {
    companyName: document.getElementById('s_name').value.trim(),
    companyAddress: document.getElementById('s_address').value.trim(),
    companyEmail: document.getElementById('s_email').value.trim(),
    companyPhone: document.getElementById('s_phone').value.trim(),
    siret: document.getElementById('s_siret').value.trim(),
    tvaDefault: 0,
    representantNom: document.getElementById('s_representantNom').value.trim(),
    portable: document.getElementById('s_portable').value.trim(),
    initiales: document.getElementById('s_initiales').value.trim().toUpperCase(),
    nextNumberDevis: parseInt(document.getElementById('s_nextNumberDevis').value)||1,
    nextNumberMarche: parseInt(document.getElementById('s_nextNumberMarche').value)||1,
    validiteDevisMois: parseInt(document.getElementById('s_validiteDevisMois').value)||0,

    icsCalendarUrl: document.getElementById('s_icsUrl').value.trim(),
    emailMessageTemplate: document.getElementById('s_emailTemplate').value,
  });
  persist('settings');
  render();
  showToast('Paramètres enregistrés.');
}

<script>
/* ============================= CALCULS CA / DEVIS ============================= */
function lineDistribUnit(line){
  if(line.distribOverride!=null) return line.distribOverride;
  if(line.prixNetTarget==='distri' && line.netPriceOverride!=null) return line.netPriceOverride;
  const base = line.prixUnitaire||0;
  const f1 = 1 - ((line.remisePct1||0)/100);
  const f2 = 1 - ((line.remisePct2||0)/100);
  const f3 = 1 - ((line.remisePct3||0)/100);
  return base * f1 * f2 * f3;
}
function lineTotalHT(line, destinataire){
  // Le Total HT (devis comme marché) se calcule toujours sur le Prix d'achat HT de la ligne,
  // quel que soit le destinataire choisi. On arrondit ce prix unitaire à la centime avant de le
  // multiplier par la quantité — c'est-à-dire sur la valeur réellement affichée à l'écran — pour que
  // le Total HT corresponde toujours exactement à "Quantité × Prix d'achat HT affiché", même quand ce
  // dernier découle d'un calcul de remise avec plusieurs décimales cachées.
  const unit = +lineDistribUnit(line).toFixed(2);
  return (line.qty||0) * unit;
}
function lineMargin(line){
  const distribUnit = lineDistribUnit(line);
  const client = line.prixClient||0;
  const amount = (client - distribUnit) * (line.qty||0);
  const pct = client>0 ? ((client - distribUnit)/client*100) : 0;
  return { amount, pct, distribUnit };
}
function devisTotal(d){
  const ht = (d.lines||[]).reduce((s,l)=>s+lineTotalHT(l, d.destinataire),0);
  return { ht, tva:0, ttc: ht };
}
function yearOf(dateStr){ return dateStr ? parseInt(dateStr.slice(0,4)) : null; }

function devisMatchesCommercial(d, commercialId){
  if(!commercialId || commercialId==='all') return true;
  const c = state.clients.find(x=>x.id===d.clientId);
  return !!c && c.commercialId===commercialId;
}
function caForBrand(brandId, year, commercialId){
  let total = 0;
  state.devis.filter(d=>isDevisWon(d)).forEach(d=>{
    if(year && yearOf(d.date)!==year) return;
    if(!devisMatchesCommercial(d, commercialId)) return;
    (d.lines||[]).forEach(l=>{ if(l.brandId===brandId) total += lineTotalHT(l, d.destinataire); });
  });
  return total;
}
function caForBrandMonth(brandId, year, month, commercialId){
  let total = 0;
  state.devis.filter(d=>isDevisWon(d)).forEach(d=>{
    if(year && yearOf(d.date)!==year) return;
    if(month && parseInt(d.date.slice(5,7))!==month) return;
    if(!devisMatchesCommercial(d, commercialId)) return;
    (d.lines||[]).forEach(l=>{ if(l.brandId===brandId) total += lineTotalHT(l, d.destinataire); });
  });
  return total;
}
function caForClient(clientId, year, commercialId){
  let total = 0;
  state.devis.filter(d=>isDevisWon(d) && d.clientId===clientId).forEach(d=>{
    if(year && yearOf(d.date)!==year) return;
    if(!devisMatchesCommercial(d, commercialId)) return;
    total += devisTotal(d).ht;
  });
  return total;
}
function availableYears(){
  const ys = new Set(state.devis.map(d=>yearOf(d.date)).filter(Boolean));
  const current = new Date().getFullYear();
  // Toujours proposer l'année en cours et les 3 précédentes, même sans devis dessus — indispensable pour
  // saisir un CA (VVA) manuel sur une année passée (ex. pour analyser l'évolution d'un client).
  for(let y=current-3; y<=current; y++) ys.add(y);
  return Array.from(ys).sort((a,b)=>b-a);
}
function previewNextDevisNumber(type){
  const s = state.settings;
  const n = type==='Marché' ? (s.nextNumberMarche||1) : (s.nextNumberDevis||s.nextNumber||1);
  return s.initiales ? `${s.initiales}-${n}` : String(n);
}
function consumeNextDevisNumber(type){
  const number = previewNextDevisNumber(type);
  if(type==='Marché'){
    state.settings.nextNumberMarche = (state.settings.nextNumberMarche||1) + 1;
  } else {
    state.settings.nextNumberDevis = (state.settings.nextNumberDevis||state.settings.nextNumber||1) + 1;
  }
  persist('settings');
  return number;
}
