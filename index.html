        <option value="all" ${clientFilter==='all'?'selected':''}>Tous les clients</option>
        ${state.clients.slice().sort((a,b)=>clientSocieteLabel(a.id).localeCompare(clientSocieteLabel(b.id))).map(c=>`<option value="${c.id}" ${clientFilter===c.id?'selected':''}>${escapeHtml(clientSocieteLabel(c.id))}</option>`).join('')}
      </select>
    </div>
    <button type="button" class="btn btn-sm btn-ghost" onclick="if(confirm('Réinitialiser la disposition du tableau de bord ?')){ state.dashboardLayout={order:[],sizes:{},heights:{}}; persist('dashboardLayout'); render(); }" title="Réinitialiser l'ordre, la taille et la hauteur des cartes">Réinitialiser la disposition</button>
  </div>
  <div class="helper" style="margin-bottom:10px;">Glissez une carte par sa poignée ⠿ pour la déplacer, utilisez − / + pour changer sa largeur, ou tirez le coin inférieur droit pour ajuster sa hauteur.</div>
  <div class="dash-grid">${widgetCardsHtml}</div>
  `;
}

/* ============================= DRILL-DOWN TABLEAU DE BORD ============================= */
/* Système en entonnoir : clic sur un agrégat (KPI, barre de graphique, ligne de tableau) → liste
   des devis/marchés concernés → clic sur un devis de cette liste → ouverture du devis en détail. */
function dashScopeFilter(cmId, brandFilter, clientFilter){
  return d => devisMatchesCommercial(d, cmId)
    && (brandFilter==='all' || (d.lines||[]).some(l=>l.brandId===brandFilter))
    && (clientFilter==='all' || d.clientId===clientFilter);
}
function dashScopeDescription(year, cmId, brandFilter, clientFilter){
  const parts = [];
  if(year) parts.push('Année '+year);
  if(cmId && cmId!=='all'){ const cm = state.commerciaux.find(x=>x.id===cmId); if(cm) parts.push(commercialDisplayName(cm)); }
  if(brandFilter && brandFilter!=='all') parts.push(brandName(brandFilter));
  if(clientFilter && clientFilter!=='all') parts.push(clientSocieteLabel(clientFilter));
  return parts.join(' — ');
}
function openDevisDrillDownModal(title, subtitle, devisList){
  const list = devisList.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  renderDrillDownModalBody(title, subtitle, list);
}
function renderDrillDownModalBody(title, subtitle, list){
  const totalSum = list.reduce((s,d)=>s+devisTotal(d).ht,0);
  const rows = list.map(d=>{
    const c = state.clients.find(x=>x.id===d.clientId);
    const brandsInvolved = [...new Set((d.lines||[]).map(l=>l.brandId))].map(id=>state.brands.find(b=>b.id===id)).filter(Boolean);
    return `<tr style="cursor:pointer;" onclick="closeModal(); openDevisForm('${d.id}');">
      <td style="font-weight:600;">${escapeHtml(d.number)}</td>
      <td>${fmtDate(d.date)}</td>
      <td>${escapeHtml(c?clientSocieteLabel(c.id):'—')}</td>
      <td>${escapeHtml(d.objet||'—')}</td>
      <td>${brandsInvolved.map(b=>`<span class="chip" style="background:${brandColor(b.id)};margin-right:3px;"><span class="sq"></span>${escapeHtml(b.name)}</span>`).join('')||'—'}</td>
      <td onclick="event.stopPropagation();">
        <select onchange="changeDrillDownApporteur('${d.id}', this.value, '${escapeJsStr(title)}', '${escapeJsStr(subtitle||'')}')" style="width:auto;padding:4px 8px;font-size:11.5px;">
          <option value="" ${!d.apporteurAffaire?'selected':''}>—</option>
          <option value="Agent" ${d.apporteurAffaire==='Agent'?'selected':''}>Agent</option>
          <option value="Distributeur" ${d.apporteurAffaire==='Distributeur'?'selected':''}>Distributeur</option>
        </select>
      </td>
      <td class="num" style="font-weight:700;">${fmtMoney(devisTotal(d).ht)}</td>
    </tr>`;
  }).join('');
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${subtitle?`<div class="helper" style="margin-bottom:14px;">${escapeHtml(subtitle)}</div>`:''}
      ${list.length===0?'<div class="helper">Aucun devis / marché ne correspond à cette sélection.</div>':`
      <div class="table-wrap"><table>
        <thead><tr><th>Numéro</th><th>Date</th><th>Client</th><th>Objet</th><th>Marque(s)</th><th>Apporteur</th><th class="num">Total HT</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="helper" style="margin-top:10px;text-align:right;">${list.length} devis/marché(s) — total : <strong>${fmtMoney(totalSum)}</strong></div>
      <div class="helper" style="margin-top:6px;">Cliquez sur une ligne pour ouvrir le devis en détail.</div>
      `}
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Fermer</button>
    </div>
  `);
}
function escapeJsStr(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
function changeDrillDownApporteur(id, apporteur, title, subtitle){
  const d = state.devis.find(x=>x.id===id);
  if(!d) return;
  const old = d.apporteurAffaire||'';
  d.apporteurAffaire = apporteur||'';
  if(old!==d.apporteurAffaire){
    d.history = Array.isArray(d.history) ? d.history : [];
    d.history.push({ ts: new Date().toISOString(), type:'modified', changes:[`Apporteur de l'affaire : ${old||'—'} → ${d.apporteurAffaire||'—'}`] });
  }
  persist('devis');
  refreshDrillDownAfterChange(title, subtitle);
}
function changeDrillDownStatus(id, status, title, subtitle){
  const d = state.devis.find(x=>x.id===id);
  if(!d) return;
  const oldStatus = d.status;
  d.status = status;
  if(oldStatus!==status){
    d.history = Array.isArray(d.history) ? d.history : [];
    d.history.push({ ts: new Date().toISOString(), type:'modified', changes:[`Statut : ${oldStatus||'—'} → ${status}`] });
  }
  persist('devis');
  refreshDrillDownAfterChange(title, subtitle);
}
function refreshDrillDownAfterChange(title, subtitle){
  // Les devis affichés dans la fenêtre restent les mêmes (on ne recalcule pas le filtre d'origine),
  // seules leurs valeurs modifiées sont reflétées — la vue générale (KPI, graphiques) se recalculera
  // à la fermeture de la fenêtre puisque render() est appelé maintenant en tâche de fond.
  // On retrouve la liste actuelle affichée via les lignes déjà présentes n'est pas fiable après
  // modification : on relit directement les devis via leurs numéros affichés dans le tableau.
  const box = document.getElementById('modalBox');
  if(box){
    const numbers = Array.from(box.querySelectorAll('tbody tr td:first-child')).map(td=>td.textContent.trim());
    const list = numbers.map(n=>state.devis.find(d=>d.number===n)).filter(Boolean);
    renderDrillDownModalBody(title, subtitle, list);
  }
  render();
  showToast('Mise à jour enregistrée.');
}
function drillDownAccepted(year, cmId, brandFilter, clientFilter){
  const inScope = dashScopeFilter(cmId, brandFilter, clientFilter);
  const list = state.devis.filter(d=>isDevisWon(d) && yearOf(d.date)===year && inScope(d));
  openDevisDrillDownModal(`CA ${year} — devis gagnés`, dashScopeDescription(year, cmId, brandFilter, clientFilter), list);
}
function drillDownEnCours(cmId, brandFilter, clientFilter){
  const inScope = dashScopeFilter(cmId, brandFilter, clientFilter);
  const list = state.devis.filter(d=>(d.status==='Envoyé'||d.status==='Brouillon') && !isDevisWon(d) && !isDevisLost(d) && inScope(d));
  openDevisDrillDownModal('Devis en cours', dashScopeDescription(null, cmId, brandFilter, clientFilter), list);
}
function drillDownBrand(year, cmId, brandFilter, clientFilter, targetBrandId){
  const inScope = dashScopeFilter(cmId, brandFilter, clientFilter);
  const list = state.devis.filter(d=>yearOf(d.date)===year && inScope(d) && (d.lines||[]).some(l=>l.brandId===targetBrandId) && isDevisWon(d));
  openDevisDrillDownModal(`${escapeHtml(brandName(targetBrandId))} — devis gagnés`, dashScopeDescription(year, cmId, brandFilter, clientFilter), list);
}
function drillDownClient(year, cmId, brandFilter, clientFilter, targetClientId){
  const inScope = dashScopeFilter(cmId, brandFilter, clientFilter);
  const list = state.devis.filter(d=>yearOf(d.date)===year && inScope(d) && d.clientId===targetClientId && isDevisWon(d));
  openDevisDrillDownModal(`${escapeHtml(clientSocieteLabel(targetClientId))} — devis gagnés`, dashScopeDescription(year, cmId, brandFilter, clientFilter), list);
}
function drillDownMonth(year, month, cmId, brandFilter, clientFilter){
  const inScope = dashScopeFilter(cmId, brandFilter, clientFilter);
  const list = state.devis.filter(d=>yearOf(d.date)===year && inScope(d) && parseInt((d.date||'').slice(5,7),10)===month);
  const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  openDevisDrillDownModal(`${monthNames[month-1]} ${year} — devis/marchés`, dashScopeDescription(null, cmId, brandFilter, clientFilter), list);
}
function drillDownApporteur(year, cmId, brandFilter, clientFilter, targetBrandId, apporteur){
  const inScope = dashScopeFilter(cmId, brandFilter, clientFilter);
  let list = state.devis.filter(d=>yearOf(d.date)===year && inScope(d) && (d.lines||[]).some(l=>l.brandId===targetBrandId));
  let label = `${brandName(targetBrandId)} — tous devis/marchés`;
  if(apporteur==='nonPrecise'){ list = list.filter(d=>d.apporteurAffaire!=='Agent' && d.apporteurAffaire!=='Distributeur'); label = `${brandName(targetBrandId)} — apporteur non précisé`; }
  else if(apporteur){ list = list.filter(d=>d.apporteurAffaire===apporteur); label = `${brandName(targetBrandId)} — apporteur ${apporteur}`; }
  openDevisDrillDownModal(escapeHtml(label), dashScopeDescription(year, cmId, brandFilter, clientFilter), list);
}

function initDashboardCharts(){
  const y = ui.dashboardYear;
  const cmId = ui.dashboardCommercial;
  const brandFilter = ui.dashboardBrand || 'all';
  const clientFilter = ui.dashboardClient || 'all';
  const inDashboardScope = d => devisMatchesCommercial(d, cmId)
    && (brandFilter==='all' || (d.lines||[]).some(l=>l.brandId===brandFilter))
    && (clientFilter==='all' || d.clientId===clientFilter);
  if(chartBrandInstance){ chartBrandInstance.destroy(); chartBrandInstance=null; }
  if(chartClientInstance){ chartClientInstance.destroy(); chartClientInstance=null; }
  if(chartCorrelationInstance){ chartCorrelationInstance.destroy(); chartCorrelationInstance=null; }
  const brandCanvas = document.getElementById('chartBrand');
  const clientCanvas = document.getElementById('chartClient');
  const correlationCanvas = document.getElementById('chartCorrelation');
  if(!brandCanvas || !clientCanvas) return;

  const acceptedYear = state.devis.filter(d=>isDevisWon(d) && yearOf(d.date)===y && inDashboardScope(d));
  const caSource = ui.dashboardCaSource||'devis';

  const brandData = state.brands.filter(b=>brandFilter==='all'||b.id===brandFilter).map(b=>{
    let total;
    if(caSource==='vva'){
      total = caVvaTotal(y, b.id, clientFilter);
    } else {
      total = 0;
      acceptedYear.forEach(d=>{ (d.lines||[]).forEach(l=>{ if(l.brandId===b.id) total += lineTotalHT(l, d.destinataire); }); });
    }
    return {label:b.name, value:total, color:brandColor(b.id)};
  }).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);

  const clientsInScope = (cmId==='all' ? state.clients : state.clients.filter(c=>c.commercialId===cmId))
    .filter(c=>clientFilter==='all'||c.id===clientFilter);
  const clientData = clientsInScope.map(c=>{
    const total = caSource==='vva' ? caVvaTotal(y, brandFilter, c.id) : acceptedYear.filter(d=>d.clientId===c.id).reduce((s,d)=>s+devisTotal(d).ht,0);
    return {label:c.name, value:total};
  }).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,8);

  if(brandData.length===0){
    brandCanvas.parentElement.innerHTML = `<div class="helper" style="padding:40px 0;text-align:center;">Aucun CA (${caSource==='vva'?'VVA':'devis gagnés'}) pour cette année.</div>`;
  } else {
    chartBrandInstance = new Chart(brandCanvas, {
      type:'bar',
      data:{labels:brandData.map(x=>x.label), datasets:[{data:brandData.map(x=>x.value), backgroundColor:brandData.map(x=>x.color), borderRadius:5, maxBarThickness:28}]},
      options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
        onClick:(evt, elements)=>{
          if(!elements.length) return;
          const targetBrand = state.brands.find(b=>b.name===brandData[elements[0].index].label);
          if(!targetBrand) return;
          if(caSource==='vva') openCaVvaModal(y, targetBrand.id, clientFilter);
          else drillDownBrand(y, cmId, brandFilter, clientFilter, targetBrand.id);
        },
        onHover:(evt, elements)=>{ evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; },
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>fmtMoney(ctx.parsed.x)}}},
        scales:{x:{ticks:{callback:(v)=>v+' €'}, grid:{color:'#EEEBE0'}}, y:{grid:{display:false}}}
      }
    });
  }
  if(clientData.length===0){
    clientCanvas.parentElement.innerHTML = `<div class="helper" style="padding:40px 0;text-align:center;">Aucun CA (${caSource==='vva'?'VVA':'devis gagnés'}) pour cette année.</div>`;
  } else {
    chartClientInstance = new Chart(clientCanvas, {
      type:'bar',
      data:{labels:clientData.map(x=>x.label), datasets:[{data:clientData.map(x=>x.value), backgroundColor:'#B8863B', borderRadius:5, maxBarThickness:28}]},
      options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
        onClick:(evt, elements)=>{
          if(!elements.length) return;
          const targetClient = clientsInScope.find(c=>c.name===clientData[elements[0].index].label);
          if(!targetClient) return;
          if(caSource==='vva') openCaVvaModal(y, brandFilter, targetClient.id);
          else drillDownClient(y, cmId, brandFilter, clientFilter, targetClient.id);
        },
        onHover:(evt, elements)=>{ evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; },
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>fmtMoney(ctx.parsed.x)}}},
        scales:{x:{ticks:{callback:(v)=>v+' €'}, grid:{color:'#EEEBE0'}}, y:{grid:{display:false}}}
      }
    });
  }

  if(correlationCanvas){
    const monthNames = ['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
    const scopedYearDevis = state.devis.filter(d=>yearOf(d.date)===y && inDashboardScope(d));
    const monthly = Array.from({length:12}, ()=>({nb:0, ca:0}));
    scopedYearDevis.forEach(d=>{
      const m = parseInt((d.date||'').slice(5,7),10);
      if(m>=1 && m<=12) monthly[m-1].nb += 1;
    });
    scopedYearDevis.filter(d=>isDevisWon(d)).forEach(d=>{
      const m = parseInt((d.date||'').slice(5,7),10);
      if(m>=1 && m<=12) monthly[m-1].ca += devisTotal(d).ht;
    });
    if(scopedYearDevis.length===0){
      correlationCanvas.parentElement.innerHTML = '<div class="helper" style="padding:40px 0;text-align:center;">Aucun devis/marché pour cette période.</div>';
    } else {
      chartCorrelationInstance = new Chart(correlationCanvas, {
        data:{
          labels: monthNames,
          datasets:[
            {type:'bar', label:'Nombre de devis/marchés', data:monthly.map(m=>m.nb), backgroundColor:'#B8863B', borderRadius:5, maxBarThickness:26, yAxisID:'yNb', order:2},
            {type:'line', label:'CA généré (€)', data:monthly.map(m=>m.ca), borderColor:'#2F6FBD', backgroundColor:'#2F6FBD', tension:0.3, pointRadius:3, yAxisID:'yCa', order:1}
          ]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          onClick:(evt, elements)=>{
            if(!elements.length) return;
            drillDownMonth(y, elements[0].index+1, cmId, brandFilter, clientFilter);
          },
          onHover:(evt, elements)=>{ evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; },
          plugins:{
            legend:{display:true, position:'bottom', labels:{boxWidth:12, font:{size:11}}},
            tooltip:{callbacks:{label:(ctx)=> ctx.dataset.yAxisID==='yCa' ? ('CA : '+fmtMoney(ctx.parsed.y)) : ('Devis : '+ctx.parsed.y)}}
          },
          scales:{
            x:{grid:{display:false}},
            yNb:{position:'left', beginAtZero:true, ticks:{precision:0}, grid:{color:'#EEEBE0'}, title:{display:true, text:'Nb devis'}},
            yCa:{position:'right', beginAtZero:true, grid:{drawOnChartArea:false}, ticks:{callback:(v)=>v+' €'}, title:{display:true, text:'CA €'}}
          }
        }
      });
    }
  }
}

/* ============================= INIT ============================= */
// Synchronisation en direct entre plusieurs fenêtres/onglets du même navigateur (ex. une seconde
// fenêtre glissée sur un second écran) : quand l'une enregistre une donnée dans localStorage,
// l'événement "storage" se déclenche automatiquement dans les AUTRES fenêtres pour qu'elles se
// mettent à jour sans avoir besoin de recharger la page.
window.addEventListener('storage', (e)=>{
  if(!e.key || !e.key.startsWith('comagentco_')) return;
  const rest = e.key.slice('comagentco_'.length);
  if(rest.indexOf('__c')>=0) return; // morceau de données : on ne réagit qu'au sommaire principal
  const known = ['brands','clients','tarifs','listesPrixNets','prixNetListes','devis','devisTemplates','commerciaux','devisAttachments','trash','settings','paramLists','commissions','caVva','dashboardLayout','rapportLayout'];
  if(known.indexOf(rest)===-1) return;
  syncKeyFromLocalStorage(rest);
});
function syncKeyFromLocalStorage(k){
  if(!state.loaded) return;
  try{
    const raw = localStorage.getItem('comagentco_'+k);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.__chunked){
      const suffix = parsed.gen ? ('__'+parsed.gen) : '';
      let full = '';
      for(let i=0;i<parsed.count;i++){
        full += localStorage.getItem('comagentco_'+k+'__c'+i+suffix) || '';
      }
      state[k] = JSON.parse(full);
    } else {
      state[k] = parsed;
    }
    if(k==='tarifs') invalidateTarifsSortCache();
    if(k==='listesPrixNets') invalidatePnSortCache();
    render();
  }catch(e){ console.error('Erreur de synchronisation inter-fenêtres', k, e); }
}
document.addEventListener('click', (ev)=>{
  // Referme la saisie mensuelle des commissions (marque dépliée) dès qu'on clique en dehors du tableau
  // ou de la petite fenêtre de saisie détaillée, sans toucher au reste de la page.
  if(ui.tab!=='commissions' || !ui.commissionsExpandedBrand) return;
  if(ev.target.closest('#commissionsTableCard')) return;
  ui.commissionsExpandedBrand = null;
  updateCommissionsTableOnly();
});
document.addEventListener('click', (ev)=>{
  // Referme tout filtre déroulant (ex. "État de l'affaire" dans Devis) dès qu'on clique en dehors de
  // celui-ci ou sur un autre filtre — un <details> ne le fait pas tout seul par défaut.
  document.querySelectorAll('details.filter-details[open]').forEach(det=>{
    if(!det.contains(ev.target)) det.removeAttribute('open');
  });
});
document.addEventListener('click', (ev)=>{
  // Revient au tableau général de "Performance client" dès qu'on clique en dehors des cartes
  // progression/régression ou du tableau lui-même.
  if(ui.tab!=='perfClient' || !ui.perfClientFilterMode) return;
  const cardP = document.getElementById('perfClientCardProgression');
  const cardR = document.getElementById('perfClientCardRegression');
  const table = document.getElementById('perfClientTableWrap');
  if((cardP && cardP.contains(ev.target)) || (cardR && cardR.contains(ev.target)) || (table && table.contains(ev.target))) return;
  ui.perfClientFilterMode = null;
  render();
});
loadAll();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker non enregistré (normal en ouverture locale file://) :', e));
  });
}
