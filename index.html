/* ============================= IMPORT DEVIS (Excel / CSV) ============================= */
/* Format attendu : une ligne par ligne de produit, les colonnes d'en-tête (numéro, client, date...)
   étant répétues sur chaque ligne d'un même devis. Les lignes partageant le même numéro sont regroupées
   pour reconstituer chaque devis (en-tête + lignes). C'est le format le plus courant en export depuis
   un autre logiciel de gestion commerciale. */
let importParsedRowsDevis = null;
function parseDateLoose(raw){
  if(!raw) return todayStr();
  const s = String(raw).trim();
  if(!s) return todayStr();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = '20'+y;
    const dt = `${y.padStart(4,'0')}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
    return isNaN(new Date(dt).getTime()) ? todayStr() : dt;
  }
  const asDate = new Date(s);
  return isNaN(asDate.getTime()) ? todayStr() : asDate.toISOString().slice(0,10);
}
function matchClientByLabel(label){
  const norm = (label||'').trim().toLowerCase();
  if(!norm) return null;
  return state.clients.find(c=>(c.company||'').trim().toLowerCase()===norm)
      || state.clients.find(c=>(c.name||'').trim().toLowerCase()===norm)
      || null;
}
function matchBrandByLabel(label){
  const norm = (label||'').trim().toLowerCase();
  if(!norm) return null;
  return state.brands.find(b=>(b.name||'').trim().toLowerCase()===norm) || null;
}
function matchStatutByLabel(label){
  const norm = (label||'').trim().toLowerCase();
  if(!norm) return 'Brouillon';
  const exact = STATUTS.find(s=>s.toLowerCase()===norm);
  if(exact) return exact;
  if(/envoy/.test(norm)) return 'Envoyé';
  return 'Brouillon';
}
function matchEtatAffaireByLabel(label){
  const norm = (label||'').trim().toLowerCase();
  if(!norm) return '';
  const exact = (state.paramLists.etatAffaires||[]).find(e=>(e.libelle||'').toLowerCase()===norm);
  if(exact) return exact.libelle;
  let outcome = null;
  if(/accept|gagn|valid|command/.test(norm)) outcome = 'gagnee';
  else if(/refus|perdu|annul/.test(norm)) outcome = 'perdue';
  if(!outcome) return '';
  const match = (state.paramLists.etatAffaires||[]).find(e=>(e.outcome||'encours')===outcome);
  return match ? match.libelle : '';
}
function openImportModalDevis(){
  if(state.clients.length===0){ showToast('Ajoutez d\'abord vos clients (l\'import de devis a besoin de les retrouver par société).'); return; }
  importParsedRowsDevis = null;
  openModal(`
    <div class="modal-head"><h3>Importer des devis (Excel ou CSV)</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="helper" style="margin-bottom:12px;">
        Format attendu : <strong>une ligne par devis</strong> (ou une ligne par marque si un devis en comporte plusieurs), avec le numéro de devis, le client, la date, la marque et le montant total. Sans détail produit par produit : chaque devis importé aura une seule ligne globale reprenant ce montant.
        <br>Chaque client doit déjà exister dans Comagentco (recherché par société, puis par nom) — importez d'abord vos clients si besoin.
      </div>
      <label>Fichier</label>
      <div class="upload-zone" onclick="document.getElementById('impDevis_file').click()">
        <input type="file" id="impDevis_file" accept=".csv,.xlsx,.xls" onchange="handleImportFileDevis(event)">
        <div id="impDevis_zoneText">📄 Cliquez pour choisir un fichier .xlsx, .xls ou .csv</div>
      </div>
      <div id="impDevis_mapping"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="impDevis_confirmBtn" style="display:none;" onclick="confirmImportDevis()">Importer</button>
    </div>
  `);
}
function handleImportFileDevis(evt){
  const file = evt.target.files[0];
  if(!file) return;
  document.getElementById('impDevis_zoneText').innerHTML = `✔ ${escapeHtml(file.name)}`;
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    Papa.parse(file, {
      header:false, skipEmptyLines:true,
      complete: (res)=>{ importParsedRowsDevis = res.data; renderImportMappingDevis(); },
      error: ()=> showToast('Impossible de lire ce fichier CSV.')
    });
  } else if(ext==='xlsx' || ext==='xls'){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, {header:1, raw:false, defval:''});
        importParsedRowsDevis = rows.filter(r=>r.some(cell=>String(cell).trim()!==''));
        renderImportMappingDevis();
      }catch(err){
        showToast('Impossible de lire ce fichier Excel.');
      }
    };
    reader.onerror = ()=> showToast('Impossible de lire ce fichier.');
    reader.readAsArrayBuffer(file);
  } else {
    showToast('Format non pris en charge. Utilisez .xlsx, .xls ou .csv');
  }
}
function renderImportMappingDevis(){
  if(!importParsedRowsDevis || importParsedRowsDevis.length===0){ showToast('Fichier vide ou illisible.'); return; }
  const first = importParsedRowsDevis[0];
  const nCols = first.length;
  const opts = (sel)=> `<option value="-1">— Non utilisé —</option>` + Array.from({length:nCols}).map((_,i)=>`<option value="${i}" ${i===sel?'selected':''}>Colonne ${i+1}: "${escapeHtml(String(first[i]||'').slice(0,24))}"</option>`).join('');
  const g = (regex)=> guessColIndex(first, regex);
  document.getElementById('impDevis_mapping').innerHTML = `
    <div class="divider"></div>
    <div class="field"><label><input type="checkbox" id="impDevis_hasHeader" checked style="width:auto;display:inline-block;margin-right:6px;">La première ligne est un en-tête</label></div>

    <div class="section-title">En-tête du devis <span class="helper" style="display:inline;">(répétée sur chaque ligne d'un même devis)</span></div>
    <div class="field-row">
      <div class="field"><label>Numéro de devis *</label><select id="impDevis_colNumero">${opts(g(/num[ée]ro|^n[°o]\b/i))}</select></div>
      <div class="field"><label>Client / Société *</label><select id="impDevis_colClient">${opts(g(/client|soci[ée]t[ée]/i))}</select></div>
      <div class="field"><label>Date</label><select id="impDevis_colDate">${opts(g(/^date/i))}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Objet</label><select id="impDevis_colObjet">${opts(g(/objet/i))}</select></div>
      <div class="field"><label>Référence commande / PO</label><select id="impDevis_colReference">${opts(g(/bon de commande|r[ée]f[ée]rence.*(commande|client)/i))}</select></div>
      <div class="field"><label>Statut</label><select id="impDevis_colStatut">${opts(g(/statut|status|[ée]tat/i))}</select></div>
    </div>
    <div class="field"><label>Commentaire</label><select id="impDevis_colNotes">${opts(g(/commentaire|note/i))}</select></div>

    <div class="section-title">Marque et montant</div>
    <div class="field-row">
      <div class="field"><label>Marque</label><select id="impDevis_colMarque">${opts(g(/marque|fabricant/i))}</select></div>
      <div class="field"><label>Montant total du devis (HT) *</label><select id="impDevis_colMontant">${opts(g(/montant|total.?ht|total.?devis|^total\b/i))}</select></div>
    </div>
    <div class="helper">${importParsedRowsDevis.length} ligne(s) détectée(s). Chaque ligne du fichier devient un devis avec une seule ligne globale reprenant le montant total — sans détail produit par produit.</div>
  `;
  document.getElementById('impDevis_confirmBtn').style.display='inline-flex';
}
function confirmImportDevis(){
  const hasHeader = document.getElementById('impDevis_hasHeader').checked;
  const col = (id)=> parseInt(document.getElementById(id).value);
  const cNumero = col('impDevis_colNumero'), cClient = col('impDevis_colClient'), cDate = col('impDevis_colDate');
  const cObjet = col('impDevis_colObjet'), cReference = col('impDevis_colReference'), cStatut = col('impDevis_colStatut'), cNotes = col('impDevis_colNotes');
  const cMarque = col('impDevis_colMarque'), cMontant = col('impDevis_colMontant');
  if(cNumero<0 || cClient<0 || cMontant<0){ showToast('Le numéro de devis, le client et le montant total sont obligatoires.'); return; }
  const get = (row,c)=> c>=0 ? String(row[c]||'').trim() : '';

  const rows = importParsedRowsDevis.slice(hasHeader?1:0);
  const groups = new Map(); // numéro -> { header, lines: [] }
  let skippedLines = 0;

  rows.forEach(row=>{
    const numero = get(row,cNumero);
    if(!numero || isHeaderLikeValue(numero)) return;
    const montant = parseMoneyLoose(row[cMontant]);
    if(!montant){ skippedLines++; return; }

    if(!groups.has(numero)){
      const clientLabel = get(row,cClient);
      groups.set(numero, {
        clientLabel,
        client: matchClientByLabel(clientLabel),
        date: parseDateLoose(get(row,cDate)),
        objet: get(row,cObjet),
        reference: get(row,cReference),
        statut: matchStatutByLabel(get(row,cStatut)),
        etat: matchEtatAffaireByLabel(get(row,cStatut)),
        notes: get(row,cNotes),
        lines: [],
      });
    }
    const grp = groups.get(numero);

    const marqueLabel = get(row,cMarque);
    const brand = matchBrandByLabel(marqueLabel);

    grp.lines.push({
      id: uid(), tarifId: null, brandId: brand?brand.id:null,
      reference: '', designation: brand ? brand.name : (grp.objet||'Montant du devis'),
      qty: 1, prixUnitaire: montant,
      remisePct1: 0, remisePct2: 0, remisePct3: 0,
      prixClient: montant,
      prixNetApplied: false, prixNetTarget: null, netPriceOverride: null,
      _marqueLabel: marqueLabel,
    });
  });

  let created = 0, skippedNoClient = 0, skippedNoLines = 0;
  const unmatchedClients = new Set();
  const unmatchedBrands = new Set();
  const usedNumbers = new Set(state.devis.map(d=>d.number));

  groups.forEach((grp, numero)=>{
    if(!grp.client){ skippedNoClient++; if(grp.clientLabel) unmatchedClients.add(grp.clientLabel); return; }
    if(grp.lines.length===0){ skippedNoLines++; return; }
    grp.lines.forEach(l=>{ if(l._marqueLabel && !l.brandId) unmatchedBrands.add(l._marqueLabel); delete l._marqueLabel; });
    let finalNumber = numero;
    let n = 2;
    while(usedNumbers.has(finalNumber)){ finalNumber = `${numero}-imp${n}`; n++; }
    usedNumbers.add(finalNumber);
    state.devis.push({
      id: uid(), number: finalNumber, type: 'Devis', date: grp.date,
      objet: grp.objet, reference: grp.reference, clientId: grp.client.id,
      validUntil: defaultValidUntil('Devis', grp.date), validUntilAuto: true,
      status: grp.statut, etatAffaire: grp.etat||'', destinataire: '', attentionA: '', tvaPct: 0,
      notes: grp.notes, lines: grp.lines, pdfColumns: {...DEFAULT_PDF_COLUMNS},
      history: [{ ts: new Date().toISOString(), type:'created', detail:'Import Excel / CSV' }],
    });
    created++;
  });

  persist('devis');
  closeModal();
  render();

  let msg = `Import terminé : ${created} devis créé(s).`;
  if(skippedNoClient>0) msg += ` ${skippedNoClient} ignoré(s) — client introuvable.`;
  if(skippedNoLines>0) msg += ` ${skippedNoLines} ignoré(s) — aucune ligne valide.`;
  if(skippedLines>0) msg += ` ${skippedLines} ligne(s) ignorée(s) (montant vide ou à 0).`;
  if(unmatchedClients.size>0) msg += ` Sociétés non reconnues : ${Array.from(unmatchedClients).slice(0,5).join(', ')}${unmatchedClients.size>5?'…':''} — créez-les d\'abord puis réessayez.`;
  if(unmatchedBrands.size>0) msg += ` Marques non reconnues (lignes importées sans marque) : ${Array.from(unmatchedBrands).slice(0,5).join(', ')}${unmatchedBrands.size>5?'…':''}.`;
  showToast(msg, 9000);
}
function clientSocieteLabel(clientId){
  const c = state.clients.find(x=>x.id===clientId);
  if(!c) return '—';
  return (c.company && c.company.trim()) ? c.company : c.name;
}
function allDevisEtatFilterValues(){
  return ['__empty__', ...(state.paramLists.etatAffaires||[]).map(e=>e.libelle)];

function changeDevisEtatAffaire(id, etat){
  const d = state.devis.find(x=>x.id===id);
  const old = d.etatAffaire||'';
  d.etatAffaire = etat||'';
  if(old!==d.etatAffaire){
    d.history = Array.isArray(d.history) ? d.history : [];
    d.history.push({ ts: new Date().toISOString(), type:'modified', changes:[`État de l'affaire : ${old||'—'} → ${d.etatAffaire||'—'}`] });
  }
  persist('devis');
  render();
  showToast("État de l'affaire mis à jour.");
}
function changeDevisApporteur(id, apporteur){
  const d = state.devis.find(x=>x.id===id);
  const old = d.apporteurAffaire||'';
  d.apporteurAffaire = apporteur||'';
  if(old!==d.apporteurAffaire){
    d.history = Array.isArray(d.history) ? d.history : [];
    d.history.push({ ts: new Date().toISOString(), type:'modified', changes:[`Apporteur de l'affaire : ${old||'—'} → ${d.apporteurAffaire||'—'}`] });
  }
  persist('devis');
  render();
  showToast('Apporteur mis à jour.');
}
function changeDevisStatus(id, status){
  const d = state.devis.find(x=>x.id===id);
  const oldStatus = d.status;
  d.status = status;
  if(oldStatus!==status){
    d.history = Array.isArray(d.history) ? d.history : [];
    d.history.push({ ts: new Date().toISOString(), type:'modified', changes:[`Statut : ${oldStatus||'—'} → ${status}`] });
  }
  persist('devis');
  render();
  showToast('Statut mis à jour.');
}
function deleteDevis(id){
  if(!confirm('Supprimer ce devis ? Retrouvable dans la Corbeille.')) return;
  const deleted = state.devis.find(d=>d.id===id);
  if(deleted && deleted.duplicatedFromId){
    const orig = state.devis.find(d=>d.id===deleted.duplicatedFromId);
    if(orig){
      const clientLabel = deleted.clientId ? clientDisplayName(state.clients.find(c=>c.id===deleted.clientId)||{}) : '—';
      orig.history = Array.isArray(orig.history) ? orig.history.slice() : [];
      orig.history.push({ ts: new Date().toISOString(), type:'duplicate_deleted', detail:deleted.number, clientLabel });
    }
  }
  if(deleted){
    const clientLabel = deleted.clientId ? clientDisplayName(state.clients.find(c=>c.id===deleted.clientId)||{}) : '—';
    moveToTrash(deleted.type==='Marché'?'marche':'devis', `${deleted.number||''} — ${clientLabel}`, deleted);
  }
  state.devis = state.devis.filter(d=>d.id!==id);
  persist('devis');
  if(state.devisAttachments[id]){ delete state.devisAttachments[id]; persist('devisAttachments'); }
  render();
  showToast('Devis déplacé dans la Corbeille.');
}

/* ============================= COMMISSIONS (saisie manuelle) ============================= */
const MOIS_LABELS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
function commissionKey(brandId, year, month){ return `${brandId}|${year}|${month}`; }
function getCommissionEntry(brandId, year, month){
  return state.commissions[commissionKey(brandId,year,month)] || {ca:0, commission:0, commentaire:''};
}
function setCommissionEntry(brandId, year, month, field, value){
  const key = commissionKey(brandId,year,month);
  const entry = Object.assign({ca:0, commission:0, commentaire:''}, state.commissions[key]||{});
  entry[field] = parseFloat(value)||0;
  state.commissions[key] = entry;
  persist('commissions');
}
function setCommissionComment(brandId, year, month, value){
  const key = commissionKey(brandId,year,month);
  const entry = Object.assign({ca:0, commission:0, commentaire:''}, state.commissions[key]||{});
  entry.commentaire = value;
  state.commissions[key] = entry;
  persist('commissions');
}
function commissionsAvailableYears(){
  const cur = new Date().getFullYear();
  const ys = new Set();
  Object.keys(state.commissions).forEach(k=>{ const y = parseInt(k.split('|')[1]); if(y) ys.add(y); });
  for(let y=cur-3; y<=cur+1; y++) ys.add(y);
  return Array.from(ys).sort((a,b)=>b-a);
}
function commissionsTotals(){
  if(state.brands.length===0) return {ca:0, commission:0};
  const year = ui.commissionsYear || 0;
  const month = year ? (ui.commissionsMonth||0) : 0;
  const brandsList = ui.commissionsBrand==='all' ? state.brands : state.brands.filter(b=>b.id===ui.commissionsBrand);

  if(year && month){
    const ca = brandsList.reduce((s,b)=>s+(getCommissionEntry(b.id, year, month).ca||0),0);
    const commission = brandsList.reduce((s,b)=>s+(getCommissionEntry(b.id, year, month).commission||0),0);
    return {ca, commission};
  }
  if(year){
    let ca=0, commission=0;
    brandsList.forEach(b=>{
      for(let m=1;m<=12;m++){ const e = getCommissionEntry(b.id, year, m); ca += e.ca||0; commission += e.commission||0; }
    });
    return {ca, commission};
  }
  let ca=0, commission=0;
  const brandIds = brandsList.map(b=>b.id);
  Object.keys(state.commissions).forEach(k=>{
    const [bid] = k.split('|');
    if(!brandIds.includes(bid)) return;
    const e = state.commissions[k];
    ca += e.ca||0; commission += e.commission||0;
  });
  return {ca, commission};
}
function commissionForBrandPeriod(brandId, year, month){
  // CA et commission tels que saisis manuellement dans l'onglet Commissions, pour une marque et une période (mois précis, ou année entière si mois=0)
  if(month){
    return getCommissionEntry(brandId, year, month);
  }
  let ca=0, commission=0;
  for(let m=1;m<=12;m++){ const e = getCommissionEntry(brandId, year, m); ca += e.ca||0; commission += e.commission||0; }
  return {ca, commission};
}
function commissionsBrandTotalForFilters(brandId){
  const year = ui.commissionsYear || 0;
  const month = year ? (ui.commissionsMonth||0) : 0;
  if(year) return commissionForBrandPeriod(brandId, year, month);
  let ca=0, commission=0;
  Object.keys(state.commissions).forEach(k=>{
    const [bid] = k.split('|');
    if(bid!==brandId) return;
    const e = state.commissions[k];
    ca += e.ca||0; commission += e.commission||0;
  });
  return {ca, commission};
}

    </span>

}
function commissionsSizeResize(which, delta){
  const order = ['sm','md','lg'];
  const key = which==='table' ? 'commissionsTableSize' : which==='top5ca' ? 'commissionsTop5CaSize' : 'commissionsTop5CommissionSize';
  const current = state.settings[key] || (which==='table'?'lg':'md');
  let idx = order.indexOf(current);
  idx = Math.max(0, Math.min(order.length-1, idx+delta));
  state.settings[key] = order[idx];
  persist('settings');
  render();
}
function updateCommissionsTableOnly(){
  const wrap = document.getElementById('commissionsTableCard');

    <div class="helper" style="margin-bottom:10px;">Vue cumulée sur toutes les années saisies. Sélectionnez une année pour modifier les montants.</div>
    ${renderCustomizableTable('commissionsAllYears', [

      {key:'marque', label:'Marque', defaultWidth:220, cell:r=>`<span class="chip" style="background:${brandColor(r.b.id)};"><span class="sq"></span>${escapeHtml(r.b.name)}</span>`},

    ], rows)}

function endOfMonth(d){
  return new Date(d.getFullYear(), d.getMonth()+1, 0);
}
function defaultValidUntil(type, dateStr){
  const base = new Date(dateStr || todayStr());
  let result;
  if(type==='Marché'){
    // Fin décembre de l'année en cours + le nombre d'années supplémentaires configuré (0 par défaut)
    const extraYears = state.settings.validiteMarcheAnneesSupp || 0;
    result = new Date(base.getFullYear()+extraYears, 11, 31);
  } else {
    // Devis : N mois (configurable, 2 par défaut), arrondi à la fin de ce mois
    const months = state.settings.validiteDevisMois!=null ? state.settings.validiteDevisMois : 2;
    const plusN = new Date(base.getFullYear(), base.getMonth()+months, base.getDate());
    result = endOfMonth(plusN);
  }
  return result.toISOString().slice(0,10);
}

function openImportDevisPdfPicker(){
  if(state.clients.length===0){ showToast('Ajoutez d\'abord un client.'); return; }
  if(typeof pdfjsLib==='undefined'){ showToast("La lecture de PDF n'a pas pu se charger — vérifiez votre connexion internet et réessayez."); return; }
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/pdf,.pdf';
  input.onchange = handleImportDevisPdfFile;
  input.click();
}
async function handleImportDevisPdfFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  showToast('Lecture du PDF en cours…');
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let lines = [];
    let page1RightText = '', page1LeftText = '';
    for(let p=1;p<=pdf.numPages;p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      groupPdfTextIntoLines(content.items).forEach(l=>{ l.page = p; lines.push(l); });
      if(p===1){
        // L'en-tête (fournisseur/marque à gauche, client à droite) forme deux blocs côte à côte à des
        // hauteurs souvent très proches : les lire comme une seule colonne mélange les deux. On extrait
        // donc séparément le texte de chaque moitié de la 1ère page.
        const viewport = page.getViewport({scale:1});
        page1RightText = groupPdfTextIntoLines(content.items.filter(it=>it.transform[4] > viewport.width*0.48)).map(l=>l.text).join('\n');
        page1LeftText = groupPdfTextIntoLines(content.items.filter(it=>it.transform[4] <= viewport.width*0.52)).map(l=>l.text).join('\n');
      }
    }
    if(lines.length===0){ showToast("Ce PDF ne contient pas de texte exploitable (peut-être une image scannée)."); return; }
    const parsed = parseComagentcoDevisPdf(lines, page1RightText, page1LeftText);
    openImportedDevisReview(parsed, file.name);
  }catch(e){
    console.error(e);
    showToast("Impossible de lire ce PDF : "+(e.message||String(e)));
  }
}
function groupPdfTextIntoLines(items){
  // Regroupe les fragments de texte d'une page PDF par ligne (coordonnée Y proche), triés de gauche à
  // droite sur chaque ligne, pour reconstituer un texte lisible à partir des positions brutes de PDF.js.
  // Un espace n'est inséré entre deux fragments que si un véritable espacement horizontal les sépare —
  // sinon PDF.js peut renvoyer un même mot ou une même référence en plusieurs fragments adjacents,
  // et forcer un espace entre chacun d'eux casserait des mots comme "REXEL" en "RE XEL".
  const rows = [];
  items.forEach(it=>{
    if(!it.str || !it.str.trim()) return;
    const y = Math.round(it.transform[5]);
    let row = rows.find(r=>Math.abs(r.y-y)<=2);
    if(!row){ row = {y, items:[]}; rows.push(row); }
    row.items.push({x:it.transform[4], str:it.str, width:it.width||0});
  });
  rows.sort((a,b)=>b.y-a.y); // une page PDF a l'origine en bas à gauche : Y décroissant = de haut en bas
  return rows.map(r=>{
    r.items.sort((a,b)=>a.x-b.x);
    let text = '';
    let prevEnd = null;
    r.items.forEach(it=>{
      if(prevEnd!=null && (it.x-prevEnd)>1.4) text += ' ';
      text += it.str;
      prevEnd = it.x + it.width;
    });
    const minX = r.items.length ? r.items[0].x : 0;
    return { y:r.y, minX, text: text.replace(/\s+/g,' ').trim() };
  }).filter(r=>r.text);
}
function parseLongFrenchDateToIso(text){
  const moisNoms = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const m = (text||'').toLowerCase().match(/(\d{1,2})\s*(?:er)?\s+(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+(\d{4})/);
  if(!m) return null;
  const day = parseInt(m[1],10);
  const month = moisNoms.indexOf(m[2])+1;
  const year = parseInt(m[3],10);
  if(!month) return null;
  return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function parseComagentcoDevisPdf(lines, page1RightText, page1LeftText){
  const fullText = lines.map(l=>l.text).join('\n');
  const stripSpaces = s=>String(s||'').replace(/\s+/g,'').toUpperCase();
  const result = { number:'', date:'', validUntil:'', objet:'', type:'Devis', clientId:'', linesGuess:[], warnings:[] };

  // N° du devis : on essaie d'abord le format habituel "INITIALES-numéro" (ex. YG-123) si vos initiales
  // de numérotation sont connues, plus fiable que la simple recherche du symbole "N°" (qui apparaît
  // aussi ailleurs sur le document : N° client, N° de TVA…).
  const initiales = (state.settings.initiales||'').trim();
  let m = null;
  if(initiales){
    m = fullText.match(new RegExp(initiales.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*-\\s*\\d+'));
    if(m) result.number = m[0].replace(/\s+/g,'');
  }
  if(!result.number){
    m = fullText.match(/N°\s*[:.]?\s*([A-Za-z0-9][A-Za-z0-9\-_\/]*)(?!\s*(?:client|tva|siret|siren))/i);
    if(m) result.number = m[1];
  }

  if(/MARCHÉ/i.test(fullText.slice(0,400)) && !/DEVIS/i.test(fullText.slice(0,120))) result.type = 'Marché';

  // Date d'émission : le premier "DD Mois AAAA" rencontré. La validité, elle, est parfois exprimée comme
  // une durée ("2 mois") plutôt qu'une date précise sur vos PDF — on ne tente donc pas de la déduire d'une
  // seconde date, ce qui donnait de faux résultats ; elle repart du calcul par défaut de l'application.
  const dateMatches = [...fullText.matchAll(/\d{1,2}\s*(?:er)?\s+(?:janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}/gi)];
  if(dateMatches[0]) result.date = parseLongFrenchDateToIso(dateMatches[0][0]);
  if(!result.date) result.warnings.push("Date du devis non détectée automatiquement — à vérifier.");

  // Objet : on s'arrête avant "Validité" si les deux se trouvent regroupés sur la même ligne reconstituée,
  // pour ne pas embarquer la validité de l'offre dans le texte de l'objet.
  m = fullText.match(/Objet\s*[:.]?\s*\n?(.+?)(?=\s*(?:Validité\b|\n|$))/i);
  if(m) result.objet = m[1].trim();

  // Société cliente : le bloc client se trouve en haut à DROITE de la 1ère page, à côté du bloc fournisseur
  // (à gauche) — les deux se mélangent si on lit toute la largeur de la page comme une seule colonne de
  // texte (ex. "REXEL ST JEAN DE LA" et "SONOPROF RUELLE" intercalés ligne à ligne). On cherche donc en
  // priorité dans le texte de la seule moitié droite de la page, avant d'essayer plus largement si besoin.
  let bestClient = null, bestLen = 0;
  const searchClientIn = (text)=>{
    const upper = text.toUpperCase();
    const flat = stripSpaces(text);
    state.clients.forEach(c=>{
      const label = (c.company||c.name||'').trim();
      if(label.length<=3) return;
      const matches = upper.includes(label.toUpperCase()) || flat.includes(stripSpaces(label));
      if(matches && label.length>bestLen){ bestLen = label.length; bestClient = c; }
    });
  };
  if(page1RightText) searchClientIn(page1RightText);
  if(!bestClient){
    const numeroLineIdx = lines.findIndex(l=>l.page===1 && /N°/.test(l.text));
    const headerLines = lines.filter((l,i)=> l.page===1 && (numeroLineIdx<0 || i<numeroLineIdx));
    searchClientIn((headerLines.length?headerLines:lines.filter(l=>l.page===1)).map(l=>l.text).join('\n'));
  }
  if(bestClient) result.clientId = bestClient.id;
  else result.warnings.push("Société cliente non identifiée automatiquement — sélectionnez-la manuellement.");

  // Marque du devis : le bloc "FABRICANT :" se trouve en haut à GAUCHE de la 1ère page — on y cherche la
  // marque en priorité (nom de la marque, ou son site internet qui contient souvent le même mot), avant
  // de chercher plus largement dans tout le document si rien n'y est trouvé.
  // Un devis ne concerne qu'un seul fournisseur (le bloc "FABRICANT :") : on ne retient donc qu'UNE seule
  // marque — la meilleure correspondance trouvée — plutôt qu'une liste, pour ne jamais mélanger les
  // catalogues de plusieurs marques différentes sur les lignes d'un même devis.
  const bestBrandMatch = (text)=>{
    const upper = text.toUpperCase();
    const flat = stripSpaces(text);
    let best = null, bestScore = 0;
    state.brands.forEach(b=>{
      if(!b.name) return;
      const nameUpper = b.name.toUpperCase();
      let score = 0;
      if(upper.includes(nameUpper) || flat.includes(stripSpaces(b.name))) score = 100 + b.name.length;
      else if(b.siteInternet && upper.includes(b.siteInternet.toUpperCase().replace(/^HTTPS?:\/\/(WWW\.)?/,''))) score = 60 + b.name.length;
      else {
        const firstWord = nameUpper.split(/\s+/)[0];
        if(firstWord.length>=4 && upper.includes(firstWord)) score = 20 + b.name.length;
      }
      if(score>bestScore){ bestScore = score; best = b; }
    });
    return best;
  };
  let matchedBrand = page1LeftText ? bestBrandMatch(page1LeftText) : null;
  if(!matchedBrand) matchedBrand = bestBrandMatch(fullText);
  if(!matchedBrand) result.warnings.push("Marque du devis non identifiée automatiquement — vérifiez la marque de chaque ligne.");
  const brandPool = matchedBrand ? [matchedBrand] : state.brands;
  const allRefs = [];
  brandPool.forEach(b=>{
    state.tarifs.filter(t=>t.brandId===b.id && t.reference).forEach(t=>allRefs.push({ref:t.reference, brandId:b.id, designation:t.designation, prixCatalogue:t.prixCatalogue}));
  });
  allRefs.sort((a,b)=>b.ref.length-a.ref.length); // références longues d'abord (évite qu'une référence courte n'en masque une plus précise)
  const defaultBrandId = matchedBrand ? matchedBrand.id : (state.brands[0] ? state.brands[0].id : '');

  // Zone du tableau des lignes : entre l'en-tête ("Désignation") et le récapitulatif ("Total HT"/"TVA").
  const tableStart = lines.findIndex(l=>/désignation/i.test(l.text));
  let tableEnd = lines.findIndex((l,i)=> tableStart>=0 && i>tableStart && /total.{0,12}ht\b/i.test(l.text));
  if(tableEnd<0) tableEnd = lines.length;
  const tableLines = tableStart>=0 ? lines.slice(tableStart+1, tableEnd) : lines;

  const usedRefs = new Set();
  let numbersRecovered = 0, horsCatalogue = 0;
  tableLines.forEach(line=>{
    const lineUpper = line.text.toUpperCase();
    const lineFlat = stripSpaces(line.text);
    const found = allRefs.find(r=>{
      if(usedRefs.has(r.ref)) return false;
      const refUpper = r.ref.toUpperCase();
      return lineUpper.includes(refUpper) || lineFlat.includes(stripSpaces(refUpper));
    });
    if(found){
      usedRefs.add(found.ref);
      const vals = extractPdfLineValues(line.text, found.ref);
      let prixUnitaire = found.prixCatalogue||0;
      if(vals.prixAchatUnitaire!=null){ prixUnitaire = +(vals.prixAchatUnitaire/((1-(vals.pctVals[0]||0)/100)*(1-(vals.pctVals[1]||0)/100)*(1-(vals.pctVals[2]||0)/100)||1)).toFixed(4); numbersRecovered++; }
      result.linesGuess.push({
        id: uid(), brandId: found.brandId, reference: found.ref, designation: found.designation||'',
        qty: vals.qty||1, prixUnitaire, remisePct1: vals.pctVals[0]||0, remisePct2: vals.pctVals[1]||0, remisePct3: vals.pctVals[2]||0, prixClient:0,
      });
      return;
    }
    // Référence non reconnue dans le catalogue : on crée quand même une ligne "hors catalogue" avec ce
    // qui a pu être lu, plutôt que de perdre silencieusement cette ligne du devis.
    if(/total.{0,12}ht\b/i.test(line.text)) return; // ligne de récapitulatif, pas une ligne produit
    if(!/\d[.,]\d{2}/.test(line.text)) return; // ne ressemble pas à une ligne de produit chiffrée : on l'ignore
    const firstTokenMatch = line.text.match(/^\s*(\S+)\s+(.*)$/);
    if(!firstTokenMatch) return;
    const refCandidate = firstTokenMatch[1];
    const rest = firstTokenMatch[2];
    const vals = extractPdfLineValues(rest, '');
    if(vals.moneyVals.length===0) return;
    result.linesGuess.push({
      id: uid(), brandId: defaultBrandId, reference: refCandidate, designation: rest.replace(/[\d\s,.%€]+$/,'').trim()||rest,
      qty: vals.qty||1, prixUnitaire: vals.prixAchatUnitaire!=null?vals.prixAchatUnitaire:(vals.moneyVals[0]||0),
      remisePct1: vals.pctVals[0]||0, remisePct2: vals.pctVals[1]||0, remisePct3: vals.pctVals[2]||0, prixClient:0,
      isFreeLine: true,
    });
    horsCatalogue++;
  });
  if(result.linesGuess.length===0){
    result.warnings.push("Aucune ligne de produit reconnue dans ce PDF — ajoutez les lignes manuellement.");
  } else {
    result.warnings.push(`${result.linesGuess.length} ligne(s) reconnue(s)${horsCatalogue?`, dont ${horsCatalogue} hors catalogue (référence non trouvée dans vos tarifs)`:''} — vérifiez quantités, prix et remises avant d'enregistrer (une lecture de texte reste approximative).`);
  }
  result.rawText = fullText;
  return result;
}
function parseFrenchNumber(raw){
  return parseFloat(String(raw).replace(/[\s\u00A0]/g,'').replace(',', '.'));
}
function extractPdfLineValues(text, reference){
  // Repère, dans le texte reconstitué d'une ligne, les montants et les pourcentages, puis une quantité
  // probable (le dernier nombre entier isolé situé juste avant le premier montant).
  // Les montants sont acceptés sous deux formats, selon la version de ComAgentCo qui a généré le PDF :
  // "474.99" (point, jamais séparé par des espaces, sans symbole) ou "1 474,99 €" (virgule, avec
  // regroupement des milliers par espace, symbole €). Les deux formats sont traités séparément : le
  // format à point n'autorise PAS d'espace interne, sinon un nombre isolé juste avant (ex. la quantité
  // "1" devant "474.99") serait avalé par erreur comme premier groupe de milliers du montant.
  const withoutRef = reference ? text.replace(reference, ' ') : text;
  const moneyRe = /\d+\.\d{2}(?!\d)|\d[\d\s\u00A0]*,\d{2}\s*(?:€|EUR)?/g;
  const pctRe = /(-?\d[\d\s\u00A0]*(?:[.,]\d{1,2})?)\s*%/g;
  const moneyMatches = [...withoutRef.matchAll(moneyRe)];
  const moneyVals = moneyMatches.map(mm=>parseFrenchNumber(mm[0])).filter(n=>!isNaN(n));
  const pctVals = [...withoutRef.matchAll(pctRe)].map(mm=>parseFrenchNumber(mm[1])).filter(n=>!isNaN(n));
  let qty = 1;
  // On s'arrête AVANT le début du premier montant (et non juste avant un éventuel symbole €), sinon les
  // chiffres du montant lui-même (ex. le "2" de "2 500,00 €", séparateur de milliers) seraient pris pour
  // la quantité.
  const firstMoneyStart = moneyMatches.length ? moneyMatches[0].index : withoutRef.length;
  const before = withoutRef.slice(0, firstMoneyStart);
  const intMatches = before.match(/\d{1,5}(?!\s*[.,%])/g);
  if(intMatches && intMatches.length){
    const last = parseInt(intMatches[intMatches.length-1], 10);
    if(!isNaN(last) && last>0 && last<100000) qty = last;
  }
  // Prix d'achat unitaire = colonne "PU Net HT" / "Prix d'achat HT" : c'est toujours la PREMIÈRE valeur
  // monétaire de la ligne (les colonnes suivantes, s'il y en a — remise, total — viennent après). On lit
  // cette valeur telle quelle plutôt que de la recalculer à partir du Total HT ÷ Quantité, pour éviter
  // tout écart dû aux arrondis d'affichage du PDF.
  const prixAchatUnitaire = moneyVals.length ? moneyVals[0] : null;
  return { qty, moneyVals, pctVals, prixAchatUnitaire };
}
function openImportedDevisReview(parsed, filename){
  draft = {
    id: uid(),
    number: parsed.number || previewNextDevisNumber(parsed.type||'Devis'),

    objet: parsed.objet||'',
    reference: '',
    clientId: parsed.clientId||'',
    date: parsed.date || todayStr(),
    validUntil: parsed.validUntil || defaultValidUntil(parsed.type||'Devis', parsed.date||todayStr()),
    validUntilAuto: !parsed.validUntil,
    status: 'Brouillon',
    etatAffaire: '',
    destinataire: '',
    apporteurAffaire: '',
    attentionA: '',
    tvaPct: 0,
    notes: `Importé depuis le fichier PDF "${filename}". Vérifiez les quantités, remises et prix de chaque ligne avant d'enregistrer.`,
    lines: parsed.linesGuess,
    pdfColumns: {...DEFAULT_PDF_COLUMNS},

function pickDevisAttachment(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,application/pdf';
  input.onchange = async (evt)=>{
    const file = evt.target.files[0];
    if(!file) return;
    const maxSize = backupDirHandle ? 15*1024*1024 : 3*1024*1024;
    if(file.size > maxSize){
      showToast(backupDirHandle
        ? "Ce fichier dépasse 15 Mo — préférez un fichier plus léger."
        : "Ce fichier dépasse 3 Mo — connectez un dossier de sauvegarde (Paramètres → Sauvegarde) pour joindre des fichiers plus lourds.");
      return;
    }
    try{
      const buf = await file.arrayBuffer();
      let binary = '';
      const bytes = new Uint8Array(buf);
      for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
      // Stockée séparément (state.devisAttachments), et non sur le devis lui-même : un PDF joint peut
      // peser plusieurs Mo, ce qui ferait échouer la sauvegarde de tous vos devis si elle y était incluse.
      state.devisAttachments[draft.id] = btoa(binary);
      persist('devisAttachments');
      draft.attachmentPdfName = file.name;
      refreshDevisModal();
      if(!backupDirHandle){
        setTimeout(()=>showToast("Pièce jointe enregistrée. Pour plus de fiabilité (surtout si vous en joignez plusieurs), connectez un dossier de sauvegarde dans Paramètres → Sauvegarde.", 6000), 300);
      }
    }catch(e){
      console.error(e);
      showToast("Impossible de joindre ce fichier : "+(e.message||String(e)));
    }
  };
  input.click();
}
function downloadDevisAttachment(){
  const b64 = state.devisAttachments[draft.id];
  if(!b64) return;
  const link = document.createElement('a');
  link.href = 'data:application/pdf;base64,'+b64;
  link.download = draft.attachmentPdfName || 'piece-jointe.pdf';
  link.click();
}
function viewDevisAttachment(){
  const b64 = state.devisAttachments[draft.id];
  if(!b64) return;
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

function devisFormKeydownHandler(e){
  if(!['F3','F4','F5','F6'].includes(e.key)) return;
  if(!document.getElementById('modalOverlay')) return;
  e.preventDefault();
  const active = document.activeElement;
  let ref = '';
  const tr = (active && active.closest) ? active.closest('tr[data-reference]') : null;
  if(tr) ref = tr.getAttribute('data-reference')||'';
  else if(active && active.id==='d_search') ref = active.value||'';
  ref = (ref||'').trim();
  if(!ref){ showToast('Placez le curseur sur une ligne du devis ou dans le champ de recherche de référence.'); return; }
  const scope = {F3:'client', F4:'departement', F5:'tous', F6:'famille'}[e.key];
  openPriceHistoryModal(ref, scope);
}

function priceHistoryRows(reference, scope){
  const refNorm = reference.trim().toLowerCase();
  const currentClient = draft.clientId ? state.clients.find(x=>x.id===draft.clientId) : null;
  if(scope!=='tous' && !currentClient) return {error:"Sélectionnez d'abord un client pour ce devis."};
  const currentDept = currentClient ? clientDepartement(currentClient) : null;
  if(scope==='departement' && !currentDept) return {error:"Ce client n'a pas de département identifiable (code postal manquant ou invalide)."};
  const rows = [];
  state.devis.forEach(d=>{
    const c = state.clients.find(x=>x.id===d.clientId);
    if(!c) return;
    if(scope==='client' && c.id!==currentClient.id) return;
    if(scope==='departement' && clientDepartement(c)!==currentDept) return;
    if(scope==='famille' && !(c.famille===currentClient.famille && c.sousFamille===currentClient.sousFamille)) return;
    (d.lines||[]).forEach(l=>{
      if((l.reference||'').trim().toLowerCase()!==refNorm) return;
      rows.push({
        date:d.date, number:d.number, status:d.status, clientName:clientDisplayName(c),
        qty:l.qty, prixUnitaire:l.prixUnitaire, prixAchat:lineDistribUnit(l), prixClient:l.prixClient
      });
    });
  });
  rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return {rows};
}

function refreshDevisLinePrices(){
  if(!draft.clientId){ showToast('Sélectionnez un client avant de réactualiser les prix.'); return; }
  if(draft.lines.length===0){ showToast('Aucune ligne à réactualiser.'); return; }
  let updated = 0, missing = 0;
  draft.lines.forEach(l=>{
    let t = l.tarifId ? state.tarifs.find(x=>x.id===l.tarifId) : null;
    if(!t) t = state.tarifs.find(x=>x.brandId===l.brandId && x.reference.toLowerCase()===l.reference.toLowerCase());
    if(!t){ missing++; return; }
    const pricing = computeLinePricing(t, draft.date);
    l.tarifId = t.id;
    if(!l.designation || !l.designation.trim()) l.designation = t.designation || '';
    Object.assign(l, pricing);
    updated++;
  });
  refreshDevisModal();
  let msg = `${updated} ligne(s) réactualisée(s) avec le tarif et la liste de prix nets en vigueur.`;
  if(missing>0) msg += ` ${missing} ligne(s) ignorée(s) (référence introuvable dans les tarifs actuels).`;
  showToast(msg, 4000);
}
function refreshDevisModal(){
  const box = document.getElementById('modalBox');
  if(!box) return;
  const scrollEl = box.querySelector('.modal-body');
  const scrollTop = scrollEl ? scrollEl.scrollTop : 0;
  box.innerHTML = devisFormHtml();
  const newScrollEl = box.querySelector('.modal-body');
  if(newScrollEl) newScrollEl.scrollTop = scrollTop;
}
function clientDisplayName(c){
  // La "société" du client : le champ Société s'il est renseigné, sinon le Nom (souvent utilisé comme raison sociale).
  return (c.company && c.company.trim()) ? c.company : c.name;
}
function clientPersonLabel(c){
  // Le contact principal rattaché à cette fiche société (premier de la liste "Personnes à contacter").
  return contactFullName(primaryContact(c));
}
function currentClientLabel(){
  const c = state.clients.find(x=>x.id===draft.clientId);
  if(!c) return '';
  return clientDisplayName(c);
}
function devisSearchClients(q){
  q = (q||'').trim().toLowerCase();
  const box = document.getElementById('d_clientResults');
  if(!box) return;
  const words = q.split(/\s+/).filter(Boolean);
  const results = state.clients.filter(c=>{
    if(words.length===0) return true;
    const hay = (clientDisplayName(c)+' '+(c.name||'')+' '+(c.company||'')+' '+(c.famille||'')+' '+(c.sousFamille||'')).toLowerCase();
    return words.every(w=>hay.includes(w));
  }).slice(0,20);
  if(results.length===0){ box.innerHTML = `<div class="autocomplete-list"><div class="autocomplete-item">Aucun résultat</div></div>`; return; }
  box.innerHTML = `<div class="autocomplete-list">${results.map(c=>`
    <div class="autocomplete-item" onmousedown="setDevisClient('${c.id}')">
      <span class="ref">${escapeHtml(clientDisplayName(c))}</span>
    </div>
  `).join('')}</div>`;
}
function setDevisClient(id){
  const prevId = draft.clientId;
  draft.clientId = id;
  if(prevId !== id){ draft.attentionA = ''; } // change de société : on repart d'un contact vide
  const c = state.clients.find(x=>x.id===id);
  if(c){
    const p = primaryContact(c);
    if(p) draft.attentionA = contactFullName(p);
  }
  refreshDevisModal();
}
function contactFullName(ct){
  if(!ct) return '';
  return [ct.civilite, ct.prenom, ct.nom].filter(Boolean).join(' ');
}
function devisSearchAttention(q){
  q = (q||'').trim().toLowerCase();
  const box = document.getElementById('d_attentionResults');
  if(!box) return;
  const c = state.clients.find(x=>x.id===draft.clientId);
  if(!c){ box.innerHTML = `<div class="autocomplete-list"><div class="autocomplete-item">Sélectionnez d'abord un client</div></div>`; return; }
  const contacts = c.contacts || [];
  if(contacts.length===0){ box.innerHTML = `<div class="autocomplete-list"><div class="autocomplete-item">Aucun contact enregistré pour ce client</div></div>`; return; }
  const results = contacts.filter(ct=>{
    const hay = (contactFullName(ct)+' '+(ct.fonction||'')).toLowerCase();
    return !q || hay.includes(q);
  });
  if(results.length===0){ box.innerHTML = `<div class="autocomplete-list"><div class="autocomplete-item">Aucun résultat</div></div>`; return; }
  box.innerHTML = `<div class="autocomplete-list">${results.map(ct=>`
    <div class="autocomplete-item" onmousedown="setDevisAttention('${ct.id}')">
      <span class="ref">${escapeHtml(contactFullName(ct))}</span>
      ${ct.fonction?`<div class="desig">${escapeHtml(ct.fonction)}</div>`:''}
    </div>
  `).join('')}</div>`;
}
function setDevisAttention(contactId){
  const c = state.clients.find(x=>x.id===draft.clientId);
  const ct = c && (c.contacts||[]).find(x=>x.id===contactId);
  draft.attentionA = ct ? contactFullName(ct) : '';
  refreshDevisModal();
}

function checkFreeProductMention(line){
  // Signale automatiquement dans la désignation qu'un produit est à 0 € (geste commercial), quelle que
  // soit la façon dont on y arrive : prix d'achat saisi à 0, ou remise(s) ramenant le prix à 0.
  const mention = 'Produit gratuit - Geste commercial';
  if(Math.abs(lineDistribUnit(line))<0.005){
    const plainDesig = stripHtml(line.designation||'');
    if(!plainDesig.toLowerCase().includes(mention.toLowerCase())){
      line.designation = (line.designation||'') + (plainDesig.trim()?' — ':'') + `<b>${escapeHtml(mention)}</b>`;
    }
  }
}
function devisLineSetDistrib(i, val){
  const parsed = parseFloat(val);
  const line = draft.lines[i];
  const puTarif = line.prixUnitaire||0;
  if(!isNaN(parsed) && puTarif>0){
    // La Remise 1 est recalculée pour que le Prix d'achat HT retombe exactement sur la valeur saisie,
    // par rapport au PU Tarif (Remise 2 et Remise 3 restent inchangées).
    const f2 = 1 - ((line.remisePct2||0)/100);
    const f3 = 1 - ((line.remisePct3||0)/100);
    const denom = puTarif * f2 * f3;
    if(denom>0){
      let r1 = (1 - (parsed/denom)) * 100;
      if(r1<0) r1 = 0;
      if(r1>100) r1 = 100;
      // Arrondi à 8 décimales (et non 2) : avec un PU Tarif élevé, une forte remise et une grande
      // quantité, arrondir la remise à seulement quelques décimales décale le prix d'achat obtenu de
      // quelques centimes — et cet écart, multiplié par la quantité, devient visible sur le Total HT.
      line.remisePct1 = +r1.toFixed(8);
    }
    line.distribOverride = null;
    line.distribManuallySet = true;
  } else {
    // PU Tarif à 0 (ou valeur non exploitable) : impossible de déduire une remise, on fige le prix tel quel.
    line.distribOverride = isNaN(parsed) ? null : parsed;
    line.distribManuallySet = !isNaN(parsed);
  }
  line.margeTarget = null;
  if(line.prixNetTarget==='distri'){ line.prixNetTarget = null; line.netPriceOverride = null; }
  checkFreeProductMention(line);
  refreshDevisModal();
}
function devisLineSetClient(i, val){
  draft.lines[i].prixClient = parseFloat(val)||0;
  draft.lines[i].margeTarget = null;
  if(draft.lines[i].prixNetTarget==='client') draft.lines[i].prixNetTarget = null;
  refreshDevisModal();
}
function devisLineSetMarge(i, val){
  const marge = parseFloat(val);
  const distrib = lineDistribUnit(draft.lines[i]);
  if(!isNaN(marge) && distrib>0 && marge<100){
    draft.lines[i].prixClient = +(distrib/(1-marge/100)).toFixed(2);
    draft.lines[i].margeTarget = marge;
  } else {
    draft.lines[i].margeTarget = null;
  }
  if(draft.lines[i].prixNetTarget==='client') draft.lines[i].prixNetTarget = null;
  refreshDevisModal();
}
function applyUniformRemises(){
  const r1 = parseFloat(document.getElementById('d_uRemise1').value)||0;
  const r2 = parseFloat(document.getElementById('d_uRemise2').value)||0;
  const r3 = parseFloat(document.getElementById('d_uRemise3').value)||0;
  draft.uniformRemise1 = r1; draft.uniformRemise2 = r2; draft.uniformRemise3 = r3;
  if(draft.lines.length===0){ showToast('Ajoutez d\'abord des lignes au devis.'); return; }
  let applied=0, skipped=0;
  draft.lines.forEach(l=>{
    if(l.prixNetApplied){ skipped++; return; } // prix net client : on n'y touche pas
    l.remisePct1 = r1; l.remisePct2 = r2; l.remisePct3 = r3;
    l.margeTarget = null; // le coût change, une marge cible précédemment fixée n'est plus garantie
    l.distribOverride = null; // la remise uniforme reprend la main sur un prix d'achat modifié manuellement
    applied++;
  });
  refreshDevisModal();
  if(skipped>0) showToast(`Remises appliquées à ${applied} ligne(s) — ${skipped} ligne(s) avec un prix net client conservée(s) telle(s) quelle(s).`);
  else showToast(`Remises appliquées à ${applied} ligne(s) — ajustables ligne par ligne si besoin.`);
}
function applyUniformMarge(){
  const marge = parseFloat(document.getElementById('d_uMarge').value);
  if(isNaN(marge)){ showToast('Indiquez une marge cible.'); return; }
  draft.uniformMarge = marge;
  if(draft.lines.length===0){ showToast('Ajoutez d\'abord des lignes au devis.'); return; }
  let applied=0, impossible=0;
  draft.lines.forEach(l=>{
    const distrib = lineDistribUnit(l);
    if(distrib>0 && marge<100){
      l.prixClient = +(distrib/(1-marge/100)).toFixed(2);
      l.margeTarget = marge;
      if(l.prixNetTarget==='client') l.prixNetTarget = null; // la marge saisie prime désormais sur le prix net pour cette ligne
      applied++;
    } else {
      impossible++;
    }
  });
  refreshDevisModal();
  if(impossible>0) showToast(`Marge appliquée à ${applied}/${draft.lines.length} ligne(s) — les lignes sans Prix d'achat HT n'ont pas pu être calculées.`);
  else showToast(`Marge de ${marge}% appliquée à ${applied} ligne(s) — ajustable ligne par ligne si besoin.`);
}

function brandIdsMatchingName(brandId){

  const ref = state.brands.find(b=>b.id===brandId);

function devisSearchRefsRun(q){

  const box = document.getElementById('d_searchResults');
  if(!box) return;
  if(!q){ box.innerHTML=''; return; }
  let pool = state.tarifs;
  let noBrandMatch = false;
  if(draft.filterBrandId){
    const matchingIds = brandIdsMatchingName(draft.filterBrandId);
    const filtered = pool.filter(t=>matchingIds.includes(t.brandId));
    // Si le filtre marque ne renvoie rien du tout, on retente sans filtre pour distinguer
    // "aucun résultat" de "résultat existant mais rattaché à une autre fiche marque".
    const wouldMatchWithoutFilter = pool.some(t=>tarifMatchesQuery(t, q, qNorm));
    if(filtered.filter(t=>tarifMatchesQuery(t, q, qNorm)).length===0 && wouldMatchWithoutFilter) noBrandMatch = true;
    pool = filtered;
  }
  const results = pool.filter(t=>tarifMatchesQuery(t, q, qNorm)).slice(0,20);
  if(results.length===0){
    const brandNote = draft.filterBrandId ? ` (filtré sur ${escapeHtml(brandName(draft.filterBrandId))})` : '';

function findClientNetPriceEntry(clientId, brandId, reference, dateStr){

  if(!c) return null;
  const listeIds = c.netPriceListeIds || [];
  if(listeIds.length===0) return null;
  const liste = state.prixNetListes.find(l=>l.brandId===brandId && listeIds.includes(l.id));
  if(!liste) return null;
  if(dateStr && !listeIsValidOnDate(liste, dateStr)) return null;
  return state.listesPrixNets.find(t=>t.listeId===liste.id && t.reference.toLowerCase()===reference.toLowerCase()) || null;
}
function listeValidityStatus(l, dateStr){

  if(l.dateValidite && d > l.dateValidite) return 'expired';

}

function clientRemiseRules(c){
  if(c.remisesTarif && c.remisesTarif.length) return c.remisesTarif;
  // Compatibilité avec l'ancien format (une seule remise globale par client, sans marque/famille)
  if(c.remise1||c.remise2||c.remise3) return [{id:'legacy', brandId:'', familleArticle:'', remise1:c.remise1||0, remise2:c.remise2||0, remise3:c.remise3||0}];
  return [];
}
function findClientRemiseRule(clientId, brandId, familleArticle){
  const c = state.clients.find(x=>x.id===clientId);
  if(!c) return null;
  const rules = clientRemiseRules(c);
  const fam = (familleArticle||'').toLowerCase();
  // Priorité : marque + famille > marque seule > famille seule > règle globale
  let best = null, bestScore = -1;
  rules.forEach(r=>{
    const brandMatch = !r.brandId || r.brandId===brandId;
    const famMatch = !r.familleArticle || r.familleArticle.toLowerCase()===fam;
    if(!brandMatch || !famMatch) return;
    let score = (r.brandId?2:0) + (r.familleArticle?1:0);
    if(score>bestScore){ bestScore = score; best = r; }
  });
  return best;
}
function computeLinePricing(t, dateStr){
  const netEntry = findClientNetPriceEntry(draft.clientId, t.brandId, t.reference, dateStr);
  if(!netEntry){

    // on le signale (au lieu de laisser croire silencieusement qu'aucune liste n'existe).
    const c = state.clients.find(x=>x.id===draft.clientId);
    const listeIds = c ? (c.netPriceListeIds||[]) : [];
    const liste = state.prixNetListes.find(l=>l.brandId===t.brandId && listeIds.includes(l.id));
    if(liste && !listeIsValidOnDate(liste, dateStr)){
      const status = listeValidityStatus(liste, dateStr);
      showToast(status==='future'
        ? `La liste de prix nets "${liste.nom}" n'est active qu'à partir du ${fmtDate(liste.dateApplication)} — tarif standard appliqué.`
        : `La liste de prix nets "${liste.nom}" n'est plus valide depuis le ${fmtDate(liste.dateValidite)} — tarif standard appliqué.`, 4500);
    }
  }
  const puTarif = t.prixCatalogue||t.prixHT||0;
  let remise1 = 0, remise2 = 0, remise3 = 0, prixClient, prixNetTarget = null, netPriceOverride = null;
  if(netEntry){
    // Que la société associée au devis/marché soit de famille Grossiste ou Installateur,
    // le prix net de sa liste de prix nets s'affiche toujours dans la colonne Prix d'achat HT.
    const netPrice = netEntry.prixNet||0;
    // Remise 1 affichée à titre indicatif ; le PU Distributeur retenu pour les calculs reste le
    // prix net exact (netPriceOverride), pour éviter tout écart d'arrondi lié au % affiché.
    if(puTarif>0){
      remise1 = +((1 - (netPrice/puTarif)) * 100).toFixed(2);
      if(remise1<0) remise1 = 0;
    }
    // Prix de vente conseillé et marge laissés à 0 par défaut : à renseigner manuellement par ligne.
    prixClient = 0;
    prixNetTarget = 'distri';
    netPriceOverride = netPrice;
  } else {
    // Pas de liste de prix nets pour cette référence : on applique la règle de remise tarif du
    // client la plus spécifique (marque + famille > marque > famille > règle globale), si définie.
    const rule = findClientRemiseRule(draft.clientId, t.brandId, t.codeFamilleArticle);
    if(rule && (rule.remise1||rule.remise2||rule.remise3)){
      remise1 = rule.remise1||0;
      remise2 = rule.remise2||0;
      remise3 = rule.remise3||0;
    } else {
      const distribRef = t.prixAchatDistributeur||0;
      if(puTarif>0 && distribRef){
        remise1 = +((1 - (distribRef/puTarif)) * 100).toFixed(2);
        if(remise1<0) remise1 = 0;
      }
    }
    // Prix de vente conseillé et marge laissés à 0 par défaut : à renseigner manuellement par ligne.
    prixClient = 0;
  }
  return {
    prixUnitaire: puTarif,
    remisePct1: remise1, remisePct2: remise2, remisePct3: remise3,
    prixClient, prixNetApplied: !!netEntry, prixNetTarget, netPriceOverride,
  };
}
function addDevisLine(tarifId){
  const t = state.tarifs.find(x=>x.id===tarifId);
  if(!t) return;
  const pricing = computeLinePricing(t, draft.date);
  const mainLineId = uid();
  draft.lines.push({
    id:mainLineId, tarifId:t.id, brandId:t.brandId, reference:t.reference, designation:t.designation,
    qty:1, complementInfo:t.complementInfo||'', ficheTechniqueUrl:t.ficheTechniqueUrl||'', noticeUrl:t.noticeUrl||'', photoUrl:t.photoUrl||'', ...pricing,
  });
  // Éco-participation : si le tarif en porte une, on ajoute automatiquement une ligne dédiée juste en
  // dessous, avec la même quantité que la référence concernée — les deux lignes restent liées ensuite :
  // modifier la quantité de la référence met à jour celle de l'éco-participation automatiquement.
  if(t.ecopart && t.ecopart>0){
    const ecoLineId = uid();
    draft.lines.push({
      id:ecoLineId, brandId:t.brandId, reference:'ECO-PART', designation:'Éco-participation',
      qty:1, prixUnitaire:t.ecopart, remisePct1:0, remisePct2:0, remisePct3:0, prixClient:0,
      isEcoPart:true, linkedToLineId:mainLineId,
    });
    draft.lines.find(l=>l.id===mainLineId).ecoPartLineId = ecoLineId;
  }
  document.getElementById('d_search').value='';
  document.getElementById('d_searchResults').innerHTML='';
  refreshDevisModal();
}
function devisLineSetQty(i, val){
  const line = draft.lines[i];
  line.qty = parseFloat(val)||0;
  // Répercute la quantité sur la ligne d'éco-participation liée, le cas échéant.
  if(line.ecoPartLineId){
    const eco = draft.lines.find(l=>l.id===line.ecoPartLineId);
    if(eco) eco.qty = line.qty;
  }
  refreshDevisModal();
}
function removeDevisLine(i){
  const line = draft.lines[i];
  // Supprime aussi la ligne d'éco-participation liée (ou détache le lien si c'est elle qu'on supprime).
  if(line.ecoPartLineId){
    const ecoIdx = draft.lines.findIndex(l=>l.id===line.ecoPartLineId);
    if(ecoIdx>=0) draft.lines.splice(ecoIdx,1);
  } else if(line.linkedToLineId){
    const parent = draft.lines.find(l=>l.id===line.linkedToLineId);
    if(parent) parent.ecoPartLineId = null;
  }
  const idx = draft.lines.indexOf(line);
  if(idx>=0) draft.lines.splice(idx,1);
  refreshDevisModal();
}
function devisBrandsOverlap(d1, d2){
  const b1 = new Set((d1.lines||[]).map(l=>l.brandId).filter(Boolean));
  const b2 = new Set((d2.lines||[]).map(l=>l.brandId).filter(Boolean));
  if(b1.size===0 || b2.size===0) return true; // pas assez d'info pour distinguer -> on préfère prévenir
  for(const id of b1){ if(b2.has(id)) return true; }
  return false;
}
let devisSaveThenAction = null; // callback exécuté juste après la sauvegarde effective (Aperçu, PDF, Envoi…), une fois le choix de version tranché
let devisSaveKeepOpen = false;
let draftSavedSnapshot = '';

function saveDraftDevisTemplate(){
  if(draft.lines.length===0){ showToast('Ajoutez au moins une ligne au modèle.'); return; }
  if(!draft.templateName || !draft.templateName.trim()){ showToast('Donnez un nom à ce modèle.'); return; }
  const toSave = {...draft};
  delete toSave.isNew;

function saveDraftDevis(thenAction, keepOpen){
  if(draft.isTemplate){ saveDraftDevisTemplate(); return; }
  if(!draft.clientId){ showToast('Sélectionnez un client.'); return; }
  if(draft.lines.length===0){ showToast('Ajoutez au moins une ligne au devis.'); return; }
  // Si rien n'a changé depuis le dernier enregistrement, inutile de ressauvegarder (et donc inutile de
  // redemander "même numéro ou nouvelle version") : on exécute directement l'action demandée.
  if(!draft.isNew && JSON.stringify(draft)===draftSavedSnapshot){
    if(thenAction) thenAction(draft.id);
    else showToast('Aucune modification à enregistrer.');
    return;
  }
  devisSaveThenAction = thenAction || null;
  devisSaveKeepOpen = !!keepOpen;
  const isNewDoc = !!draft.isNew;
  if(isNewDoc){
    if(!draft.numberEditedManually){
      draft.number = consumeNextDevisNumber(draft.type);
    } else if(state.devis.some(d=>d.number===draft.number && devisBrandsOverlap(d, draft))){
      showToast(`⚠ Le numéro "${draft.number}" est déjà utilisé par un autre devis de la même marque — vérifiez-le si besoin (l'enregistrement continue quand même).`, 5500);
    }
    finalizeSaveDraftDevis(false, devisSaveKeepOpen);
    return;
  }
  if(draft.numberEditedManually && state.devis.some(d=>d.number===draft.number && d.id!==draft.id && devisBrandsOverlap(d, draft))){
    showToast(`⚠ Le numéro "${draft.number}" est déjà utilisé par un autre devis de la même marque — vérifiez-le si besoin (l'enregistrement continue quand même).`, 5500);
  }
  // Devis déjà enregistré : on demande d'abord si on écrase la version existante ou si on crée une nouvelle version numérotée.
  openDevisVersionChoiceModal();
}
function finalizeSaveDraftDevis(skipAutoLog, keepOpen){
  const idx = state.devis.findIndex(d=>d.id===draft.id);
  const toSave = {...draft}; delete toSave.isNew;
  toSave.history = Array.isArray(toSave.history) ? toSave.history.slice() : [];
  const dupFromId = toSave._duplicatedFromId;
  const dupFromNumber = toSave._duplicatedFromNumber;
  delete toSave._duplicatedFromId;
  delete toSave._duplicatedFromNumber;
  if(dupFromId) toSave.duplicatedFromId = dupFromId; // conservé (hors historique) pour pouvoir retrouver l'original si ce duplicata est supprimé plus tard
  if(!skipAutoLog){
    if(idx>=0){
      const changes = diffDevisForHistory(state.devis[idx], toSave);
      toSave.history.push({ ts: new Date().toISOString(), type:'modified', changes });
    } else if(dupFromId || dupFromNumber){
      const ts = new Date().toISOString();
      const clientLabel = toSave.clientId ? clientDisplayName(state.clients.find(c=>c.id===toSave.clientId)||{}) : '—';
      toSave.history.push({ ts, type:'duplicated_from', detail:dupFromNumber||'', clientLabel });
      const origIdx = state.devis.findIndex(d=>d.id===dupFromId);
      if(origIdx>=0){
        const orig = state.devis[origIdx];
        orig.history = Array.isArray(orig.history) ? orig.history.slice() : [];
        orig.history.push({ ts, type:'duplicated_to', detail:toSave.number, clientLabel });
      }
    } else {
      toSave.history.push({ ts: new Date().toISOString(), type:'created' });
    }
  }
  if(idx>=0) state.devis[idx] = toSave; else state.devis.push(toSave);
  persist('devis');
  if(keepOpen){
    draft.isNew = false;
    draft.history = toSave.history;
    draft._duplicatedFromId = undefined;
    draft._duplicatedFromNumber = undefined;
    draftSavedSnapshot = JSON.stringify(draft);
    render();
    refreshDevisModal();
    showToast('Devis enregistré.');
  } else {
    draftSavedSnapshot = JSON.stringify(draft);
    closeModal();
    render();
    showToast('Devis enregistré.');
  }
  if(devisSaveThenAction){ const fn = devisSaveThenAction; devisSaveThenAction = null; fn(toSave.id); }
}
function parseDevisVersion(number){
  const m = /^(.*)\/(\d+)$/.exec(number||'');
  if(m) return {base:m[1], version:parseInt(m[2],10)};
  return {base:number||'', version:1};
}
function nextDevisVersionNumber(number){
  const {base} = parseDevisVersion(number);
  let maxVersion = 1;
  state.devis.forEach(d=>{
    const p = parseDevisVersion(d.number);
    if(p.base===base && p.version>maxVersion) maxVersion = p.version;
  });
  return `${base}/${String(maxVersion+1).padStart(3,'0')}`;
}
function devisHistoryEntryLabel(entry){
  switch(entry.type){
    case 'created': return entry.detail ? `Création (${escapeHtml(entry.detail)})` : 'Création du devis';
    case 'modified': {
      if(entry.changes && entry.changes.length){
        return `Modification enregistrée :<ul style="margin:4px 0 0 16px;padding:0;">${entry.changes.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul>`;
      }
      return 'Modification enregistrée (aucun changement de contenu détecté)';
    }
    case 'duplicated_to': return `Dupliqué vers la nouvelle version <strong>${escapeHtml(entry.detail||'')}</strong>${entry.clientLabel?` — pour <strong>${escapeHtml(entry.clientLabel)}</strong>`:''}`;
    case 'duplicated_from': return `Créé par duplication depuis <strong>${escapeHtml(entry.detail||'')}</strong>${entry.clientLabel?` — pour <strong>${escapeHtml(entry.clientLabel)}</strong>`:''}`;
    case 'duplicate_deleted': return `Le duplicata <strong>${escapeHtml(entry.detail||'')}</strong>${entry.clientLabel?` (pour <strong>${escapeHtml(entry.clientLabel)}</strong>)`:''} a été supprimé`;
    default: return escapeHtml(entry.type||'—');
  }
}
function diffDevisForHistory(oldD, newD){
  const changes = [];
  const simpleFields = [
    {key:'clientId', label:'Client', fmt:(v)=> v ? clientDisplayName(state.clients.find(c=>c.id===v)||{}) : '—'},
    {key:'date', label:'Date', fmt:(v)=>v?fmtDate(v):'—'},
    {key:'validUntil', label:'Validité', fmt:(v)=>v?fmtDate(v):'—'},
    {key:'objet', label:'Objet', fmt:(v)=>v||'—'},
    {key:'status', label:'Statut', fmt:(v)=>v||'—'},
    {key:'destinataire', label:'Destinataire', fmt:(v)=>v||'Non précisé'},
    {key:'notes', label:'Notes', fmt:(v)=>v?'« '+v+' »':'—'},
    {key:'attentionA', label:"À l'attention de", fmt:(v)=>v||'—'},
  ];
  simpleFields.forEach(f=>{
    const ov = oldD[f.key]||'', nv = newD[f.key]||'';
    if(ov!==nv) changes.push(`${f.label} : ${f.fmt(oldD[f.key])} → ${f.fmt(newD[f.key])}`);
  });

  const oldLines = oldD.lines||[], newLines = newD.lines||[];
  const oldById = {}; oldLines.forEach(l=>{ oldById[l.id]=l; });
  const newById = {}; newLines.forEach(l=>{ newById[l.id]=l; });

  newLines.forEach(nl=>{
    const ol = oldById[nl.id];
    if(!ol){ changes.push(`Ligne ajoutée : ${nl.reference} (qté ${nl.qty})`); return; }
    const d = [];
    if((ol.qty||0)!==(nl.qty||0)) d.push(`qté ${ol.qty||0} → ${nl.qty||0}`);
    if((ol.prixUnitaire||0)!==(nl.prixUnitaire||0)) d.push(`PU Tarif ${fmtMoney(ol.prixUnitaire||0)} → ${fmtMoney(nl.prixUnitaire||0)}`);
    if((ol.prixClient||0)!==(nl.prixClient||0)) d.push(`PU Client ${fmtMoney(ol.prixClient||0)} → ${fmtMoney(nl.prixClient||0)}`);
    if((ol.remisePct1||0)!==(nl.remisePct1||0)) d.push(`Remise 1 ${ol.remisePct1||0}% → ${nl.remisePct1||0}%`);
    if((ol.remisePct2||0)!==(nl.remisePct2||0)) d.push(`Remise 2 ${ol.remisePct2||0}% → ${nl.remisePct2||0}%`);
    if((ol.remisePct3||0)!==(nl.remisePct3||0)) d.push(`Remise 3 ${ol.remisePct3||0}% → ${nl.remisePct3||0}%`);
    if((ol.designation||'')!==(nl.designation||'')) d.push('désignation modifiée');
    if(ol.reference!==nl.reference) d.push(`référence ${ol.reference} → ${nl.reference}`);
    if(d.length>0) changes.push(`Ligne ${nl.reference} : ${d.join(', ')}`);
  });
  oldLines.forEach(ol=>{
    if(!newById[ol.id]) changes.push(`Ligne supprimée : ${ol.reference}`);
  });

  return changes;
}
function openDevisHistoryModal(){
  const base = parseDevisVersion(draft.number).base;
  const versions = state.devis
    .filter(d=>parseDevisVersion(d.number).base===base)
    .slice()
    .sort((a,b)=>parseDevisVersion(a.number).version - parseDevisVersion(b.number).version);
  const rows = versions.map(d=>{
    const isCurrent = d.id===draft.id;
    const c = state.clients.find(x=>x.id===d.clientId);
    return `<tr style="${isCurrent?'background:var(--surface-2);':''}">
      <td style="font-weight:${isCurrent?'700':'600'};">${escapeHtml(d.number)}${isCurrent?' <span class="helper">(ouvert actuellement)</span>':''}</td>

    </tr>`;
  }).join('');

  // Journal chronologique : toutes les sauvegardes (même numéro conservé) et duplications, tous numéros confondus, avec date et heure exactes.
  const timeline = [];
  versions.forEach(d=>{
    (d.history||[]).forEach(h=>timeline.push({...h, number:d.number}));
  });
  timeline.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  const timelineHtml = timeline.length===0 ? `<div class="helper">Aucun journal détaillé disponible pour ce devis (créé avant l'activation de cette fonctionnalité).</div>` : `
    <div class="table-wrap"><table>
      <thead><tr><th style="width:180px;">Date et heure</th><th style="width:110px;">Version</th><th>Évènement</th></tr></thead>
      <tbody>
        ${timeline.map(h=>`<tr>
          <td>${fmtDateTime(h.ts)}</td>
          <td style="font-weight:600;">${escapeHtml(h.number)}</td>
          <td>${devisHistoryEntryLabel(h)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;

  openModal(`
    <div class="modal-head"><h3>Historique du devis ${escapeHtml(base)}</h3><button class="close-x" onclick="refreshDevisModal()">✕</button></div>
    <div class="modal-body">
      <div class="section-title">Versions</div>
      <div class="helper" style="margin-bottom:14px;">${versions.length} version${versions.length>1?'s':''} enregistrée${versions.length>1?'s':''} pour ce document${versions.length>1?' — la plus récente est celle à privilégier pour l\'envoi au client':''}.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Numéro</th><th>Date</th><th>Client</th><th>Statut</th><th>Total HT</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>

      <div class="section-title" style="margin-top:22px;">Journal des modifications <span class="helper" style="display:inline;">(date et heure exactes, y compris quand le même numéro est conservé)</span></div>
      ${timelineHtml}
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="refreshDevisModal()">Fermer — revenir au devis</button>
    </div>
  `);
}

function confirmSaveDevisNewVersion(){
  const originalId = draft.id;
  const originalNumber = draft.number;
  const ts = new Date().toISOString();
  const newNumber = nextDevisVersionNumber(draft.number);
  const clientLabel = draft.clientId ? clientDisplayName(state.clients.find(c=>c.id===draft.clientId)||{}) : '—';
  // Trace la duplication sur le devis d'origine, qui reste inchangé par ailleurs.
  const originalIdx = state.devis.findIndex(d=>d.id===originalId);
  if(originalIdx>=0){
    const orig = state.devis[originalIdx];
    orig.history = Array.isArray(orig.history) ? orig.history.slice() : [];
    orig.history.push({ ts, type:'duplicated_to', detail:newNumber, clientLabel });
    persist('devis');
  }
  draft.id = uid();
  draft.number = newNumber;
  draft.status = 'Brouillon';
  draft.etatAffaire = '';
  draft.duplicatedFromId = originalId;
  draft.history = [{ ts, type:'duplicated_from', detail:originalNumber, clientLabel }];
  finalizeSaveDraftDevis(true);
}

function getImageNaturalSize(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=> resolve({w:img.naturalWidth||1, h:img.naturalHeight||1});
    img.onerror = ()=> resolve(null);
    img.src = dataUrl;
  });
}
function fmtDateLong(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  const s = dt.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  return s.replace(/\p{L}+/gu, w=>w.charAt(0).toUpperCase()+w.slice(1));
}
function pdfUnderlineCentered(doc, text, centerX, y){
  doc.text(text, centerX, y, {align:'center'});
  const w = doc.getTextWidth(text);

  doc.line(centerX-w/2, y+0.8, centerX+w/2, y+0.8);
}
function pdfUnderline(doc, text, x, y){
  doc.text(text, x, y);
  const w = doc.getTextWidth(text);
  doc.setLineWidth(0.2);

function pdfDoubleVLine(doc, x, y0, y1){
