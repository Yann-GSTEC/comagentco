<body>
<div id="app"></div>
<script>
/* ============================= DONNEES & ETAT ============================= */
const BRAND_COLORS = ['#2F5D50','#B8863B','#3E6FA6','#AF4B3D','#7A5C8A','#3F8A7B','#C08A34','#5C7A3E','#9C5B76','#4E6B9C','#A66B3E','#4C8A6B','#6B5C9C','#8A6B3E'];

const STATUTS = ['Brouillon','Envoyé'];
function etatAffaireOutcome(d){
  const val = (d.etatAffaire||'').trim().toLowerCase();
  if(val){
    const item = (state.paramLists.etatAffaires||[]).find(e=>(e.libelle||'').trim().toLowerCase()===val);
    if(item && item.outcome) return item.outcome;
    // Filet de sécurité supplémentaire : correspondance approximative sur le texte lui-même, au cas où
    // la liste de référence "État des affaires" aurait été renommée, dupliquée ou modifiée depuis la
    // saisie du devis (l'État de l'affaire ne retrouve alors plus d'élément correspondant exact).
    if(/gagn|accept|valid|command/.test(val)) return 'gagnee';
    if(/perd|refus|annul/.test(val)) return 'perdue';
  }
  // Filet de sécurité : si l'État de l'affaire n'est pas (ou plus) reconnu dans la liste de référence
  // (ex. liste modifiée depuis), on se base directement sur l'ancien statut "Accepté"/"Refusé" conservé
  // lors de la migration — pour ne jamais perdre de CA déjà comptabilisé.
  if(d._legacyStatus==='Accepté') return 'gagnee';
  if(d._legacyStatus==='Refusé') return 'perdue';
  return 'encours';
}
function isDevisWon(d){ return etatAffaireOutcome(d)==='gagnee'; }
function isDevisLost(d){ return etatAffaireOutcome(d)==='perdue'; }
function etatAffaireColor(outcome){
  if(outcome==='gagnee') return {bg:'#E3F1E9', fg:'var(--success)'};
  if(outcome==='perdue') return {bg:'#F7E7E4', fg:'var(--danger)'};
  return {bg:'#EDEBE2', fg:'#6B6552'};
}
function defaultEtatAffaireEnCours(){
  const item = (state.paramLists.etatAffaires||[]).find(e=>(e.outcome||'encours')==='encours');
  return item ? item.libelle : 'En cours';
}
function runEtatAffaireMigration(showFeedback){
  let migrated = 0;
  try{
    const gagnee = (state.paramLists.etatAffaires||[]).find(e=>(e.outcome||'')==='gagnee');
    const perdue = (state.paramLists.etatAffaires||[]).find(e=>(e.outcome||'')==='perdue');
    (state.devis||[]).forEach(d=>{
      if(d.status==='Accepté'){
        d._legacyStatus = 'Accepté'; // filet de sécurité, conservé même si l'État de l'affaire n'est pas reconnu
        if(!d.etatAffaire && gagnee) d.etatAffaire = gagnee.libelle;
        d.status = 'Envoyé';
        migrated++;
      } else if(d.status==='Refusé'){
        d._legacyStatus = 'Refusé';
        if(!d.etatAffaire && perdue) d.etatAffaire = perdue.libelle;
        d.status = 'Envoyé';
        migrated++;
      }
      if(d.etatAffaire===undefined) d.etatAffaire = '';
    });
    // Rattrapage : si une tentative de migration précédente a déjà basculé le statut vers "Envoyé"
    // sans avoir pu enregistrer l'État de l'affaire correspondant, on retrouve l'ancien statut
    // "Accepté"/"Refusé" dans l'historique du devis (conservé par les changements manuels de statut).
    (state.devis||[]).forEach(d=>{
      if(d._legacyStatus || d.etatAffaire) return;
      const hist = Array.isArray(d.history) ? d.history : [];
      for(let i=hist.length-1;i>=0;i--){
        const txt = (hist[i].changes||[]).join(' ');
        const m = txt.match(/Statut\s*:\s*.*?→\s*(Accepté|Refusé)/);
        if(m){
          d._legacyStatus = m[1];
          if(m[1]==='Accepté' && gagnee) d.etatAffaire = gagnee.libelle;
          else if(m[1]==='Refusé' && perdue) d.etatAffaire = perdue.libelle;
          migrated++;
          break;
        }
      }
    });
    if(migrated>0){
      console.log(`Migration statut → état de l'affaire : ${migrated} devis mis à jour.`);
      persist('devis');
    }
  }catch(e){
    console.error("Erreur pendant la migration statut → état de l'affaire", e);
  }
  if(showFeedback){
    render();
    openEtatAffaireDiagnostic(migrated);
  }
  return migrated;
}

function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function stripHtml(html){
  if(!html) return '';
  // Repasse par le même analyseur que le texte enrichi (parseRichRuns) pour que les retours à la ligne
  // (<br>, changements de paragraphe) soient bien conservés comme de vrais sauts de ligne — sinon la
  // hauteur de cellule calculée à partir de ce texte "brut" ne correspondait plus au nombre de lignes
  // réellement affichées, ce qui décalait tout et rognait le bas de la cellule.
  return parseRichRuns(html).map(r=>r.text).join('');
}
/* ---- Reproduction de la mise en forme riche (gras, couleur, surlignage, taille) dans le PDF ---- */
function hexToRgb(color){
  color = String(color||'').trim();
  // Le surlignage/la couleur appliqués via l'éditeur peuvent être enregistrés au format "rgb(r, g, b)"
  // par le navigateur (et non en hexadécimal) — on gère donc aussi ce format.
  const rgbMatch = color.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
  if(rgbMatch) return [parseInt(rgbMatch[1],10), parseInt(rgbMatch[2],10), parseInt(rgbMatch[3],10)];
  let hex = color.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  if(isNaN(num)) return [35,35,35];
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function parseRichRuns(html){
  if(!html) return [];
  const container = document.createElement('div');
  container.innerHTML = html;
  const runs = [];
  const BLOCK_TAGS = new Set(['div','p']);
  function walk(node, style, isBlockStart){
    if(node.nodeType===3){
      if(node.textContent) runs.push(Object.assign({text:node.textContent}, style));
      return;
    }
    if(node.nodeType!==1) return;
    const tag = node.tagName.toLowerCase();
    if(tag==='br'){ runs.push({text:'\n', forceBreak:true}); return; }
    // Un navigateur peut représenter un retour à la ligne en encapsulant chaque ligne dans son propre
    // <div>/<p> plutôt qu'avec un <br> : on insère alors un saut de ligne explicite entre deux blocs.
    if(BLOCK_TAGS.has(tag) && isBlockStart===false) runs.push({text:'\n', forceBreak:true});
    const s = Object.assign({}, style);
    if(tag==='b' || tag==='strong') s.bold = true;
    const inline = node.getAttribute('style')||'';
    if(/font-weight\s*:\s*(bold|[6-9]00)/i.test(inline)) s.bold = true;
    const colorMatch = inline.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
    if(colorMatch) s.color = colorMatch[1].trim();
    const bgMatch = inline.match(/background-color\s*:\s*([^;]+)/i);
    if(bgMatch && bgMatch[1].trim().toLowerCase()!=='transparent') s.bg = bgMatch[1].trim();
    const fsMatch = inline.match(/font-size\s*:\s*(\d+(?:\.\d+)?)px/i);
    if(fsMatch) s.fontSize = parseFloat(fsMatch[1]);
    node.childNodes.forEach(child=>walk(child, s, false));
  }
  Array.from(container.childNodes).forEach((n,idx)=>walk(n, {bold:false, color:null, bg:null, fontSize:null}, idx===0));
  return runs;
}
function wrapRunsToWidth(doc, runs, maxWidth, baseFontSize){
  // Découpe les runs (texte + style) en mots et calcule soi-même les retours à la ligne en mesurant la
  // largeur réelle de chaque mot (avec son propre style, gras compris) — plutôt que de se recaler sur un
  // découpage déjà fait ailleurs pour du texte brut, ce qui pouvait désynchroniser le texte enrichi de
  // sa mise en page sur les lignes longues (texte manquant, dédoublé ou mal positionné).
  const tokens = [];
  runs.forEach(r=>{
    if(r.forceBreak){ tokens.push({text:'\n', style:r, forceBreak:true}); return; }
    const parts = r.text.split(/(\s+)/);
    parts.forEach(p=>{ if(p!=='') tokens.push({text:p, style:r}); });
  });
  function widthOf(tok){
    const fs = (tok.style && tok.style.fontSize) || baseFontSize;
    doc.setFontSize(fs);
    doc.setFont('helvetica', (tok.style && tok.style.bold) ? 'bold':'normal');
    return doc.getTextWidth(tok.text);
  }
  const lines = [];
  let current = [], currentWidth = 0;
  tokens.forEach(tok=>{
    if(tok.forceBreak){
      while(current.length && /^\s+$/.test(current[current.length-1].text)) current.pop();
      lines.push(current);
      current = []; currentWidth = 0;
      return;
    }
    const isSpace = /^\s+$/.test(tok.text);
    const w = widthOf(tok);
    if(!isSpace && currentWidth + w > maxWidth && current.length>0){
      while(current.length && /^\s+$/.test(current[current.length-1].text)) current.pop();
      if(current.length) lines.push(current);
      current = []; currentWidth = 0;
    }
    current.push(tok);
    currentWidth += w;
  });
  while(current.length && /^\s+$/.test(current[current.length-1].text)) current.pop();
  if(current.length || lines.length===0) lines.push(current);
  return lines.map(lineTokens=>{
    const segs = [];
    lineTokens.forEach(tok=>{
      if(segs.length && segs[segs.length-1].style===tok.style) segs[segs.length-1].text += tok.text;
      else segs.push({text:tok.text, style:tok.style});
    });
    return segs;
  });
}
function drawRichCellText(doc, linesOut, x, y, lineHeight, baseFontSize, baseColorRgb, centerWidth){
  linesOut.forEach((segs, li)=>{
    let cx = x;
    if(centerWidth!=null){
      let lineWidth = 0;
      segs.forEach(seg=>{
        const fs = (seg.style && seg.style.fontSize) || baseFontSize;
        doc.setFontSize(fs);
        doc.setFont('helvetica', (seg.style && seg.style.bold) ? 'bold' : 'normal');
        lineWidth += doc.getTextWidth(seg.text);
      });
      cx = x + Math.max(0, (centerWidth-lineWidth)/2);
    }
    const ly = y + li*lineHeight;
    segs.forEach(seg=>{
      const fs = (seg.style && seg.style.fontSize) || baseFontSize;
      doc.setFontSize(fs);
      doc.setFont('helvetica', (seg.style && seg.style.bold) ? 'bold' : 'normal');
      const w = doc.getTextWidth(seg.text);
      if(seg.style && seg.style.bg){
        const rgb = hexToRgb(seg.style.bg);
        doc.setFillColor(rgb[0], rgb[1], rgb[2]);
        doc.rect(cx, ly - fs*0.3528*0.72, w, fs*0.3528*0.92, 'F');
      }
      const color = (seg.style && seg.style.color) ? hexToRgb(seg.style.color) : baseColorRgb;
      doc.setTextColor(color[0], color[1], color[2]);
      doc.text(seg.text, cx, ly);
      cx += w;
    });
  });
  doc.setFontSize(baseFontSize);
  doc.setFont('helvetica','normal');
  doc.setTextColor(baseColorRgb[0], baseColorRgb[1], baseColorRgb[2]);
}
function computeLineButtonsHeight(line){
  // Boutons de liens (fiche technique/notice/photo) désactivés à l'export PDF sur demande — les liens
  // restent enregistrés sur les tarifs, mais ne s'affichent plus sur le devis imprimé.
  return 0;
}
function drawDevisLineLinkButtons(doc, cellX, cellWidth, y, line){
  const buttons = [];
  if(line.ficheTechniqueUrl) buttons.push({label:'Fiche technique', url:line.ficheTechniqueUrl, color:[47,111,189]});
  if(line.noticeUrl) buttons.push({label:'Notice', url:line.noticeUrl, color:[184,134,59]});
  if(line.photoUrl) buttons.push({label:'Photo', url:line.photoUrl, color:[175,75,61]});
  if(buttons.length===0) return;
  const fs = 7, padX = 2.4, gap = 2.5, h = 4.8;
  doc.setFontSize(fs);
  doc.setFont('helvetica','normal');
  const widths = buttons.map(b=>doc.getTextWidth(b.label) + padX*2);
  const totalWidth = widths.reduce((s,w)=>s+w,0) + gap*(buttons.length-1);
  let cx = cellX + (cellWidth-totalWidth)/2;
  buttons.forEach((b,i)=>{
    const w = widths[i];
    doc.setDrawColor(b.color[0], b.color[1], b.color[2]);
    doc.setTextColor(b.color[0], b.color[1], b.color[2]);
    doc.setLineWidth(0.25);
    doc.roundedRect(cx, y, w, h, h/2, h/2, 'S');
    doc.text(b.label, cx+w/2, y+h/2+fs*0.3528*0.35, {align:'center'});
    doc.link(cx, y, w, h, {url:b.url});
    cx += w+gap;
  });
}
function drawRichDesignationCell(doc, data, html, baseColorRgb, centered, line){
  const runs = parseRichRuns(html);
  const btnHeight = computeLineButtonsHeight(line);
  if(runs.length===0 && btnHeight===0) return false;
  const pad = data.cell.styles.cellPadding || {top:2.6,left:2.6,right:2.6};
  const padLeft = (typeof pad==='object') ? (pad.left||2.6) : pad;
  const padRight = (typeof pad==='object') ? (pad.right!=null?pad.right:padLeft) : pad;
  const fs = data.cell.styles.fontSize || 8.5;
  const maxWidth = data.cell.width - padLeft - padRight;
  const linesOut = runs.length ? wrapRunsToWidth(doc, runs, maxWidth, fs) : [];
  const lh = fs*0.3528*2.0;
  const btnGap = btnHeight ? 2.2 : 0;
  // Centre l'ensemble (texte + éventuels boutons de liens) verticalement dans la cellule, comme les
  // autres colonnes (valign:'middle'), plutôt que de le caler en haut.
  const textBlockHeight = linesOut.length*lh;
  const totalHeight = textBlockHeight + (btnHeight?btnGap+btnHeight:0);
  let cursorY = data.cell.y + (data.cell.height - totalHeight)/2;
  if(linesOut.length){
    drawRichCellText(doc, linesOut, data.cell.x+padLeft, cursorY+fs*0.3528*0.8, lh, fs, baseColorRgb, centered?maxWidth:null);
    cursorY += textBlockHeight;
  }
  if(btnHeight){
    drawDevisLineLinkButtons(doc, data.cell.x+padLeft, maxWidth, cursorY+btnGap, line);
  }
  return true;
}

/* ============================= MINI-BARRE DE MISE EN FORME (zones "rich-editable") ============================= */
/* S'affiche au survol d'une sélection de texte dans une zone .rich-editable (désignations de lignes de
   devis, lignes de titre/commentaire) : gras, taille de police, couleur du texte, surlignage. */
let richToolbarEl = null;
let richToolbarRange = null;
function ensureRichToolbar(){
  if(richToolbarEl) return richToolbarEl;
  richToolbarEl = document.createElement('div');
  richToolbarEl.className = 'rich-toolbar';
  richToolbarEl.innerHTML = `
    <button type="button" onmousedown="event.preventDefault();" onclick="richApplyBold()" title="Gras"><b>G</b></button>
    <span class="rich-toolbar-divider"></span>
    <span class="rich-toolbar-group">
      <span class="rich-toolbar-group-label">Couleur</span>
      <span class="rich-toolbar-swatches">${['#1E2A2C','#AF4B3D','#2F5D50','#3E6FA6','#B8863B'].map(c=>`<button type="button" onmousedown="event.preventDefault();" onclick="richApplyColor('${c}')" style="background:${c};" title="Couleur du texte"></button>`).join('')}</span>
    </span>
    <span class="rich-toolbar-divider"></span>
    <span class="rich-toolbar-group">
      <span class="rich-toolbar-group-label">Surligner</span>
      <span class="rich-toolbar-swatches">
        <button type="button" onmousedown="event.preventDefault();" onclick="richRemoveHighlight()" class="rich-toolbar-none" title="Aucun (retirer le surlignage)"></button>
        ${['#FFF3A0','#C8F0D8','#FDD9C8','#D8E4FF'].map(c=>`<button type="button" onmousedown="event.preventDefault();" onclick="richApplyHighlight('${c}')" style="background:${c};" title="Surligner"></button>`).join('')}
      </span>
    </span>
  `;
  document.body.appendChild(richToolbarEl);
  return richToolbarEl;
}
function updateRichToolbar(){
  const el = ensureRichToolbar();
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed){ el.style.display='none'; return; }
  const anchorNode = sel.anchorNode;
  const container = anchorNode && (anchorNode.nodeType===1 ? anchorNode : anchorNode.parentElement);
  const editable = container ? container.closest('.rich-editable') : null;
  if(!editable){ el.style.display='none'; return; }
  richToolbarRange = sel.getRangeAt(0).cloneRange();
  const rect = richToolbarRange.getBoundingClientRect();

function parseMoneyLoose(raw){
  if(raw===null||raw===undefined) return 0;
  let s = String(raw).trim();
  if(!s) return 0;
  s = s.replace(/[€$£]/g,'').replace(/[\s\u00A0]/g,'');
  const lastComma = s.lastIndexOf(',');
  const lastDot = s.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot){ s = s.replace(/\./g,'').replace(',', '.'); }
    else { s = s.replace(/,/g,''); }
  } else if(lastComma>-1){
    s = s.replace(/\./g,'').replace(',', '.');
  } else if(lastDot>-1){
    const parts = s.split('.');
    if(parts.length>2){ const dec = parts.pop(); s = parts.join('') + '.' + dec; }
  }
  s = s.replace(/[^0-9.\-]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function hasCloudStorage(){
  return (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

// Un enregistrement (ex. Tarifs avec des dizaines de milliers de lignes) peut dépasser la limite
// de 5 Mo par clé du stockage. On découpe alors la valeur en plusieurs morceaux sous des clés
// dérivées, avec un petit "manifeste" sous la clé d'origine indiquant combien de morceaux il faut
// relire pour reconstituer la valeur complète.
// IMPORTANT (sécurité anti-corruption) : chaque sauvegarde écrit ses morceaux sous une NOUVELLE
// "génération" (suffixe unique) sans jamais toucher aux morceaux de la génération précédente.
// Le manifeste (qui pointe vers l'ancienne ou la nouvelle génération) n'est mis à jour qu'une fois
// TOUS les nouveaux morceaux écrits avec succès. Si l'écriture échoue en cours de route (quota
// dépassé, etc.), l'ancienne génération reste intacte et reste ce que le manifeste référence :
// une sauvegarde qui échoue ne peut donc jamais corrompre ou effacer les données précédentes.
const CHUNK_SIZE = 1500000; // marge de sécurité sous la limite de 5 Mo (les caractères accentués pèsent plus en octets qu'en longueur JS)
function chunkString(str, size){
  const chunks = [];
  for(let i=0;i<str.length;i+=size) chunks.push(str.slice(i,i+size));
  return chunks;
}
async function readManifest(key){
  // Relit le manifeste actuellement enregistré (pour connaître l'ancienne génération à nettoyer
  // une fois la nouvelle sauvegarde confirmée). Ne sert qu'au nettoyage : jamais utilisé pour bloquer une écriture.
  let raw = null;
  if(hasCloudStorage()){
    try{ const r = await window.storage.get(key, false); if(r && r.value) raw = r.value; }catch(e){}
  }
  if(raw===null){
    try{ raw = localStorage.getItem('comagentco_'+key); }catch(e){}
  }
  if(!raw) return null;
  try{ const parsed = JSON.parse(raw); return (parsed && parsed.__chunked) ? parsed : null; }catch(e){ return null; }
}

function ensurePrixNetListes(){
  state.prixNetListes = state.prixNetListes || [];

  const getOrCreateDefaultListe = (brandId)=>{
    let liste = state.prixNetListes.find(l=>l.brandId===brandId && l.isDefault);

      const brand = state.brands.find(b=>b.id===brandId);
      liste = {id:uid(), brandId, nom: brand?('Liste '+brand.name):'Liste principale', isDefault:true};
      state.prixNetListes.push(liste);

    }

  };
  // Réfs existantes sans liste assignée -> rattachées à la liste par défaut de leur marque
  state.listesPrixNets.forEach(t=>{
    if(!t.listeId){
      const liste = getOrCreateDefaultListe(t.brandId);
      t.listeId = liste.id;
      changed = true;
    }
  });
  // Anciennes associations client<->marque -> converties en client<->liste (liste par défaut de la marque)
  state.clients.forEach(c=>{

        if(!c.netPriceListeIds.includes(liste.id)) c.netPriceListeIds.push(liste.id);

      });
      delete c.civilite; delete c.prenom; delete c.fonction;
      delete c.telephone; delete c.portable; delete c.email;
      changed = true;
    }
  });
  if(changed) persist('clients');
}
let saveTimers = {};
function folderStorageActive(){ return !!backupDirHandle && !backupFolderNeedsPermission; }
const BIG_KEYS = ['tarifs','listesPrixNets','devisAttachments'];
async function persistNow(key){
  // Tarifs et Liste de prix nets peuvent peser plusieurs dizaines de Mo pour un gros catalogue —
  // bien au-delà de ce que le stockage du navigateur (localStorage/cloud) peut accepter, même fragmenté.
  // Si un dossier de sauvegarde est actif, on vérifie l'autorisation EN DIRECT (elle peut avoir expiré
  // depuis le dernier chargement de page) avant de s'y fier comme unique support pour ces deux clés.
  if(BIG_KEYS.includes(key) && backupDirHandle){
    const permOk = await ensureBackupPermission();
    if(permOk){
      const ok = await writeBackupNow();
      return {localOk: ok, cloudOk: null, size: JSON.stringify(state[key]).length, viaFolder: true};
    }
    // Autorisation indisponible cette fois (nécessite un clic de l'utilisateur) : on retente via le
    // stockage classique ci-dessous plutôt que d'abandonner silencieusement.
  }
  const payload = JSON.stringify(state[key]);
  let localOk = true, cloudOk = null;
  const oldManifest = await readManifest(key); // pour nettoyage après coup uniquement — jamais pour bloquer l'écriture

  if(payload.length > CHUNK_SIZE){
    const chunks = chunkString(payload, CHUNK_SIZE);
    const gen = uid();

    // ---- Local : écrit la nouvelle génération de morceaux SANS toucher à l'ancienne ----
    let localChunksOk = true;
    let localWrittenCount = 0;
    try{
      chunks.forEach((c,i)=>{ localStorage.setItem('comagentco_'+key+'__c'+i+'__'+gen, c); localWrittenCount = i+1; });
    }catch(e){
      console.error('Erreur localStorage (nouveaux morceaux)', key, e);
      localChunksOk = false;
      // Nettoie les morceaux partiels de cette tentative ratée — l'ancienne génération n'a pas été touchée
      for(let i=0;i<localWrittenCount;i++){ try{ localStorage.removeItem('comagentco_'+key+'__c'+i+'__'+gen); }catch(e2){} }
    }
    if(localChunksOk){
      try{
        localStorage.setItem('comagentco_'+key, JSON.stringify({__chunked:true, count:chunks.length, gen}));
        if(oldManifest && oldManifest.gen && oldManifest.gen!==gen){
          for(let i=0;i<oldManifest.count;i++){ try{ localStorage.removeItem('comagentco_'+key+'__c'+i+'__'+oldManifest.gen); }catch(e){} }
        }
      }catch(e){ console.error('Erreur localStorage (manifeste)', key, e); localOk = false; }
    } else {
      localOk = false; // l'ancienne donnée locale (manifeste + morceaux) reste intacte et lisible
    }

    // ---- Cloud : même principe ----
    if(hasCloudStorage()){
      cloudOk = true;
      let cloudChunksOk = true;
      const writtenIdx = [];
      try{
        for(let i=0;i<chunks.length;i++){
          await window.storage.set(key+'__c'+i+'__'+gen, chunks[i], false);
          writtenIdx.push(i);
        }
      }catch(e){
        console.error('Erreur cloud (nouveaux morceaux)', key, e);
        cloudChunksOk = false;
        for(const i of writtenIdx){ try{ await window.storage.delete(key+'__c'+i+'__'+gen, false); }catch(e2){} }
      }
      if(cloudChunksOk){
        try{
          await window.storage.set(key, JSON.stringify({__chunked:true, count:chunks.length, gen}), false);
          if(oldManifest && oldManifest.gen && oldManifest.gen!==gen){
            for(let i=0;i<oldManifest.count;i++){ try{ await window.storage.delete(key+'__c'+i+'__'+oldManifest.gen, false); }catch(e){} }
          }
        }catch(e){ console.error('Erreur cloud (manifeste)', key, e); cloudOk = false; }
      } else {
        cloudOk = false; // l'ancienne donnée cloud reste intacte et lisible
      }
    }
  } else {
    // Petit payload : écriture directe sous la clé d'origine — intrinsèquement atomique
    // (setItem/set remplace la valeur en un seul appel, ou échoue sans toucher à l'ancienne).
    try{
      localStorage.setItem('comagentco_'+key, payload);
      if(oldManifest && oldManifest.gen){
        for(let i=0;i<oldManifest.count;i++){ try{ localStorage.removeItem('comagentco_'+key+'__c'+i+'__'+oldManifest.gen); }catch(e){} }
      }
    }catch(e){
      console.error('Erreur localStorage', key, e);
      localOk = false;
    }
    if(hasCloudStorage()){
      cloudOk = true;
      try{
        await window.storage.set(key, payload, false);
        if(oldManifest && oldManifest.gen){
          for(let i=0;i<oldManifest.count;i++){ try{ await window.storage.delete(key+'__c'+i+'__'+oldManifest.gen, false); }catch(e){} }
        }
      }catch(e){
        console.error('Erreur de sauvegarde cloud', key, e);
        cloudOk = false;
      }
    }
  }
  // En plus, dans le dossier de sauvegarde local choisi par l'utilisateur (voir Paramètres)
  scheduleFolderBackup();
  return {localOk, cloudOk, size:payload.length};
}
function saveKey(key){
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    const res = await persistNow(key);
    const critical = BIG_KEYS.includes(key); // Tarifs / Liste de prix nets : un échec ici peut faire perdre une saisie en cours, message affiché plus longtemps
    if(res.viaFolder){
      if(!res.localOk){
        showToast("Erreur d'enregistrement dans le dossier de sauvegarde pour « "+key+" » — vérifiez que le dossier est toujours accessible (Paramètres).", critical?7000:undefined);
      }
      return;
    }
    if(!res.localOk && res.cloudOk!==true){
      showToast("Erreur d'enregistrement pour « "+key+" » — réessayez, ou vérifiez l'espace disponible.", critical?7000:undefined);
    } else if(!res.localOk){
      showToast("La sauvegarde locale du navigateur est pleine pour « "+key+" » — la sauvegarde cloud reste à jour.", critical?7000:undefined);
    }
  }, 200);
}
function persist(key){
  // Les tables Tarifs / Liste de prix nets peuvent contenir des dizaines de milliers de lignes :
  // on invalide leur cache de tri à chaque modification plutôt que de re-trier à chaque frappe.
  if(key==='tarifs') invalidateTarifsSortCache();
  if(key==='listesPrixNets') invalidatePnSortCache();
  saveKey(key);
}

/* ============================= SAUVEGARDE DANS UN DOSSIER LOCAL ============================= */
// Utilise la File System Access API (Chrome / Edge). L'utilisateur choisit une fois le dossier
// (par ex. son dossier OneDrive) ; l'app y réécrit ensuite un fichier de sauvegarde à chaque
// modification (sauvegarde continue), car les navigateurs n'autorisent pas d'écriture disque
// garantie au moment précis de la fermeture de l'onglet.
let backupDirHandle = null;
let backupFolderNeedsPermission = false;
let backupDirHandle2 = null;
let backupFolderNeedsPermission2 = false;
function fsAccessSupported(){ return typeof window.showDirectoryPicker === 'function'; }
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('comagentco_fs', 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains('handles')) req.result.createObjectStore('handles'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key,val){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(val,key);
      tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
    });
  }catch(e){ /* IndexedDB indisponible */ }
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function initBackupFolder(){
  if(!fsAccessSupported()) return;
  try{
    const handle = await idbGet('backupDir');
    if(handle){
      backupDirHandle = handle;
      const perm = await handle.queryPermission({mode:'readwrite'});
      backupFolderNeedsPermission = (perm!=='granted');
    }
  }catch(e){ /* pas de dossier mémorisé */ }
  try{
    const handle2 = await idbGet('backupDir2');
    if(handle2){
      backupDirHandle2 = handle2;
      const perm2 = await handle2.queryPermission({mode:'readwrite'});
      backupFolderNeedsPermission2 = (perm2!=='granted');
    }
  }catch(e){ /* pas de second dossier mémorisé */ }
}

  if(!fsAccessSupported()){
    showToast("Cette fonction nécessite Chrome ou Edge. Utilisez le bouton « Télécharger une sauvegarde » à la place.");

    if(perm!=='granted'){ perm = await backupDirHandle.requestPermission({mode:'readwrite'}); }

function fullBackupPayload(){

let lastLoadedBackupFileName = '';
async function readFolderBackupData(){
  if(!backupDirHandle) return null;
  try{
    const perm = await backupDirHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted') return null; // pas d'invite silencieuse possible : on ne bloque pas le chargement
    // On balaie le dossier à la recherche de tous les fichiers de sauvegarde (le fichier unique
    // écrit automatiquement à chaque modification, mais aussi d'éventuelles sauvegardes datées
    // téléchargées manuellement et déposées dans ce même dossier) pour ne charger que la plus récente.
    let bestHandle = null, bestTime = -1, bestName = '';
    for await (const entry of backupDirHandle.values()){
      if(entry.kind!=='file') continue;
      if(!/^ComAgentCo_sauvegarde.*\.json$/i.test(entry.name)) continue;
      let t = 0;
      try{ t = (await entry.getFile()).lastModified || 0; }catch(e){ t = 0; }
      // Si le nom du fichier contient une date (ComAgentCo_sauvegarde_2026-09-09.json), elle prime
      // sur la date de modification (fiable même si le fichier a été copié/synchronisé, ce qui change
      // sa date de modification sans changer son contenu).
      const m = entry.name.match(/(\d{4}-\d{2}-\d{2})/);
      if(m){
        const parsed = new Date(m[1]+'T00:00:00').getTime();
        if(!isNaN(parsed)) t = Math.max(t, parsed);
      }
      if(t > bestTime){ bestTime = t; bestHandle = entry; bestName = entry.name; }
    }
    if(!bestHandle) return null;
    const file = await bestHandle.getFile();
    const text = await file.text();
    if(!text) return null;
    const data = JSON.parse(text);
    lastLoadedBackupFileName = bestName;
    return data;
  }catch(e){
    return null; // fichier absent, dossier déplacé, ou JSON corrompu : on se rabat sur le stockage navigateur
  }
}
async function writeBackupNow(){
  if(!backupDirHandle && !backupDirHandle2) return false;
  let ok1 = false, ok2 = false, needsRender = false;
  if(backupDirHandle){
    const perm = await ensureBackupPermission();
    if(!perm){ needsRender = true; }
    else{
      try{
        const fileHandle = await backupDirHandle.getFileHandle('ComAgentCo_sauvegarde.json', {create:true});
        const writable = await fileHandle.createWritable();
        await writable.write(fullBackupPayload());
        await writable.close();
        ok1 = true;
      }catch(e){ console.error('Erreur sauvegarde dossier 1', e); }
    }
  }
  if(backupDirHandle2){
    const perm2 = await ensureBackupPermission2();
    if(!perm2){ needsRender = true; }
    else{
      try{
        const fileHandle2 = await backupDirHandle2.getFileHandle('ComAgentCo_sauvegarde.json', {create:true});
        const writable2 = await fileHandle2.createWritable();
        await writable2.write(fullBackupPayload());
        await writable2.close();
        ok2 = true;
      }catch(e){ console.error('Erreur sauvegarde dossier 2', e); }
    }
  }
  if(needsRender) render();
  const el = document.getElementById('backupStatusLine');
  if(el && ok1) el.textContent = 'Dernière sauvegarde dans le dossier : '+new Date().toLocaleTimeString('fr-FR');
  const el2 = document.getElementById('backupStatusLine2');
  if(el2 && ok2) el2.textContent = 'Dernière sauvegarde dans le second dossier : '+new Date().toLocaleTimeString('fr-FR');
  return ok1 || ok2;
}
function downloadBackupNow(){
  const blob = new Blob([fullBackupPayload()], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ComAgentCo_sauvegarde_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('Téléchargement de la sauvegarde lancé.');
}
function restoreBackupFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ showToast('Fichier de sauvegarde illisible.'); return; }
    if(!confirm('Restaurer cette sauvegarde va remplacer toutes les données actuelles. Continuer ?')) return;
    const allKeys = ['brands','clients','tarifs','listesPrixNets','prixNetListes','devis','devisTemplates','commerciaux','devisAttachments','trash','settings','paramLists','commissions','caVva','dashboardLayout','rapportLayout'];
    allKeys.forEach(k=>{
      if(data[k]!==undefined) state[k]=data[k];
    });
    state.paramLists = Object.assign(emptyParamLists(), state.paramLists||{});
    invalidateTarifsSortCache();
    invalidatePnSortCache();
    reindexSearchKeys();
    allKeys.forEach(k=>persist(k));
    render();
    showToast('Sauvegarde restaurée.');
  };
  reader.onerror = ()=> showToast('Impossible de lire ce fichier.');
  reader.readAsText(file);
}
window.addEventListener('beforeunload', ()=>{
  // Meilleur effort uniquement : les navigateurs ne garantissent pas les écritures disque
  // asynchrones pendant la fermeture. La sauvegarde continue (scheduleFolderBackup) ci-dessus
  // est le mécanisme fiable — les données sont déjà sur disque avant la fermeture dans la
  // grande majorité des cas puisqu'elle se déclenche 1,5s après chaque modification.
});


let toastTimer=null;
function showToast(msg, duration){
  let el = document.getElementById('toast');
  if(el) el.remove();
  el = document.createElement('div');
  el.id='toast'; el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.remove(); }, duration||2600);
}

function getOrderedNavItems(){
  const validIds = NAV_ITEMS_DEFAULT.map(d=>d.id);
  let order = (state.settings.navOrder||[]).filter(id=>validIds.includes(id));
  validIds.forEach(id=>{ if(!order.includes(id)) order.push(id); });
  return order.map(id=>NAV_ITEMS_DEFAULT.find(d=>d.id===id));
}
let navDragId = null;
function navDragStart(e, id){
  navDragId = id;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', id); }catch(err){}
  e.currentTarget.classList.add('nav-dragging');
}
function navDragOver(e, overId){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(!navDragId || navDragId===overId) return;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('nav-drag-over'));
  e.currentTarget.classList.add('nav-drag-over');
}
function navDrop(e, targetId){
  e.preventDefault();
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('nav-drag-over'));
  if(!navDragId || navDragId===targetId){ navDragId=null; return; }
  const order = getOrderedNavItems().map(it=>it.id);
  const fromIdx = order.indexOf(navDragId);
  const toIdx = order.indexOf(targetId);
  if(fromIdx<0 || toIdx<0){ navDragId=null; return; }
  order.splice(fromIdx,1);
  order.splice(toIdx,0,navDragId);
  state.settings.navOrder = order;
  persist('settings');
  navDragId = null;
  render();
}
function navDragEnd(e){
  document.querySelectorAll('.nav-item').forEach(el=>{ el.classList.remove('nav-dragging'); el.classList.remove('nav-drag-over'); });
  navDragId = null;
}
function resetNavOrder(){
  state.settings.navOrder = [];
  persist('settings');
  render();
  showToast('Ordre des onglets réinitialisé.');
}

<script>
/* ============================= MODALES ============================= */
function openModal(html, opts){
  opts = opts || {};
  closeModal();
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modalOverlay';
  overlay.innerHTML = `<div class="modal modal-full" id="modalBox">${html}</div>`;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
  document.addEventListener('keydown', escCloseHandler);
  positionModalCentered();
  makeModalDraggable();
  window.addEventListener('resize', positionModalCentered);
}
function positionModalCentered(){
  const box = document.getElementById('modalBox');
  if(!box) return;
  const sidebarW = 220;
  const availW = window.innerWidth - sidebarW;
  const rect = box.getBoundingClientRect();
  const left = sidebarW + Math.max(10, (availW - rect.width)/2);
  const top = Math.max(20, (window.innerHeight - rect.height)/2);
  box.style.left = left+'px';
  box.style.top = top+'px';
}
let modalDragHandlers = null;
function makeModalDraggable(){
  const overlay = document.getElementById('modalOverlay');
  if(!overlay) return;
  let dragging=false, offX=0, offY=0, box=null;
  const onDown = (e)=>{
    const head = e.target.closest('.modal-head');
    if(!head || e.target.closest('.close-x')) return;
    box = head.closest('.modal');
    if(!box) return;
    dragging = true;
    const rect = box.getBoundingClientRect();
    offX = e.clientX - rect.left;
    offY = e.clientY - rect.top;
    document.body.style.userSelect = 'none';
  };
  const onMove = (e)=>{
    if(!dragging || !box) return;
    const sidebarW = 220;
    let left = e.clientX - offX;
    let top = e.clientY - offY;
    left = Math.max(sidebarW, Math.min(left, window.innerWidth - 60));
    top = Math.max(0, Math.min(top, window.innerHeight - 40));
    box.style.left = left+'px';
    box.style.top = top+'px';
  };
  const onUp = ()=>{
    if(dragging){ dragging = false; box = null; document.body.style.userSelect = ''; }
  };
  overlay.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  modalDragHandlers = {onMove, onUp};
}
function escCloseHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const el = document.getElementById('modalOverlay');
  if(el) el.remove();
  document.removeEventListener('keydown', escCloseHandler);
  document.removeEventListener('keydown', devisFormKeydownHandler);
  window.removeEventListener('resize', positionModalCentered);
  if(modalDragHandlers){
    document.removeEventListener('mousemove', modalDragHandlers.onMove);
    document.removeEventListener('mouseup', modalDragHandlers.onUp);
    modalDragHandlers = null;
  }
}

function tarifCountsByBrand(){
  const map = new Map();
  state.tarifs.forEach(t=>{ map.set(t.brandId, (map.get(t.brandId)||0)+1); });
  return map;
}
function renderMarques(){
  return `
  <div class="topbar">
    <div>
      <h1>Marques &amp; fournisseurs</h1>
      <div class="sub">${state.brands.length} marque(s) référencée(s)</div>

  </div>
  ${state.brands.length===0 ? emptyState('◆','Aucune marque pour le moment','Ajoutez les marques que vous représentez pour commencer.') : `
  <div class="grid grid-4">
    ${(()=>{ const tarifCounts = tarifCountsByBrand(); return state.brands.map(b=>{
      const ca = caForBrand(b.id, null);
      const nbTarifs = tarifCounts.get(b.id)||0;
      return `
      <div class="card card-pad" style="cursor:pointer;" onclick="openBrandForm('${b.id}')" title="Cliquer pour voir le détail">
        <div style="display:flex;align-items:center;gap:9px;min-width:0;">

          <div class="chip" style="background:${brandColor(b.id)};min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span class="sq"></span>${escapeHtml(b.name)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:12px;">
          <span style="color:var(--muted);">${nbTarifs} référence(s)</span>
          <span class="num" style="font-weight:700;">${fmtMoney(ca)}</span>
        </div>
      </div>`;
    }).join(''); })()}

}

function renderLogoPreview(){
  if(!pendingLogoData) return '<div class="helper">Aucun logo pour le moment.</div>';
  return `<div style="display:flex;align-items:center;gap:12px;">

  </div>`;
}
function handleLogoFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      // Redimensionne pour limiter le poids stocké
      const maxDim = 300;
      let w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      pendingLogoData = canvas.toDataURL('image/png', 0.85);
      const wrap = document.getElementById('logoPreviewWrap');
      if(wrap) wrap.innerHTML = renderLogoPreview();
    };
    img.onerror = ()=> showToast("Impossible de lire cette image.");
    img.src = e.target.result;
  };
  reader.onerror = ()=> showToast("Impossible de lire ce fichier.");
  reader.readAsDataURL(file);
}
function cleanupSignaturePaste(container){
  if(!container) return;
  // Le copier-coller depuis Outlook/Word crée souvent des blocs vides entre les lignes
  // (ex. <div><br></div>), ce qui donne une impression d'espacement excessif — on les retire.
  const blocks = container.querySelectorAll('div, p');
  blocks.forEach(el=>{
    const html = el.innerHTML.trim().toLowerCase();
    const isEmpty = !el.textContent.trim() && !el.querySelector('img') && (html==='' || html==='<br>');
    if(isEmpty) el.remove();
  });
}
function persistifySignatureImages(container){
  if(!container) return;
  const imgs = container.querySelectorAll('img');
  imgs.forEach(img=>{
    const src = img.getAttribute('src')||'';
    if(!src || src.startsWith('data:')) return; // déjà persistable, ou vide
    fetch(src)
      .then(r=>r.blob())
      .then(blob=>new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = ()=>resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(blob);
      }))
      .then(dataUrl=>{ img.setAttribute('src', dataUrl); })
      .catch(e=>{
        // Certaines images collées depuis Outlook référencent une pièce jointe (cid:) que le
        // navigateur ne peut pas résoudre lui-même — dans ce cas l'image ne peut pas être reprise.
        console.warn('Image de signature non convertie', src, e);
      });
  });
}

const TRASH_TYPE_LABELS = {
  client:'Client', devis:'Devis', marche:'Marché', devisTemplate:'Modèle de devis',
  tarif:'Référence tarif', brand:'Marque', commercial:'Commercial',
  historyNote:'Note de suivi', prixNetListe:'Liste de prix nets', prixNet:'Référence liste de prix nets',
  paramItem:'Élément de liste', brandHistory:'RDV marque', tarifsBulk:'Tarifs (bloc)', prixNetBulk:'Liste de prix nets (bloc)',
};
function moveToTrash(type, label, data){
  state.trash = state.trash || [];
  state.trash.unshift({ id:uid(), type, label, data, deletedAt:new Date().toISOString() });
  persist('trash');
}
function restoreFromTrash(trashId){
  const entry = (state.trash||[]).find(x=>x.id===trashId);
  if(!entry) return;
  switch(entry.type){
    case 'client': state.clients.push(entry.data); persist('clients'); break;
    case 'devis': case 'marche': state.devis.push(entry.data); persist('devis'); break;
    case 'devisTemplate': state.devisTemplates.push(entry.data); persist('devisTemplates'); break;
    case 'tarif': state.tarifs.push(entry.data); persist('tarifs'); break;
    case 'tarifsBulk': state.tarifs = state.tarifs.concat(entry.data); persist('tarifs'); break;
    case 'brand': state.brands.push(entry.data); persist('brands'); break;
    case 'commercial': state.commerciaux.push(entry.data); persist('commerciaux'); break;
    case 'historyNote': {
      const c = state.clients.find(x=>x.id===entry.data.clientId);
      if(!c){ showToast('La fiche client correspondante n\'existe plus.'); return; }
      c.history = c.history || [];
      c.history.push(entry.data.note);
      persist('clients');
      break;
    }
    case 'prixNetListe':
      state.prixNetListes.push(entry.data.liste);
      state.listesPrixNets = state.listesPrixNets.concat(entry.data.items||[]);
      persist('prixNetListes'); persist('listesPrixNets');
      break;
    case 'prixNet': state.listesPrixNets.push(entry.data); persist('listesPrixNets'); break;
    case 'prixNetBulk': state.listesPrixNets = state.listesPrixNets.concat(entry.data); persist('listesPrixNets'); break;
    case 'paramItem':
      state.paramLists[entry.data.listKey] = state.paramLists[entry.data.listKey] || [];
      state.paramLists[entry.data.listKey].push(entry.data.item);
      persist('paramLists');
      break;
    case 'brandHistory': {
      const b = state.brands.find(x=>x.id===entry.data.brandId);
      if(!b){ showToast('La marque correspondante n\'existe plus.'); return; }
      b.history = b.history || [];
      b.history.push(entry.data.entry);
      persist('brands');
      break;
    }
    default: showToast("Type d'élément inconnu — restauration impossible."); return;
  }
  state.trash = state.trash.filter(x=>x.id!==trashId);
  persist('trash');
  render();
  showToast(`${TRASH_TYPE_LABELS[entry.type]||'Élément'} restauré.`);
}
function permanentlyDeleteFromTrash(trashId){
  if(!confirm('Supprimer définitivement cet élément ? Cette action est irréversible.')) return;
  state.trash = (state.trash||[]).filter(x=>x.id!==trashId);
  persist('trash');
  render();
  showToast('Élément supprimé définitivement.');
}
function emptyTrash(){
  if((state.trash||[]).length===0) return;
  if(!confirm(`Vider la corbeille ? Les ${state.trash.length} élément(s) seront supprimés définitivement et ne pourront plus être récupérés.`)) return;
  state.trash = [];
  persist('trash');
  render();
  showToast('Corbeille vidée.');
}
function perfClientMonthlyCa(year, source){
  const totals = Array(12).fill(0);
  if(source==='vva'){
    state.brands.forEach(b=>{
      for(let m=1;m<=12;m++) totals[m-1] += caVvaEffectiveMonth(year, b.id, 'all', m).value;
    });
  } else {
    state.devis.filter(d=>isDevisWon(d) && yearOf(d.date)===year).forEach(d=>{
      const m = parseInt((d.date||'').slice(5,7),10);
      if(m>=1 && m<=12) totals[m-1] += devisTotal(d).ht;
    });
  }
  return totals;
}
function perfClientCaFor(clientId, year, source){
  return source==='vva' ? caVvaTotal(year, 'all', clientId) : caForClient(clientId, year, null);

function renderBudgetCommercial(){
  const years = availableYears();
  if(!ui.budgetCommercialYear || !years.includes(ui.budgetCommercialYear)) ui.budgetCommercialYear = years[0] || new Date().getFullYear();
  const year = ui.budgetCommercialYear;

  // Vue d'ensemble par client (un client = une ligne, pas de doublon de CA même s'il a plusieurs animations).
  const rows = [];
  // Détail par animation individuelle (une note de suivi = une ligne, modifiable : titre + agences groupées).
  const animRows = [];
  state.clients.forEach(c=>{
    const perBrand = {};
    let anyEntry = false;
    (c.history||[]).forEach(h=>{
      if(yearOf(h.date)!==year) return;
      const taches = historyTasks(h);
      if(!taches.some(t=>t.name==='Animation commerciale')) return;
      anyEntry = true;
      const budgets = h.animationBudgets || {};
      Object.keys(budgets).forEach(bid=>{
        perBrand[bid] = (perBrand[bid]||0) + (budgets[bid]||0);
      });
      const totalBudgetAnim = Object.values(budgets).reduce((s,v)=>s+v,0);
      const linkedIds = (h.animationClientIds||[]).filter(id=>id!==c.id);
      const linkedClients = linkedIds.map(id=>state.clients.find(x=>x.id===id)).filter(Boolean);
      const caGroup = caForClient(c.id, year, null) + linkedClients.reduce((s,lc)=>s+caForClient(lc.id, year, null), 0);
      const ratioAnim = caGroup>0 ? (totalBudgetAnim/caGroup*100) : null;
      animRows.push({ client:c, historyId:h.id, titre: h.animationTitre||'', date: h.date, budgets, totalBudget:totalBudgetAnim, linkedClients, ca:caGroup, ratio:ratioAnim });
    });
    if(!anyEntry) return;
    const totalBudget = Object.values(perBrand).reduce((s,v)=>s+v,0);
    const ca = caForClient(c.id, year, null);
    const ratio = ca>0 ? (totalBudget/ca*100) : null;
    rows.push({ client:c, perBrand, totalBudget, ca, ratio });
  });
  rows.sort((a,b)=>b.totalBudget-a.totalBudget);
  animRows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const totalBudgetAll = rows.reduce((s,r)=>s+r.totalBudget,0);
  const totalCaAll = rows.reduce((s,r)=>s+r.ca,0);

  // Vue par marque : total du budget d'animation alloué, tous clients confondus, pour l'année sélectionnée.
  const budgetByBrand = {};
  rows.forEach(r=>{
    Object.keys(r.perBrand).forEach(bid=>{
      budgetByBrand[bid] = (budgetByBrand[bid]||0) + r.perBrand[bid];
    });
  });
  const brandRows = Object.keys(budgetByBrand)
    .map(bid=>({ brandId:bid, total:budgetByBrand[bid], nbClients: rows.filter(r=>r.perBrand[bid]).length }))
    .sort((a,b)=>b.total-a.total);

  return `
  <div class="topbar">
    <div><h1>Budget commercial</h1><div class="sub">Animations commerciales par client, comparées au CA réalisé — Année ${year}</div></div>
    <div class="field" style="margin-bottom:0;max-width:160px;">
      <select onchange="ui.budgetCommercialYear=parseInt(this.value,10); render();">
        ${years.map(y=>`<option value="${y}" ${year===y?'selected':''}>${y}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="grid grid-4" style="margin-bottom:20px;">
    <div class="card kpi"><div class="label">Budget total animations</div><div class="value num">${fmtMoney(totalBudgetAll)}</div></div>
    <div class="card kpi"><div class="label">CA total (clients concernés)</div><div class="value num" style="color:var(--success);">${fmtMoney(totalCaAll)}</div></div>
    <div class="card kpi"><div class="label">Ratio global</div><div class="value num">${totalCaAll>0?(totalBudgetAll/totalCaAll*100).toFixed(1)+' %':'—'}</div></div>
  </div>
  ${rows.length===0?emptyState('💰',"Aucune animation commerciale sur cette année","Cochez la tâche \"Animation commerciale\" (avec un budget par marque) sur une note de suivi client pour la voir apparaître ici."):`
  <div class="section-title">Budget annuel par marque ${year}</div>
  <div class="helper" style="margin-bottom:10px;">Total alloué aux animations commerciales, toutes marques confondues sur l'année, tous clients cumulés.</div>
  <div class="table-wrap card" style="margin-bottom:24px;"><table>
    <thead><tr><th>Marque</th><th class="num">Nb clients concernés</th><th class="num">Budget total ${year}</th></tr></thead>
    <tbody>
      ${brandRows.map(br=>`
        <tr>
          <td style="font-weight:600;"><span class="chip" style="background:${brandColor(br.brandId)};"><span class="sq"></span>${escapeHtml(brandName(br.brandId))}</span></td>
          <td class="num">${br.nbClients}</td>
          <td class="num" style="font-weight:700;">${fmtMoney(br.total)}</td>
        </tr>
      `).join('')}
      <tr style="font-weight:700;border-top:2px solid var(--line);">
        <td>Total</td>
        <td class="num">—</td>
        <td class="num">${fmtMoney(totalBudgetAll)}</td>
      </tr>
    </tbody>
  </table></div>

  <div class="section-title">Détail par animation</div>
  <div class="helper" style="margin-bottom:10px;">Une ligne par animation commerciale. Certaines animations regroupent plusieurs agences d'une même enseigne : cliquez sur ✎ pour donner un titre à l'animation et ajouter les agences concernées — leur CA sera alors additionné pour le ratio, mais le budget reste celui saisi sur l'agence principale.</div>
  <div class="table-wrap card"><table>
    <thead><tr><th>Animation</th><th>Client principal</th><th>Agences groupées</th><th>Marques (budget)</th><th class="num">Budget</th><th class="num">CA cumulé ${year}</th><th class="num">Ratio</th><th></th></tr></thead>
    <tbody>
      ${animRows.map(r=>`
        <tr>
          <td style="font-weight:600;">${r.titre?escapeHtml(r.titre):`<span class="helper" style="display:inline;">Animation du ${fmtDate(r.date)}</span>`}</td>
          <td style="cursor:pointer;" onclick="openClientSuiviOnlyModal('${r.client.id}')" title="Ouvrir le suivi commercial">${escapeHtml(clientDisplayName(r.client))}</td>
          <td>${r.linkedClients.length===0?'—':r.linkedClients.map(lc=>escapeHtml(clientDisplayName(lc))).join(', ')}</td>
          <td>${Object.keys(r.budgets).map(bid=>`<span class="chip" style="background:${brandColor(bid)};font-size:10px;margin:1px 3px 1px 0;">${escapeHtml(brandName(bid))} — ${fmtMoney(r.budgets[bid])}</span>`).join('')}</td>
          <td class="num" style="font-weight:700;">${fmtMoney(r.totalBudget)}</td>
          <td class="num">${fmtMoney(r.ca)}</td>
          <td class="num" style="font-weight:700;color:${r.ratio==null?'var(--muted)':(r.ratio>15?'var(--danger)':(r.ratio>7?'#D9782D':'var(--success)'))};">${r.ratio==null?'—':r.ratio.toFixed(1)+' %'}</td>
          <td><button class="btn btn-sm btn-ghost" onclick="openEditAnimationModal('${r.client.id}','${r.historyId}')" title="Donner un titre à cette animation et grouper d'autres agences">✎</button></td>
        </tr>
      `).join('')}
    </tbody>
  </table></div>
  `}
  `;
}

  const results = state.clients.filter(c=>c.id!==principalId && !window._animEditLinkedIds.includes(c.id) && (clientDisplayName(c)||'').toLowerCase().includes(q)).slice(0,10);

function clientDepartement(c){
  const cp = (c.codePostal||'').trim();
  if(!/^\d{5}$/.test(cp)) return null;
  if(cp.startsWith('97') || cp.startsWith('98')) return cp.slice(0,3);
  if(cp.startsWith('20')){
    return (parseInt(cp,10)<=20199) ? '2A' : '2B';
  }
  return cp.slice(0,2);
}
function departementLabel(code){
  return FR_DEPARTEMENTS[code] ? `${code} — ${FR_DEPARTEMENTS[code]}` : code;
}
function departementsInUse(){
  const set = new Set();
  state.clients.forEach(c=>{ const d = clientDepartement(c); if(d) set.add(d); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
}
function clientMatchesSearch(c,q){
  if(!q) return true;
  const contactsHay = (c.contacts||[]).map(p=>[p.civilite,p.prenom,p.nom,p.email,p.telephone,p.portable,p.fonction].filter(Boolean).join(' ')).join(' ');
  const haystack = (
    c.name+' '+(c.company||'')+' '+contactsHay+' '+(c.ville||'')+' '+(c.codePostal||'')+' '+
    (c.famille||'')+' '+(c.sousFamille||'')
  ).toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  return words.every(w=>haystack.includes(w));
}
function sousFamillesForFamilleFilter(familleLibelle){
  const all = (state.paramLists.sousFamillesClients||[]).slice().sort((a,b)=>(a.libelle||'').localeCompare(b.libelle||''));
  if(!familleLibelle || familleLibelle==='all') return all;
  const famille = (state.paramLists.famillesClients||[]).find(f=>(f.libelle||'').trim().toLowerCase()===familleLibelle.trim().toLowerCase());
  if(!famille) return all;
  const filtered = all.filter(sf=>sf.familleId===famille.id);
  return filtered.length>0 ? filtered : all; // pas de sous-famille rattachée -> on continue de tout proposer
}
function sousFamillesClientsDatalistHtml(familleLibelle){
  const items = sousFamillesForFamilleFilter(familleLibelle);

function visibleEmailingList(){
  const q = ui.emailingSearch.toLowerCase();
  let list = state.clients.filter(c=>clientMatchesSearch(c,q));
  list = list.filter(c=>c.acceptEmailing!==false);
  if(ui.emailingStatusFilter==='actifs') list = list.filter(c=>c.actif!==false);
  if(ui.emailingStatusFilter==='inactifs') list = list.filter(c=>c.actif===false);
  if(ui.emailingFamilleFilter && ui.emailingFamilleFilter!=='all'){
    const target = ui.emailingFamilleFilter.trim().toLowerCase();
    list = list.filter(c=>(c.famille||'').trim().toLowerCase()===target);
  }
  if(ui.emailingSousFamilleFilter && ui.emailingSousFamilleFilter!=='all'){
    const target = ui.emailingSousFamilleFilter.trim().toLowerCase();
    list = list.filter(c=>(c.sousFamille||'').trim().toLowerCase()===target);
  }
  if(ui.emailingBrandFilter && ui.emailingBrandFilter!=='all'){
    const brand = state.brands.find(b=>b.id===ui.emailingBrandFilter);
    const depts = brand ? (brand.departementsRepresentes||[]) : [];
    // Si la marque n'a aucun département coché, elle est considérée comme représentée partout (pas de filtre).
    if(depts.length>0) list = list.filter(c=>depts.includes(clientDepartement(c)));
  }
  list.sort((a,b)=>(a.company||a.name).localeCompare(b.company||b.name) || a.name.localeCompare(b.name));
  return list;
}
function clientEmails(c){
  const emails = [];
  const contacts = (c.contacts||[]).filter(p=>p.actif!==false); // les contacts inactifs sont exclus des envois groupés
  if(contacts.length>0){
    const primary = contacts[0];
    if(primary.email && primary.email.trim()) emails.push({email:primary.email.trim(), who:'Contact principal', name: contactFullName(primary)||'—'});
    if(ui.emailingIncludeContacts){
      contacts.slice(1).forEach(p=>{
        if(p.email && p.email.trim()) emails.push({email:p.email.trim(), who:'Contact', name: contactFullName(p)||'—'});
      });
    }
  }
  return emails;
}

function toggleEmailingSelectAll(checked){

function collectEmailingRows(){
  const ids = emailingSelectedIds();

  state.clients.filter(c=>ids.includes(c.id)).forEach(c=>{

      if(seen.has(key)) return;
      seen.add(key);
      rows.push({client: clientDisplayName(c), societe: c.company||'', email: e.email, type: e.who, contact: e.name});
    });
  });
  return rows;
}

function copyEmailingList(){
  const rows = collectEmailingRows();
  if(rows.length===0) return;
  const text = rows.map(r=>r.email).join('; ');
  const done = ()=> showToast(`${rows.length} adresse(s) email copiée(s) dans le presse-papiers.`);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ showToast("Impossible de copier automatiquement — sélectionnez et copiez manuellement."); }
  document.body.removeChild(ta);
}
function openEmailingInOutlook(){
  const rows = collectEmailingRows();
  if(rows.length===0){ showToast('Sélectionnez au moins un client avec une adresse email.'); return; }
  const emails = rows.map(r=>r.email);
  // Les destinataires sont placés en copie cachée (Cci) pour ne pas exposer les adresses de tous les clients entre eux.
  const mailto = `mailto:?bcc=${encodeURIComponent(emails.join(';'))}`;
  if(mailto.length > 1800){
    showToast(`${emails.length} adresses forment un lien très long : certaines messageries peuvent le tronquer. Si le brouillon n'a pas toutes les adresses, utilisez plutôt "Copier les emails" et collez-les manuellement en Cci.`, 7000);
  }
  window.location.href = mailto;
}
function downloadEmailingTxt(){
  const rows = collectEmailingRows();
  if(rows.length===0) return;
  const text = rows.map(r=>r.email).join('\n');
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `emails_${todayStr()}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('Téléchargement lancé.');
}
function exportEmailingExcel(){
  const rows = collectEmailingRows();
  if(rows.length===0) return;
  const headers = ['Client','Société','Email','Type','Contact'];
  const data = rows.map(r=>[r.client, r.societe, r.email, r.type, r.type==='Contact'?r.contact:'']);
  const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Emails');
  XLSX.writeFile(wb, `emails_${todayStr()}.xlsx`);
  showToast('Export réalisé.');
}

function visibleClientsList(){
  const q = ui.clientsSearch.toLowerCase();
  let list = state.clients.filter(c=>clientMatchesSearch(c,q));
  if(ui.clientsStatusFilter==='actifs') list = list.filter(c=>c.actif!==false);
  if(ui.clientsStatusFilter==='inactifs') list = list.filter(c=>c.actif===false);
  if(ui.clientsFamilleFilter && ui.clientsFamilleFilter!=='all'){
    const target = ui.clientsFamilleFilter.trim().toLowerCase();
    list = list.filter(c=>(c.famille||'').trim().toLowerCase()===target);
  }
  if(ui.clientsSousFamilleFilter && ui.clientsSousFamilleFilter!=='all'){
    const target = ui.clientsSousFamilleFilter.trim().toLowerCase();
    list = list.filter(c=>(c.sousFamille||'').trim().toLowerCase()===target);
  }
  if(ui.clientsDepartementFilter && ui.clientsDepartementFilter!=='all'){
    list = list.filter(c=>clientDepartement(c)===ui.clientsDepartementFilter);
  }
  const sortBy = state.settings.clientsSortBy || 'name';
  if(sortBy==='company'){
    list.sort((a,b)=>(a.company||a.name).localeCompare(b.company||b.name) || a.name.localeCompare(b.name));
  } else {
    list.sort((a,b)=>a.name.localeCompare(b.name));
  }
  return list;
}
function toggleClientSelect(id, checked){
  ui.clientsSelected = ui.clientsSelected || {};
  if(checked) ui.clientsSelected[id] = true;
  else delete ui.clientsSelected[id];
  render();
}
function toggleClientSelectAll(checked){
  ui.clientsSelected = ui.clientsSelected || {};
  const list = visibleClientsList();
  if(checked) list.forEach(c=>{ ui.clientsSelected[c.id] = true; });
  else list.forEach(c=>{ delete ui.clientsSelected[c.id]; });
  render();
}
function deleteSelectedClients(){
  const ids = Object.keys(ui.clientsSelected||{}).filter(id=>ui.clientsSelected[id]);
  if(ids.length===0) return;
  if(!confirm(`Supprimer ${ids.length} client(s) sélectionné(s) et leur historique ? Retrouvables dans la Corbeille.`)) return;
  state.clients.filter(c=>ids.includes(c.id)).forEach(c=>moveToTrash('client', clientDisplayName(c)||'(sans nom)', c));
  state.clients = state.clients.filter(c=>!ids.includes(c.id));
  ui.clientsSelected = {};
  persist('clients');
  render();
  showToast('Client(s) déplacé(s) dans la Corbeille.');
}
function toggleClientGroupSelect(idsStr, checked){
  ui.clientsSelected = ui.clientsSelected || {};
  idsStr.split(',').forEach(id=>{ if(checked) ui.clientsSelected[id] = true; else delete ui.clientsSelected[id]; });
  render();

function renderClientsTableInner(){
  const list = visibleClientsList();
  ui.clientsSelected = ui.clientsSelected || {};
  if(list.length===0) return emptyState('◉','Aucun client trouvé','Ajoutez votre premier client pour démarrer le suivi CRM.');
  const prefs = clientColumnsPrefs();
  const cols = CLIENT_TABLE_COLUMNS.filter(c=>prefs[c.key]);
  const sortBy = state.settings.clientsSortBy || 'name';

  // Une ligne = une société : les fiches partageant la même société (ex. plusieurs agences "REXEL" saisies séparément)
  // sont regroupées en une seule ligne. Le détail des contacts vit uniquement dans "Personnes à contacter".
  const withCompany = list.filter(c=>c.company && c.company.trim());
  const withoutCompany = list.filter(c=>!(c.company && c.company.trim()));
  const groupMap = new Map();
  withCompany.forEach(c=>{
    const key = c.company.trim().toLowerCase();
    if(!groupMap.has(key)) groupMap.set(key, {label:c.company.trim(), clients:[]});
    groupMap.get(key).clients.push(c);
  });
  const groups = Array.from(groupMap.values());
  withoutCompany.forEach(c=>groups.push({label:c.name||'—', clients:[c]}));

  // Fiche "primaire" du groupe (la plus complète) : sert de support pour la ville, la famille, le commercial, etc.
  const scoreOf = c => [c.adresse1,c.codePostal,c.ville,c.famille,c.sousFamille,c.typeClient,c.canalDistribution,c.commercialId,(c.contacts||[]).length].filter(Boolean).length;
  groups.forEach(g=>{ g.primary = g.clients.slice().sort((a,b)=>scoreOf(b)-scoreOf(a))[0]; });

  groups.sort((a,b)=>{
    if(sortBy==='name'){
      const an = contactFullName(primaryContact(a.primary)) || a.label, bn = contactFullName(primaryContact(b.primary)) || b.label;
      return an.localeCompare(bn,'fr',{sensitivity:'base'});
    }
    return a.label.localeCompare(b.label,'fr',{sensitivity:'base'});
  });

  const allIds = groups.flatMap(g=>g.clients.map(c=>c.id));
  const allChecked = allIds.length>0 && allIds.every(id=>ui.clientsSelected[id]);

  const rowsHtml = groups.map(g=>{
    const ids = g.clients.map(c=>c.id);
    const p = g.primary;
    const ca = g.clients.reduce((sum,c)=>sum+caForClient(c.id),0);
    const nbDevis = g.clients.reduce((sum,c)=>sum+state.devis.filter(d=>d.clientId===c.id).length,0);
    const nbContacts = g.clients.reduce((sum,c)=>sum+(c.contacts||[]).length,0);
    const inactive = g.clients.every(c=>c.actif===false);
    const groupChecked = ids.every(id=>ui.clientsSelected[id]);
    return `<tr style="cursor:pointer;${inactive?'opacity:.55;':''}${groupChecked?'background:var(--surface-2);':''}" onclick="openClientForm('${p.id}')" oncontextmenu="event.preventDefault(); openClientDetail('${p.id}');" title="Clic gauche : modifier la fiche — clic droit : voir la synthèse">
      <td onclick="event.stopPropagation();"><input type="checkbox" ${groupChecked?'checked':''} onchange="toggleClientGroupSelect('${ids.join(',')}', this.checked)"></td>
      <td style="font-weight:600;">${escapeHtml(g.label)}${g.clients.length>1?` <span class="helper">(${g.clients.length} fiches)</span>`:''}${inactive?' <span class="status-pill status-Refusé" style="margin-left:4px;">Inactif</span>':''}</td>
      <td style="color:var(--ink-soft);">${nbContacts} contact${nbContacts>1?'s':''}</td>
      ${cols.map(col=>`<td${col.key==='ca'?' class="num" style="font-weight:600;"':''}>${clientColumnCell(col.key,p,ca,nbDevis)}</td>`).join('')}
    </tr>`;
  }).join('');

  return `
    <div class="table-wrap"><table>
      <thead><tr>
        <th style="width:36px;"><input type="checkbox" ${allChecked?'checked':''} onchange="toggleClientSelectAll(this.checked)"></th>
        <th>Société</th>
        <th>Contacts</th>
        ${cols.map(c=>`<th>${escapeHtml(c.label)}</th>`).join('')}
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
  `;
}

function searchExistingCompanyForNewClient(q){
  q = (q||'').trim().toLowerCase();
  const box = document.getElementById('f_companySearchNewResults');
  if(!box) return;
  if(!q){ box.innerHTML=''; return; }
  // Une "société" existante = une fiche client dont le champ Société est renseigné ; on ne garde qu'un exemplaire par société.
  const seen = new Map();
  state.clients.forEach(cl=>{
    const company = (cl.company||'').trim();
    if(!company || seen.has(company.toLowerCase())) return;
    if(company.toLowerCase().includes(q)) seen.set(company.toLowerCase(), cl);
  });
  const results = Array.from(seen.values()).slice(0,15);
  if(results.length===0){ box.innerHTML = `<div class="autocomplete-list"><div class="autocomplete-item">Aucune société existante trouvée</div></div>`; return; }
  box.innerHTML = `<div class="autocomplete-list">${results.map(cl=>`
    <div class="autocomplete-item" onmousedown="applyExistingCompanyToNewClient('${cl.id}')">
      <span class="ref">${escapeHtml(cl.company)}</span>
      <div class="desig">${escapeHtml([cl.adresse1||cl.address, cl.codePostal, cl.ville].filter(Boolean).join(' '))}</div>
    </div>
  `).join('')}</div>`;
}
function applyExistingCompanyToNewClient(clientId){
  const ref = state.clients.find(x=>x.id===clientId);
  if(!ref) return;
  const setVal = (id, val)=>{ const el = document.getElementById(id); if(el) el.value = val||''; };
  setVal('f_company', ref.company||'');
  setVal('f_adresse1', ref.adresse1||ref.address||'');
  setVal('f_adresse2', ref.adresse2||'');
  setVal('f_cp', ref.codePostal||'');
  setVal('f_ville', ref.ville||'');
  setVal('f_pays', ref.pays||'');
  setVal('f_famille', ref.famille||'');
  setVal('f_sousFamille', ref.sousFamille||'');
  setVal('f_segment', ref.segment||'');
  setVal('f_typeClient', ref.typeClient||'');
  setVal('f_canalDistribution', ref.canalDistribution||'');
  setVal('f_site', ref.siteInternet||'');
  const commercialSel = document.getElementById('f_commercialId');
  if(commercialSel) commercialSel.value = ref.commercialId||'';
  const searchInput = document.getElementById('f_companySearchNew');

function saveClient(id){
  const company = document.getElementById('f_company').value.trim();
  if(!company){ showToast('La société est requise.'); return; }
  const name = document.getElementById('f_name').value.trim() || company;
  const data = {
    name,
    company,
    adresse1: document.getElementById('f_adresse1').value.trim(),
    adresse2: document.getElementById('f_adresse2').value.trim(),
    codePostal: document.getElementById('f_cp').value.trim(),
    ville: document.getElementById('f_ville').value.trim(),
    pays: document.getElementById('f_pays').value.trim(),
    acceptEmailing: document.getElementById('f_acceptEmailing').checked,
    siteInternet: document.getElementById('f_site').value.trim(),
    telephonePrincipal: document.getElementById('f_telephonePrincipal').value.trim(),
    emailPrincipal: document.getElementById('f_emailPrincipal').value.trim(),
    famille: document.getElementById('f_famille').value.trim(),
    sousFamille: document.getElementById('f_sousFamille').value.trim(),
    segment: document.getElementById('f_segment').value.trim(),
    typeClient: document.getElementById('f_typeClient').value.trim(),
    canalDistribution: document.getElementById('f_canalDistribution').value.trim(),

    actif: !document.getElementById('f_inactif').checked,
    contacts: clientDraftContacts,
  };
  if(id){
    const existing = state.clients.find(x=>x.id===id);
    Object.assign(existing, data);
    // Nettoyage : ces champs de contact (désormais gérés uniquement via "Personnes à contacter") ne doivent plus traîner sur la fiche société.
    delete existing.civilite; delete existing.prenom; delete existing.fonction;
    delete existing.telephone; delete existing.portable; delete existing.email;

    state.clients.push({id:uid(), history:[], ...data});
  }
  persist('clients');

  render();
  showToast('Client enregistré.');
}
